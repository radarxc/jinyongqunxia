<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天书录 rig 关键点修正</title>
<style>
body{font:14px system-ui,sans-serif;background:#25231f;color:#eee;margin:20px}main{display:flex;gap:20px}
canvas{background:#e6e1d8;max-height:82vh;max-width:65vw;cursor:crosshair}.panel{width:330px}
button,input{margin:4px 0}textarea{width:100%;height:55vh;font:12px ui-monospace,monospace}
.hint{color:#cbbfae;line-height:1.5}.bad{color:#ffb0a5}
</style></head><body>
<h1>rig 关键点修正（本地、无服务器）</h1>
<p class="hint">选择拆栏 PNG 与 keypoints.yaml；拖动圆点，确认袍下髋/膝后导出 YAML。</p>
<main><section><canvas id="canvas" width="256" height="480"></canvas></section>
<section class="panel"><label>PNG <input id="imageFile" type="file" accept="image/png"></label><br>
<label>YAML <input id="yamlFile" type="file" accept=".yaml,.yml,text/yaml"></label><br>
<button id="download">导出 keypoints.yaml</button><div id="status" class="hint"></div>
<textarea id="output" spellcheck="false"></textarea></section></main>
<script>
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),points={},meta={};let image=null,drag=null;
function parseYAML(text){const lines=text.split(/\r?\n/);let current=null;for(const line of lines){
 const m=line.match(/^  ([A-Za-z0-9_]+):\s*$/);if(m){current=m[1];continue}
 const xy=line.match(/^    xy:\s*\[?\s*(-?\d+(?:\.\d+)?),?\s*(-?\d+(?:\.\d+)?)?\]?/);
 if(xy&&current&&xy[2])points[current]={xy:[+xy[1],+xy[2]],confidence:.5,source:'manual'};
 const list=line.match(/^    - (-?\d+(?:\.\d+)?)$/);if(list&&current){const p=points[current]??={xy:[],confidence:.5,source:'manual'};if(p.xy.length<2)p.xy.push(+list[1]);}
 const top=line.match(/^(view|facing):\s*(\w+)/);if(top)meta[top[1]]=top[2];}render();}
function yaml(){let s=`schema: tianshu-rig-keypoints.v1\ncoordinates: source\nview: ${meta.view||'front34'}\nfacing: ${meta.facing||'L'}\nimageSize: [${canvas.width}, ${canvas.height}]\ndetector: manual-corrected\nkeypoints:\n`;
 for(const [name,p] of Object.entries(points))s+=`  ${name}:\n    xy: [${Math.round(p.xy[0])}, ${Math.round(p.xy[1])}]\n    confidence: 1.0\n    source: manual\n`;return s}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(image)ctx.drawImage(image,0,0,canvas.width,canvas.height);
 ctx.font='11px system-ui';for(const [name,p] of Object.entries(points)){ctx.beginPath();ctx.arc(...p.xy,5,0,Math.PI*2);ctx.fillStyle='#e34839';ctx.fill();ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='#111';ctx.fillText(name,p.xy[0]+7,p.xy[1]-6)}document.querySelector('#output').value=yaml()}
document.querySelector('#imageFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{image=im;canvas.width=im.width;canvas.height=im.height;render();URL.revokeObjectURL(u)};im.src=u};
document.querySelector('#yamlFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(parseYAML)};
canvas.onpointerdown=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;drag=Object.entries(points).sort((a,b)=>Math.hypot(a[1].xy[0]-x,a[1].xy[1]-y)-Math.hypot(b[1].xy[0]-x,b[1].xy[1]-y))[0]?.[0]};
canvas.onpointermove=e=>{if(!drag)return;const r=canvas.getBoundingClientRect();points[drag].xy=[(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];render()};
canvas.onpointerup=canvas.onpointerleave=()=>drag=null;
document.querySelector('#download').onclick=()=>{const blob=new Blob([yaml()],{type:'text/yaml'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='keypoints.yaml';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
