<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>外放特效 · 帧序列演示</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: #211f1b; color: #efe6d2;
       font: 16px/1.6 system-ui, sans-serif; }
main { max-width: 960px; margin: auto; }
h1 { font-size: 20px; margin: 0 0 12px; }
canvas { display: block; width: 100%; height: auto; border: 1px solid #817566; }
.controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
button, select { min-height: 44px; padding: 8px 16px; font: inherit;
                 color: #efe6d2; background: #4a433c; border: 1px solid #817566; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #d3ae62; }
label { min-height: 44px; display: inline-flex; align-items: center; gap: 8px; }
p { color: #c7bcaa; font-size: 14px; }
</style>
<main>
<h1>外放特效 · 帧序列演示</h1>
<canvas id="canvas" aria-label="外放效果动画；未播放或减少动态时显示峰值静帧"></canvas>
<div class="controls">
<button id="play" type="button" disabled>播放</button>
<button id="pause" type="button" disabled>暂停</button>
<label>速度 <select id="speed" aria-label="播放速度">
<option value="0.25">0.25×</option><option value="0.5">0.5×</option>
<option value="1" selected>1×</option><option value="2">2×</option>
</select></label>
<label><input id="reduce" type="checkbox">减少动态（峰值静帧）</label>
</div>
<p id="status" role="status">正在解码内嵌图片…</p>
<p>仅播放图片帧；循环与速度不代表游戏事件、伤害次数或战斗时钟。</p>
</main>
<script id="vfx-data" type="application/json">__VFX_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("vfx-data").textContent);
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d");
const play = document.getElementById("play"), pause = document.getElementById("pause");
const reduce = document.getElementById("reduce"), speed = document.getElementById("speed");
const status = document.getElementById("status");
canvas.width = data.size[0]; canvas.height = data.size[1];
const preference = matchMedia("(prefers-reduced-motion: reduce)");
reduce.checked = preference.matches;
let frames = [], peak = null, running = false, elapsed = 0, previous = null;
let lastDrawn = null;
function decode(uri) {
  return new Promise((resolve, reject) => {
    const image = new Image(); image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("内嵌 WebP 解码失败")); image.src = uri;
  });
}
function draw(image) {
  if (image && image !== lastDrawn) {
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0); lastDrawn = image;
  }
}
function staticFrame() {
  running = false; previous = null; elapsed = 0; draw(peak);
  status.textContent = "峰值静帧";
}
function tick(now) {
  if (running && !reduce.checked) {
    if (previous !== null) elapsed += (now - previous) / 1000 * Number(speed.value);
    previous = now;
    const period = data.duration + data.gap;
    if (data.loop && elapsed >= period) elapsed %= period;
    if (!data.loop && elapsed >= data.duration) {
      elapsed = data.duration; running = false; previous = null;
    }
    let index = data.times.length - 1;
    while (index > 0 && data.times[index] > elapsed) index--;
    draw(frames[index]);
    status.textContent = `${Math.min(elapsed, data.duration).toFixed(2)} / ${data.duration.toFixed(2)} 秒`;
  }
  requestAnimationFrame(tick);
}
play.addEventListener("click", () => {
  if (reduce.checked) { staticFrame(); return; }
  if (elapsed >= data.duration) elapsed = 0;
  running = true; previous = null;
});
pause.addEventListener("click", () => { running = false; previous = null; });
reduce.addEventListener("change", staticFrame);
preference.addEventListener("change", event => { reduce.checked = event.matches; staticFrame(); });
document.addEventListener("visibilitychange", () => { previous = null; });
Promise.all([...data.frames, data.peak].map(decode)).then(images => {
  peak = images.pop(); frames = images; play.disabled = false; pause.disabled = false;
  staticFrame(); requestAnimationFrame(tick);
}).catch(error => { status.textContent = error.message; });
</script>
</html>
