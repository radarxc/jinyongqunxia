    main:
      title: 越女剑序章
      opening: 雨夜入书
      prologue_mode: 选择序章方式
      skip_summary: 越地七幅
      skip_direct: 一页千年
      full_complete: 梦别越地
      summary_complete: 摘要读毕
      skip_complete: 直抵初眠
    choice:
      dc_00_01: 如何走过序章
    dc00_01:
      full: 完整序章
      summary: 交互摘要
      skip: 直接跳过
      confirm:
        full: 可快进已读表现；传功与配点不会被快进跳过。
        summary: 会跳过可玩教学，不跳过主线功法与属性确认。
        skip: 不会获得序章武学；补完传功与初眠后进入白马。
quest:
  q_00_main_c_01:
    title: 入书寻青
    objective:
      wake: 在越地竹林醒来，确认周围情形。
      find_aqing: 循羊铃声寻找竹林中的少女。
      accept_staff: 拾取竹棒并收下章内补给。
  q_00_main_c_02:
    title: 竹林试步
    objective:
      initial_battle: 击退拦路剑士，完成首次战斗教学。
      track: 循痕迹前往猿迹山径。
      baiyuan_choice: 选择投果、切磋或绕路。
      baiyuan_spar: 与白猿非致死切磋；可主动认输。
      merge: 与阿青汇合，继续前往越营。
  q_00_main_c_03:
    title: 越营观剑
    objective:
      meet_fanli: 在越营听取范蠡的请求。
      drill: 观看越卒试阵并了解友军阵位。
      biandao: 制服边道拦截者，不处决、不掠夺。
      sword_demo: 完成越女剑教学投影。
      nine_preview: 查看九层功法远景；预览不等于习得。
  q_00_main_c_04:
    title: 一梦千年
    objective:
      transmission: 在越营传功墨点接受阿青传授第一层。
      save_export: 检查存档与导出；普通游玩可稍后导出。
      northbound: 离开越地，循山路北行。
      avalanche: 经历雪崩并进入长白山雪穴。
      allocation: 分配六项根基，确认总和为三百。
      sleep_commit: 确认初眠配点并原子提交。
      wake: 一千一百八十四年后醒来，继续西行。
