# 竹林初阵（原创扩展）；归属：docs/design/chapters/00-yuenv.md §5.1–§5.2。
# 灰盒依赖（mockRef）：ENG-npc-species-roleslot、ENG-26 的内容字段表 / 宿主接线。
# 暂不发布；晋升条件及尚未机读的教学节拍见 ../README.md。
schemaVersion: encounter.v1
id: enc_00_zhulin
chapterId: ch00_yuenv
kind: story
arena:
  kind: regionArena
  regionId: rg_jiangnan_taihu
  sceneId: sc_00_zhulin
  arenaId: arena_00_zhulin
participants:
  - unitRef: hero
    source: {kind: character, characterRef: protagonist}
    side: player
    control: player
    spawnId: spawn_hero
    state: active
    required: true
    placement: {pos: {q: 7, r: 7}, facing: 0}
  - unitRef: road_swordsman_1
    source: {kind: template, templateId: tmpl_normal, dreamLevel: 1}
    side: enemy
    control: ai
    spawnId: spawn_road_swordsman_1
    state: active
    required: true
    group: role_road_swordsman
    placement: {pos: {q: 10, r: 7}, facing: 3}
  - unitRef: road_swordsman_2
    source: {kind: template, templateId: tmpl_normal, dreamLevel: 1}
    side: enemy
    control: ai
    spawnId: spawn_road_swordsman_2
    state: active
    required: true
    group: role_road_swordsman
    placement: {pos: {q: 10, r: 6}, facing: 3}
outcome:
  win: [{kind: allHostileDown, side: player}]
  lose: [{kind: unitDown, unitRef: hero}]
  draw: []
  onDefeat: retry
  concede: forbidden
rules:
  mode: normal
  noAuto: true
  noRetreat: true
  noItems: false
  mercyAllowed: true
  lethalIntent: false
  friendlyFire: false
  roundLimit: 30
  boss: false
  retry: true
  skippable: false
beats:
  - id: aqing_rescue
    once: true
    when: {kind: hpBelow, unitRef: hero, thresholdBp: 4500}
    actions: [{kind: emit, event: battle/aqingRescue}]
  - id: terrain_hint
    once: true
    when: {kind: lossStreak, count: 2}
    actions: [{kind: emit, event: battle/terrainHint}]
  - id: spirit_demo
    once: true
    when: {kind: lossStreak, count: 3}
    actions: [{kind: offerDemonstration, replayId: replay_zhulin_demo}]
difficulty:
  localDifficulty: 1
  # 8500 + 500 × 1 = 9000 bp；D1 只乘模板敌人的气血与内外攻击。
  enemyStatBp: 9000
  modes:
    diff_jianghu: {hpBp: 8000, attackBp: 8000}
    diff_xiake: {hpBp: 10000, attackBp: 10000}
    diff_zongshi: {hpBp: 12000, attackBp: 11200}
