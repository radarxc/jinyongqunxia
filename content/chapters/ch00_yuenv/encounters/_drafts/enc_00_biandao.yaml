# 越卒仅上场 1 名 AI 友军；阿青双投影在胜后由剧情开启，不塞入此战，见 ../README.md。
schemaVersion: encounter.v1
id: enc_00_biandao
chapterId: ch00_yuenv
kind: story
arena:
