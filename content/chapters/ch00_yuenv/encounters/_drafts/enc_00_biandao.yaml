  regionId: rg_jiangnan_taihu
  sceneId: sc_00_yueying
  arenaId: arena_00_biandao
participants:
  - unitRef: hero
    source: {kind: character, characterRef: protagonist}
    side: player
    control: player
    spawnId: spawn_hero
    state: active
    required: true
    placement: {pos: {q: 4, r: 9}, facing: 0}
  - unitRef: yue_soldier_1
    source: {kind: template, templateId: tmpl_normal, dreamLevel: 2}
    side: ally
    control: ai
    spawnId: spawn_yue_soldier_1
    state: active
    required: true
    group: role_yue_soldier
    placement: {pos: {q: 3, r: 9}, facing: 0}
  - unitRef: wu_swordsman_1
    source: {kind: template, templateId: tmpl_normal, dreamLevel: 2}
    side: enemy
    control: ai
    spawnId: spawn_wu_swordsman_1
    state: active
    required: true
    group: role_wu_swordsman
    placement: {pos: {q: 7, r: 9}, facing: 3}
  - unitRef: wu_swordsman_2
    source: {kind: template, templateId: tmpl_normal, dreamLevel: 2}
    side: enemy
    control: ai
    spawnId: spawn_wu_swordsman_2
    state: active
    required: true
    group: role_wu_swordsman
    placement: {pos: {q: 7, r: 10}, facing: 3}
outcome:
  win: [{kind: allHostileDown, side: player}]
  lose: [{kind: unitDown, unitRef: hero}]
  draw: []
  onDefeat: retry
  concede: forbidden
rules:
  mode: normal
  noAuto: true
  noRetreat: true
  noItems: false
  mercyAllowed: true
  lethalIntent: false
  friendlyFire: false
  roundLimit: 30
  boss: false
  retry: true
  skippable: false
