  - 复原依据：docs/design/town/history/city_yulin__southern_song_jin_mongol.md；现代榆林仅作区域节点，不等同13世纪具名榆林城。
  - 《地理学报》与地方志均显示今榆阳区在金/西夏边界带，现代榆林城作为城镇节点到明成化前后才成立。
  - 无同期聚落平面；以边界军寨兼驿聚落推定，不借统万城、绥德州或明榆林卫的城垣冒名。
