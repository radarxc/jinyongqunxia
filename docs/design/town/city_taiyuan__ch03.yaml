  prosperity: major_prefectural_capital_candidate
  notes:
  - 复原依据：docs/design/town/history/city_taiyuan__southern_song_jin_mongol.md；1217年金代太原府城拓扑缩景。
  - 本城是982年在唐明镇营建、金代沿用的宋金太原城；不是979年被毁的晋阳旧城，也不是明代扩城。
  - 金代晋阳志佚文支持罗城、城西子城、四门及门街关系；所有格坐标、分区与建筑落点均非同期测绘。
