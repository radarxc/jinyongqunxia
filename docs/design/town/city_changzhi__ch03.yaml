design_intent:
  prosperity: major_prefectural_seat_candidate
  notes:
  - 复原依据：docs/design/town/history/city_changzhi__southern_song_jin_mongol.md；1259年蒙古时期潞州治沿用本年代带拓扑候选。
  - 金末以后曾称隆德府，1231年复潞州；地方志证隋筑西北子城，但未取得1217战损后至1259年的重筑平面。
  - 复用大城与西北子城关系仅为审慎候选；精确墙线、门位、州署院落及修复程度均逐项标推定。
