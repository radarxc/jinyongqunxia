- {key: src_later_gazetteer, kind: gazetteer, title: "万历《潞安府志》城池材料（长治市政府转述）", url: "https://www.changzhi.gov.cn/zjzz/cyzz/tszz/201705/t20170526_364359.shtml", accessed: "2026-10-04", confidence: pending_review, supports: [later_citadel_tradition, later_four_gate_tradition], note: "正文已读；载西北子城传统、旧土城四门及州署沿革，同时明确金元之际兵毁、现存上党门为明代重建；故只作回溯线索，不证明1259墙线、门位、门楼或院落。"}

