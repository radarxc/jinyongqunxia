- {key: src_jinshi, kind: academic, title: "《金史》卷二十六·地理下", url: "https://zh.wikisource.org/wiki/金史/卷26", accessed: "2026-10-04", confidence: verified_summary, supports: [jin_administration], note: "正文已读；潞州为上州，治附郭上党县，天会六年兼潞南辽沁观察处置使，领八县；仅作前金行政锚点，不提供1259城墙或街坊平面。"}
