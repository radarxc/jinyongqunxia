design_intent:
  prosperity: major_candidate
  notes:
  - 复原依据：docs/design/town/history/city_yanan__southern_song_jin_mongol.md；金代延安府领肤施县，治所在今延安市。
  - 府城按河西、凤凰山麓、东临延河的关系作非等比拓扑缩景；未取得13世纪同期实测平面。
  - 城垣折点、两处可玩出入口、街巷和功能分区均标推定；不把后世门名倒置到1223年。
