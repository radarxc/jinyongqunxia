design_intent:
  prosperity: major_candidate
  notes:
  - 复原依据：docs/design/town/history/city_huayin__southern_song_jin_mongol.md；1259年蒙古统治期华阴县治沿用同年代带拓扑候选。
  - 华阴县不是前金华州州治郑县；本图只画县城，不把华山峰岳、山道或西岳庙景区并入城内。
  - 未取得金亡后至1259年的重筑平面；复用1217拓扑仅为审慎候选，不宣称城垣四十年不变。
