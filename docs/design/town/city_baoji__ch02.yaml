design_intent:
  prosperity: major_candidate
  notes:
  - 复原依据：docs/design/town/history/city_baoji__southern_song_jin_mongol.md；1217年金凤翔府属宝鸡县治历史拓扑缩景。
  - 613年陈仓县治迁留谷城，757年改名宝鸡；本图锚定后来的宝鸡县治，不把先秦陈仓上、下城或东二十里故城拼作金代县城。
  - 《金史》列陈仓山、渭水、汧水、大散关和武城镇，均作区域地理锚点；县城城垣、门街与坊区无同期平面，全部标推定。
