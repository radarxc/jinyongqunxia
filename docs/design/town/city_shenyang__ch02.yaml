- {"key": "src_jinshi", "kind": "academic", "title": "《金史》卷一百三·列传四十一（网页点校本）", "url": "https://m.gushiwen.cn/guwen/bookv_cd935b4a2e7f.aspx", "accessed": "2026-10-04", "confidence": "verified_summary", "supports": ["historical_topology"], "note": "已读纥石烈桓端传：贞祐三年蒲鲜万奴取东京沈澄诸州，支持1217不能无条件表现安定金州城；逐年守方及毁修未定。"}
