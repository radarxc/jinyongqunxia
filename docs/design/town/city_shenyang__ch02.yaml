sources:
- {"key": "src_history", "kind": "academic", "title": "新华网《环球》：沈阳方城：探索古城复兴和城市更新4.0版本", "url": "http://www.news.cn/globe/2023-11/15/c_1310750164.htm", "accessed": "2026-10-04", "confidence": "verified_summary", "supports": ["historical_topology"], "note": "已读正文；方形土城、十字街、金代驿署及13世纪毁后重建。建城年与另一文有差异，未采用该绝对年。"}
