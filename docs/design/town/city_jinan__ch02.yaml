- {key: src_jinshi, kind: academic, title: "《金史》卷二十五·地理中", url: "http://www.guoxue123.com/shibu/0101/00jinsf/025.htm", accessed: "2026-10-04", confidence: verified_summary, supports: [jin_administration], note: "正文已读；济南府属山东东路、治历城，领县七镇二十九；不提供城墙、门或街坊平面。"}
- {key: src_sdu, kind: academic, title: "山东大学：济南古城的起源与城垣变迁", url: "https://www.view.sdu.edu.cn/info/1021/166807.htm", accessed: "2026-10-04", confidence: verified_summary, supports: [wall_evolution, city_function, visual_reference], note: "正文与讲座投影照片已读已看图；证西晋双子城、唐中叶合并为不规则城圈、宋金元肌理与功能深化。投影图主要表现更早双子城，仅用来理解长期地形关系，不作1217控制点。"}
- {key: src_modulus, kind: academic, title: "汪凯等：济南古城景观的模数控制与变化探讨", url: "http://www.lalavision.com/article/doi/10.12409/j.fjyl.202207060386", accessed: "2026-10-04", confidence: verified_summary, supports: [irregular_wall, water_constraints, gate_relations], note: "正文摘要、全文搜索片段及附图说明已读；支持唐宋扩城与泉水地形制约，关于南西北门偏位主要来自明清长期格局研究，故只作弱回溯关系，不用其精确模数或门址。"}
