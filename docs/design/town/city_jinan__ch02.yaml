- {key: src_hydrology, kind: academic, title: "济南地区水文环境的演化及其规律研究", url: "http://rwdl.xisu.edu.cn/CN/article/downloadArticleFile.do?attachType=PDF&id=9196", accessed: "2026-10-04", confidence: verified_summary, supports: [xiaoqing_dredging, northern_hydrology], note: "六页论文PDF已实际下载；搜索摘要与正文可读信息支持刘豫时期利用旧河道浚通小清河、北郊水势变化。不提供金代城内平面或可配准岸线。"}
