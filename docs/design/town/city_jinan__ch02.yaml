  prosperity: major_prefectural_seat_candidate
  notes:
  - 复原依据：`docs/design/town/history/city_jinan__southern_song_jin_mongol.md`；1217年金山东东路济南府治历城的拓扑缩景。
  - 山东大学讲座与论文支持唐中叶合城后宋金元延续不规则城圈；金初小清河使北郊水势下降，大明湖名见金代。
  - 保留城北湖面、南高北低排水和不规则城圈；明清门名、府城图与精确街巷绝不倒推为金代控制点。
