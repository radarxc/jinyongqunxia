<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天书录 · 沉浸界面第二版</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#dedbd3;color:#302e29;font:16px/1.6 'Songti SC',serif}header{padding:14px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}h1{font-size:18px;font-weight:400;margin:0}a{color:inherit;text-underline-offset:5px;min-height:44px;display:inline-flex;align-items:center}label{cursor:pointer;display:inline-flex;align-items:center;min-height:44px;padding:0 12px}input{position:absolute;width:1px;height:1px;opacity:0}input:focus-visible+label{outline:3px double #375e62}input:checked+label{color:#933f30;text-decoration:underline;text-underline-offset:8px}.review{margin:0;padding:0 24px 24px;overflow:auto}.artboard{display:none;margin:0 auto;width:max-content}.artboard p{margin:4px 0 10px;font-size:14px}iframe{display:block;border:0;background:#eee5d1}body:has(#wide:checked) .wide,body:has(#phone:checked) .phone,body:has(#both:checked) .artboard{display:block}body:has(#both:checked) .review{display:flex;align-items:flex-start;gap:24px}.note{padding:0 24px 18px;margin:0;font-size:14px}@media(max-width:600px){header{padding:8px 12px;gap:4px 10px}h1{width:100%}.review{padding:0;max-width:100vw}.note{padding:12px}label{padding:0 7px}}

<body>
<!-- AR-48：同一份 HTML/CSS 在两种固定视口中重排；画板外是审阅控件，不进入游戏。 -->
<header><h1>天书录 · 第二版样稿</h1>
<input type="radio" name="viewport" id="wide"><label for="wide">横屏 1280×720</label>
<input type="radio" name="viewport" id="phone" checked><label for="phone">竖屏 390×844</label>
<input type="radio" name="viewport" id="both"><label for="both">并排对照</label>
<a href="scene.html">随窗口预览</a></header>
<main class="review">
<figure class="artboard wide"><p>横屏 · 1280 × 720</p><iframe src="scene.html" title="1280×720 横屏样稿" width="1280" height="720"></iframe></figure>
<figure class="artboard phone"><p>竖屏 · 390×844</p><iframe src="scene.html" title="390×844 竖屏样稿" width="390" height="844"></iframe></figure>
</main>
<p class="note">顶部切换大地图、城镇与战斗；底部翻阅六类工具。纯静态方向稿，数值与地名位置为排版示意。说明见 <a href="README.md">README</a>。</p>
