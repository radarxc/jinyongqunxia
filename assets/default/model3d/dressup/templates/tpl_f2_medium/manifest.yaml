  notes: >-
    T4（作者 2026-10-11「基础素体要更美观，现在的素体斜方肌太明显」）新女性中等素体，
    是替换 tpl_f_* 的候选：与 tpl_f_medium 同为 65 关节、rest=bind、+Z、原地 idle/walk/run，
    颈更细更长、斜方肌低平、肩线更宽平。衣物 / 头 / 道具须按本骨架、环与区域 SHA 重新贴合并验收后
    才切换；在此之前运行时与已贴合素材仍以 tpl_f_medium / tall / small 为准。
    T5 按 E2c 点积口径翻正 89 个倒置面，复查为 0；只交换索引，顶点 / 法线 / UV / 权重 / 贴图 / 骨架字节不变。
    T4b（作者 2026-10-11「男女脖子都太粗……参考逆水寒」「算法要平滑，否则有突变」，女按平滑雕塑 v3 定稿）：
    sculpt_neck.py 约束式双调和位移场把颈加长 15 mm、颈中段收细（前 0.97 / 侧 0.87 / 后 0.88），头部整体上移、Head 关节同步上移，
    拓扑 / UV / 权重 / 动画轨不变；颈宽 / 头宽 0.571 → 0.475（逆水寒女约 0.5），0 翻面、二面角变化最大 8.3°。
    身高按 1.66 m 重导出（heightMu 随颈加长变大、mPerMu 相应变小）；T5 按 T5b section 重导骨架，ringSha / skeletonSha 已刷新，区域与颅形 SHA 不变。
    T4b 审核后按 tech/11 模板契约转 KHR_materials_unlit、只留 baseColor（见 unlit 块）。
    已解决：旧派生颈环差超限与反向面，经 T5b 新工具重派生 small / tall，section 两轴最大差 1.664 / 1.835 mm，翻向与负点积面均为 0。
    section 环取 Neck→Head 骨段 15% 处实际闭合截面；四派生均带 --ring-from，实际截面半径不手改。
    已解决：tests_derive.py 的 bulk 脚底误报已按获准补丁修复，10/10 回归及 pnpm check 通过；候选状态保留，后续重贴合与默认切换见 T5 报告第 7 节。
    T6 以 waist-band 模式重导胸 / 腰插槽；自然腰线按躯干截面最小周长派生，其余骨架字段不变。
