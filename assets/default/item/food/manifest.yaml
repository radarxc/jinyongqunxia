    用途：武侠游戏《天书录》default风格包的物品图鉴插画，可供后续图标裁切。

    题材：精米（it_jingmi），食材·谷物，黄阶；出处语境：（原创扩展）。

    年代：未锁定单一书界；采用前现代中国武侠通用器皿，未使用人物服饰或建筑断代。 年代依据为docs/design/02-timeline-and-world-tiers.md §1.5与名录出处；名录标原创扩展者只作原创武侠器物，不宣称原著或文物复原。

    主体：乳白米粒盛小竹斗，少量谷壳，朴素市集尺度 （原创扩展）。食材只画一份原料；食品只画一份可辨菜点和必要盘碗、油纸或食盒；熟食与生料不混同。效果字段只用于理解用途，不画数值、文字、图标或魔法特效。

