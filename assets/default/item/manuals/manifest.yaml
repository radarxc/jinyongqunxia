  subject: 白虹掌力藏本（武学秘籍，地阶）
  prompt: 生成一张 1:1 图片。画风：写实古风绘画，与写实武侠人物立绘一致——真实材质质感（布料的经纬纹理、毛边与洗旧褪色，金属的冷光、锻打痕与细微锈蚀，皮革的皱纹、磨损与油亮，木、玉、瓷、纸的真实肌理），柔和的体积光影与自然明暗，低饱和沉稳设色，手绘写实概念画质感；不是线稿、不是平涂、不是卡通、不是照片。背景：均匀平涂的浅暖灰底色（约 RGB 230,225,216），无纸纹、无暗角、无边框、无渐变、无地面、无投影、无场景（后续要程序抠图）。 题材：武侠游戏物品图鉴里的「白虹掌力藏本」（秘籍·残本，地阶；出处：《天龙八部》·李秋水武学；藏本），单一完整物品、无人持用，正面略三分之四视角居中，四边留白至少 12%。 形制与外观：月白薄册带淡虹色纤维，不发光，曼陀山庄精致藏书感。合拢薄册；淡虹只来自纸纤维的极轻低饱和色差，禁止虹光、光晕和真正彩虹图案。一行一图，只画这一册秘籍及与其装帧不可分的护套、包角、夹板或夹页；保持单一完整物品。 秘籍专项：书衣必须是柔软纸或条目指定的绢纸、皮纸，显示封面、薄页口和细订线或经折结构；轻度旧化，边缘少量毛损。不得画厚硬皮革封壳、金属魔法书、粗绳或错误缝线。单册或名录明确的上下卷；柔软纸书衣、页口、细订线和轻旧化，封面题签上用端正楷书竖写书名「白虹掌力」，墨色，字迹清楚、笔画准确。 品阶表现：地 —— 稀有材质或名家工艺、精细纹理、旧而妥善保存的专属匣；局部玉／银／暗金；只用材质、工艺与旧化表达，不画光效。 年代与形制符合出处书界的时代，不混搭。 排除：人物、脸、手、人体、模特、衣架、支架、印章、logo、边框、品阶框；奇幻造型、日式或欧美风格、跨朝混搭、现代材料；霓虹、魔法、粒子、发光。除封面题签上的书名「白虹掌力」外，不要任何其他文字、伪字、印章、标注或说明栏（这是单独的物品图，不是设定稿）。
