    题签数量：整件只有一张题签、书名只写一次，描述里的字体（隶书、行楷等）只用于这张题签上的书名。 容器要求：品阶里的「专属匣」不用画；除非上面「形制与外观」写明了函套或木匣，否则只画书（或描述里的载体）本身，不要木匣、托盘、底座或任何容器；「局部玉／银／暗金」只做题签边框或书衣上的细小纹饰，不要金属包角、搭扣或玉扣。 件数要求：只画这一件主体，旁边和后面不要第二本书、第二卷、叠放的副本或散页。 合册要求：书完全合上、只露封面，书脊外侧和书后不要再出现任何书页或翻开的册页。 封面要求：封面（或卷外、函套外）除题签外是素面，描述里提到的图、谱、路线、格线、印痕、经脉等内页内容不要画在封面上，也不要任何小字或伪字。
