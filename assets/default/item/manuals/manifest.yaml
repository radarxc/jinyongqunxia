  prompt: 生成一张 1:1 图片。画风：写实古风绘画，与写实武侠人物立绘一致——真实材质质感（布料的经纬纹理、毛边与洗旧褪色，金属的冷光、锻打痕与细微锈蚀，皮革的皱纹、磨损与油亮，木、玉、瓷、纸的真实肌理），柔和的体积光影与自然明暗，低饱和沉稳设色，手绘写实概念画质感；不是线稿、不是平涂、不是卡通、不是照片。背景：均匀平涂的浅暖灰底色（约 RGB 230,225,216），无纸纹、无暗角、无边框、无渐变、无地面、无投影、无场景（后续要程序抠图）。 题材：武侠游戏物品图鉴里的「军伍短刀抄本」（秘籍·抄本，黄阶；出处：军中通行武学；抄本），单一完整物品、无人持用，正面略三分之四视角居中，四边留白至少 12%。 形制与外观：明代土黄线装册，四眼黑线，居中白纸签、粗楷，书衣油旧、八寸开本；旧化程度：中度；大小：八寸开本。单册或名录明确的上下卷；柔软纸书衣、页口、细订线和轻旧化，封面题签上用端正楷书竖写书名「军伍短刀」，墨色，字迹清楚、笔画准确。效果字段只用于理解用途，不画数值、文字、图标或魔法特效。 品阶表现：黄 —— 常见木、陶、麻、普通钢；结构实用，轻微使用痕，素包装；只用材质、工艺与旧化表达，不画光效。 年代与形制符合出处书界的时代，不混搭。 排除：人物、脸、手、人体、模特、衣架、支架、印章、logo、边框、品阶框；奇幻造型、日式或欧美风格、跨朝混搭、现代材料；霓虹、魔法、粒子、发光。除封面题签上的书名「军伍短刀」外，不要任何其他文字、伪字、印章、标注或说明栏（这是单独的物品图，不是设定稿）。 背景要求：整幅背景只有均匀平涂的浅暖灰，主体之外不要任何远景、虚影、云雾、淡色重影或重复的物体。 背景色要求：背景必须是很浅的暖灰（接近 RGB 230,225,216），不要偏暗、不要偏灰褐。 题签要求：题签上只写「军伍短刀」这 4 个字（不写引号、书名号或任何符号；用简体字），每个字完整清楚、笔画准确。 文字要求：整幅画面只有题签上这一处书名，书衣、书页、书脊、绢带、竹简、函套、包袱布上都不要任何其他字、伪字或字形。 形制要求：中国古籍形制（线装、包背装、蝴蝶装、卷轴或竹简），不要欧式书的包铜书角、金属搭扣、锁扣或镶宝石。 人物要求：画面里不要任何人物、人形、穴位人像或招式人像；书尽量合上或只露封面，若露出内页只画抽象线条与圈点。 题签数量：整件只有一张题签、书名只写一次，描述里的字体（隶书、行楷等）只用于这张题签上的书名。
    补充要求：背景必须整幅同一种明亮的浅暖灰（RGB 230,225,216），上下左右颜色完全一致，不要渐变或暗角；书是悬空的物品图，书底下不要阴影、不要地面。 简体要求：题签上的「军」必须写成现代简体，不要写成繁体「軍」。 件数要求：只画这一件主体，旁边和后面不要第二本书、第二卷、叠放的副本或散页。 合册要求：书完全合上、只露封面，书脊外侧和书后不要再出现任何书页或翻开的册页。 封面要求：封面（或卷外、函套外）除题签外是素面，描述里提到的图、谱、路线、格线、印痕、经脉等内页内容不要画在封面上，也不要任何小字或伪字。
