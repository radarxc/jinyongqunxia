    文字：封面、题签、书脊、布套和夹板全部无字、无伪字、无印章、无数字；名称只保留在元数据。

    排除项：文字、汉字、伪字、经文、书法、标题、数字、印章、签名、logo、文字水印；招式图、人物、手、人体、演员或画师姓名、具体影视或游戏造型、受保护作品复制；摄影、商品摄影、照片级写实、3D渲染、厚油画、硬皮魔法书、现代书脊、塑料、拉链、订书钉、粗绳、大面积龟裂、过度破损、散页堆；场景、桌面、地面、接触投影、落地影、渐变、底纹；第二件物品、道具堆叠、拼贴、多视图、透视畸变、裁切；UI、品阶框、数字数值、霓虹、bloom、光柱、光环、魔法阵、浮空粒子、巨大宝石、血腥。不要去除或伪造工具自身溯源标识。

