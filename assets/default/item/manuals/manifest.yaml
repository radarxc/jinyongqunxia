    补充要求：书衣是素净的灰白纸衣，封面上不要画棋盘或任何小字；若露出内页，棋谱只画空的格线，不要「楚河汉界」之类的小字、印记或伪字；书整体画小一些，四边至少留 12% 空白。 简体要求：题签上的「势」「门」必须写成现代简体，不要写成繁体「勢」「門」。 件数要求：只画这一件主体，旁边和后面不要第二本书、第二卷、叠放的副本或散页。 合册要求：书完全合上、只露封面，书脊外侧和书后不要再出现任何书页或翻开的册页。 封面要求：封面（或卷外、函套外）除题签外是素面，描述里提到的图、谱、路线、格线、印痕、经脉等内页内容不要画在封面上，也不要任何小字或伪字。
