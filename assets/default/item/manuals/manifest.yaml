    主体：素黄薄纸册，四眼细订线，空题签，边角轻磨，掌心略大（原创扩展）。掌心略大的合拢薄册；空题签必须完全空白。一行一图，只画这一册秘籍及与其装帧不可分的护套、包角、夹板或夹页；保持单一完整物品。

