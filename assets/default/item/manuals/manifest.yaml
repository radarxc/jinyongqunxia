    风格：清楚纤细的深灰墨线外轮廓，薄层透明罩染，克制而可辨的手绘笔触，低饱和冷暖关系；纸、布、绢、竹、细线材质边界清楚。二维精绘武侠器物，不是照片，不是3D。

