    形态要求：形态以「形制与外观」所写为准（卷轴、竹简、经折、帛卷、函套、石刻、铁板、泥人等照描述画），不要改画成线装书；上面「书尽量合上」只是指不要摊开内页。 题签数量：整件只有一张题签、书名只写一次，描述里的字体（隶书、行楷等）只用于这张题签上的书名。 补充要求：书名只在蓝布函套正面那一张题签上写一次；函套是包住四册书的蓝布硬套（四面裹布、无订线），四册经折本整齐收在套内、只露出上端或侧边，册子本身不要题签、不要任何字。 容器要求：品阶里的「专属匣」不用画；除非上面「形制与外观」写明了函套或木匣，否则只画书（或描述里的载体）本身，不要木匣、托盘、底座或任何容器；「局部玉／银／暗金」只做题签边框或书衣上的细小纹饰，不要金属包角、搭扣或玉扣。 简体要求：题签上的「阳」「经」必须写成现代简体，不要写成繁体「陽」「經」。 封面要求：封面（或卷外、函套外）除题签外是素面，描述里提到的图、谱、路线、格线、印痕、经脉等内页内容不要画在封面上，也不要任何小字或伪字。
