  prompt: 生成一张 1:1 图片。画风：写实古风绘画，与写实武侠人物立绘一致——真实材质质感（布料的经纬纹理、毛边与洗旧褪色，金属的冷光、锻打痕与细微锈蚀，皮革的皱纹、磨损与油亮，木、玉、瓷、纸的真实肌理），柔和的体积光影与自然明暗，低饱和沉稳设色，手绘写实概念画质感；不是线稿、不是平涂、不是卡通、不是照片。背景：均匀平涂的浅暖灰底色（约 RGB 230,225,216），无纸纹、无暗角、无边框、无渐变、无地面、无投影、无场景（后续要程序抠图）。 题材：武侠游戏物品图鉴里的「大理军杖」（兵器·棍杖，玄中阶；出处：地域军器·大理；仅天龙大理节点原生可得），单一完整物品、无人持用，正面略三分之四视角居中，四边留白至少 12%。 形制与外观：深红木长杖约一百七十厘米，银色素面圆首与尾鐏、藤条握段，少量花叶铜箍但无文字，完整斜置留足两端无人手。完整兵器剪影；细长件斜置并留足尖、首、杆端，时代装具和手持尺度准确。效果字段只用于理解用途，不画数值、文字、图标或魔法特效。 品阶表现：玄中 —— 选材匀净、接缝细、釉面或金属有克制光泽；只画物品本身，不画木匣、布套、托架或包装；只用材质、工艺与旧化表达，不画光效。 年代与形制符合出处书界的时代，不混搭。 排除：人物、脸、手、人体、模特、衣架、支架、文字、伪字、印章、logo、边框、品阶框；奇幻造型、日式或欧美风格、跨朝混搭、现代材料；霓虹、魔法、粒子、发光。画面里不要出现任何文字：没有标题、标注、说明栏、引线标签（这是单独的物品图，不是设定稿）。 背景要求：整幅背景只有均匀平涂的浅暖灰，主体之外不要任何远景、虚影、云雾、淡色重影或重复的物体。 背景色要求：背景必须是很浅的暖灰（接近 RGB 230,225,216），不要偏暗、不要偏灰褐。
