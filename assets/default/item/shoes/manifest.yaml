    主体：一双黄麻草鞋，成年脚掌尺度；开放式低帮，厚实而轻的紧密编织鞋底，前掌与后跟各有粗绳鞋带，绳结短小实用；左右同款，黄麻纤维、编结、鞋底边与轻微磨损一致。必须画完整一双同款鞋履并置，左右鞋鞋面、鞋底、缝线、纹样和磨损一致；保持真实成人脚掌尺度感。具体轮廓、纹样、比例和配色均为原创武侠器物，不声称原著或文物复原。

    风格：严格匹配两张输入基线的清楚纤细深灰墨线、薄层透明罩染、克制可辨手绘笔触和低饱和冷暖；布、麻、皮、毛毡、绦带、缎与鞋底材质边界清楚，非摄影、非3D。

    构图：1:1方形，目标1536×1536；把一双鞋作为单一成套物品居中，以轻微三分之四俯视并排，鞋头朝右前方，前后略错开但不遮住关键结构。整双包围框宽和高均不超过画布76%，四边各留至少12%完整空白；两只鞋从鞋头到鞋跟或靴口全部入画。无人物、手、脚、场景、地面、桌面或任何投影。

    品阶表现：常见麻、布、普通皮与实用结构，轻微使用痕，朴素耐用。只用材质、工艺、包装和旧化表达；不画品阶框、彩色光柱、文字、数字、星级或魔法效果。

    光线与背景：左上约45度柔光只作用于物体自身，不产生投影，不自发光；均匀浅暖灰近象牙底，目标RGB约(230,225,216)，无底纹、渐变、暗角、地面或环境光晕。

    年代：本项为跨书界原创器物，采用中国古代鞋履的通用结构语境，不擅自指定朝代，不冒充出土物或原著定形。

    排除项：文字、汉字、伪字、书法、标题、数字、年份、印章、签名、logo、文字水印；人物、手、脚、腿、人体、假人、鞋楦；只画单只鞋、左右不同款、第三只鞋、额外鞋带堆、鞋盒或无关道具；现代运动鞋结构、运动鞋厚泡沫中底、橡胶气垫、鞋钉、拉链、塑料、尼龙、魔术贴、现代鞋标、高跟鞋、细高跟、欧洲宫廷鞋；具体影视或游戏造型复刻、演员名、画师名、作品名；照片级写实、商品摄影、3D渲染、塑料感、粗厚外轮廓、厚重油画；日韩动漫、欧美奇幻、赛博、蒸汽朋克；霓虹、bloom、魔法阵、粒子、自发光、彩色光柱、神器光环、翅膀；血腥、复杂布景、UI、品阶框、拼贴、多视图、透视畸变、主体截断、满幅贴边、接触投影、落地影、地面、桌面、背景底纹或渐变。不要去除或伪造工具自身的溯源标识。

    返修优先：上一候选存在构图、形制或禁止项偏差。生成全新构图而非编辑旧图；把完整一双显著缩小并精确居中，所有最外缘保持在画布16%至84%的中央区域，目标四边至少16%空白、包围框宽高最多68%；仍须严格保持本条目的材质、颜色、鞋型与所有专项排除。'
