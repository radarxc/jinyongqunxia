  subject: 宋制巡役甲（制式盔甲，黄阶）
  prompt: 生成一张 1:1 图片。画风：写实古风绘画，与写实武侠人物立绘一致——真实材质质感（布料的经纬纹理、毛边与洗旧褪色，金属的冷光、锻打痕与细微锈蚀，皮革的皱纹、磨损与油亮，木、玉、瓷、纸的真实肌理），柔和的体积光影与自然明暗，低饱和沉稳设色，手绘写实概念画质感；不是线稿、不是平涂、不是卡通、不是照片。背景：均匀的浅暖灰纸色（约 RGB 230,225,216），带极淡的纸面纹理，无地面、无投影、无场景。用途：《天书录》default 风格包的二维武侠物品图鉴插画。 题材：宋制巡役甲（eq_songxunyijia），制式盔甲·宋，黄阶；南宋市井巡役语境，原创扩展。 主体：单一完整空甲，灰蓝实用布衣，胸前一片由小型铁札组成的轻护胸，短分摆、深褐皮带、普通布袖；自然展开，不穿在人或隐形人体上。具体札片、系带、裁剪与配色为原创武侠造型，不宣称文物或原著外观复原。布、铁札与皮革材质边界清楚，非摄影、非3D。 构图：1:1方形，目标1536×1536；正面略三分之四视角，单套盔甲居中，四边留白至少12%，物件包围框不超过画布76%；无衣架、支架或陈列座。左上柔光，背景目标RGB约(230,225,216)，无人物、手、场景、地面、纹理、渐变或投影。 品阶表现：黄阶只用普通布、朴素铁札、旧皮革、轻微使用痕与自然褪色表达；完整可用，禁止光效、品阶框、文字或数字。 年代：参考南宋甲身、披膊与甲裙的组合关系，但按名录的巡役轻甲设定原创演绎，不作宋代实物复原。 排除项：人物、脸、头、手、人体、模特、隐形人体姿势、衣架、支架、盔帽、靴、兵器、盾、旗、徽章、官衔补子、文字、伪字、汉字、数字、印章、签名、logo、文字水印、UI、边框、拼贴、多视图、裁切；奇幻板甲、跨朝混搭、血污、现代徽章、现代材料、拉链、塑料；具体影视或游戏造型、演员、画师、作品名、受保护作品仿制；照片、商品摄影、3D渲染、日韩动漫、欧美奇幻、蒸汽朋克、赛博朋克；宝石、霓虹、bloom、魔法阵、粒子、自发光；场景、地面、桌面、背景纹理、渐变、接触投影或落地影。不要去除或伪造工具自身的溯源标识。 要一眼看出这是「宋制巡役甲」这一朝代、这一兵种的制式甲：甲片形制、编缀方式、披膊 / 护心 / 甲裙等部件和主色配色都符合该朝史料，颜色克制（作者要求突出年代特色，包括制式与颜色）。
