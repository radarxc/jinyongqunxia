    【画里谁是谁】这张插图画的是：石梁温家旧园的双时层记忆画：前景成年温青青穿与新版石梁阶段相同的米白色右衽短襦、深灰蓝长裙与素布鞋握紧素帕，神情迟悟悲愤；中景以更柔暖的画中追忆层表现夏雪宜放下金蛇剑、与温仪静静相对，温仪为端庄成年女子、素色襦裙，只文字。梨花与旧木窗衔接冷暖两层，人物之间不作跨时间触碰。

    【要对齐的部分】温仪的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；神态：与夏雪宜静静相对，温柔而略带哀伤；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

    【温仪的基线脸】基线里的温仪（追忆层里是年轻时的她）二十岁上下，端庄温婉：圆润的鹅蛋脸、下巴圆润；细长柔和的眉；一双温柔的杏眼、双眼皮；鼻子小巧挺直；嘴唇小巧、唇色淡红；肤色白皙、皮肤紧致年轻，没有中年人的松弛、法令纹和皱纹。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「金蛇旧梦」和小朱印必须原样保留，一笔不改、不增不减。

