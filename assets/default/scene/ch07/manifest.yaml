  prompt: '【任务】这是一次图像编辑（改脸），不是重新创作。第 1 张是袁承志的身份基线（作者审核通过的立绘，脸部特写）；第 2 张是温青青的身份基线（作者审核通过的立绘，脸部特写）；第 3 张（最后一张）是待改的剧情插图（3:2 横幅）。请以最后一张为底稿，只把画中袁承志、温青青的脸改成与各自的身份基线是同一个人，然后输出修改后的完整插图：3:2 横幅，构图与原图完全一致。

    【画里谁是谁】这张插图画的是：毁炮与盛京潜入的编辑性双时层宽幅画：左侧较小的回忆层为先前北上途中被毁的旧炮架，温青青男装与程青竹只在这一层警戒，和宫廷空间完全分隔。右侧主画面在崇政殿内，袁承志深青劲装、灰黑披风，持金蛇剑与手执拂尘的玉真子对峙；皇太极在殿中龙椅近旁，约五十一岁、壮硕丰厚、颈肩宽稳、面颊饱满、深色短须夹少量灰，威严沉着而非八十岁衰老形象。殿外冬寒与室内烛光相映，分层之间以大片烟灰留白断开，不把炮架放在宫门旁，不把青青或程青竹画成入殿援兵。

    【要对齐的部分】袁承志、温青青各自的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；表情保留原图的情绪方向；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

    【袁承志的基线脸】基线里的袁承志二十三四岁，端正俊朗、一身正气：脸型端正饱满、两颊丰润不凹陷、下颌方正而圆润；肤色白净（只是健康的浅肤色，不是晒黑的黝黑皮肤）；浓黑平直的剑眉；眼睛有神、双眼皮、眼神端正沉稳；鼻梁挺直；嘴唇端正、唇形清楚；完全无须、没有胡茬；没有深法令纹和风霜皱纹，皮肤紧致年轻。不要瘦削凹颊、高颧骨、晒黑、带胡茬的风霜脸。

    【温青青的基线脸】基线里的温青青二十岁上下，俊俏而带英气：脸型是颧骨略宽、下颌有力的鹅蛋脸，不是瓜子脸、下巴不尖；眉毛浓黑平直、眉形清楚有力（不是细弯眉）；一双明亮的大杏眼、双眼皮，眼神倔强、带一点小性子；鼻梁挺直；嘴唇饱满、唇形略厚；肤色白皙健康；成年女子的五官比例。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「剑动盛京」和小朱印必须原样保留，一笔不改、不增不减。

    【画风】项目的写实手绘古风剧情插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温与原图一致、自然融入，不要像照片贴上去。

    【不要】不要新增或删除人物；不要改动题字；不要串脸；不要幼态（童颜、娃娃脸）；不要照片质感、磨皮、网红脸；不要水平镜像；衣襟保持右衽。

    【本张另外要求】袁承志是画面中间偏左、持金蛇剑、披灰黑披风的青年（从左数第 3 个人，脸最大）：与玉真子对峙，神情警觉坚毅，此刻不笑。温青青是左上角回忆层里穿浅色男装的女子（从左数第 1 个人，脸很小）：神情机警。左上回忆层里她身边的男子程青竹、龙椅上的皇太极、右边执拂尘的玉真子，脸一律不改。'
