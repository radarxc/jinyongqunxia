- id: cg_ch08_tongchi_betrayal
  file: cg_ch08_tongchi_betrayal.png
  category: scene
  style: default
  subject: 通吃惊变（ch08_luding）
  prompt: '生成一张3:2横幅写实手绘古风剧情插画，1536×1024。所有人物明确为成年；单幅完整场景，不拼贴不分镜。

    第1张参考：韦小宝·宫廷与青木堂双重身份阶段图，锁定新身份与年龄，衣物道具以【场面】为准，不复制姿势背景。

    第2张参考：陈近南本人基础图，只锁定该人的面容与成人体态；未另述衣装时沿用本人base，明确场面要求优先。

    第3张参考：双儿本人基础图，只锁定该人的面容与成人体态；未另述衣装时沿用本人base，明确场面要求优先。

    最后两张为项目画风基线，只借笔触、设色、自然材质，不借人物身份。各人脸与发式严格隔离，不串脸。未上传的人物只按下述文字塑造，不复制演员面孔。

    【场面】通吃岛崖道海雾中，韦小宝与双儿惊觉回身，陈近南背后郑克塽的剑正要递出，冯锡范在旁；定格伤害发生前，不画营帐或血腥。

    【剧情边界】ld44；动作凝结与视点原创构图，背刺事件原著。；题名、画面取景、站位、时刻、服饰配色、成年化均属（原创扩展）；指定版本细节待纸本逐字终校（待考）。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；依照本场天色和灯火布光，明暗自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

