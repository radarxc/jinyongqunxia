  subject: 梅庄地牢换囚与任我行脱困（回目待考）（ch05_xiaoao）
  prompt: '【任务】这是一次图像编辑（改脸），不是重新创作。第 1 张是令狐冲的身份基线（作者审核通过的立绘，脸部特写）；第 2 张（最后一张）是待改的剧情插图（3:2 横幅）。请以最后一张为底稿，只把画中令狐冲的脸改成与身份基线是同一个人，然后输出修改后的完整插图：3:2 横幅，构图与原图完全一致。

    【画里谁是谁】这张插图画的是：西湖梅庄湿冷的地下囚室，难辨日夜。令狐冲独自在铁床上苏醒，双腕和双踝均扣有铁圈并连着铁链，粗布旧衫凌乱但完整，微微抬头环顾，神情困惑而虚弱。低机位中全景，以铁床边沿、链条和有送饭小孔的厚铁门切割幽闭空间。室内没有长明灯，仅用极微弱的绘画轮廓光表现人物；只画令狐冲一人，不把任我行、向问天同时画成他清醒目送的离牢队伍。

    【要对齐的部分】令狐冲的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；神态：刚在地牢里醒来，微微抬头环顾，困惑而警觉（此刻不笑，紧张神情保留）；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

    【令狐冲的基线脸】基线里的令狐冲二十三四岁，是年轻俊朗的浪子：脸型是饱满的鹅蛋脸、两颊圆润不凹陷、颧骨不突出、下颌圆润、下巴干净；浓黑的剑眉平直舒展、眉尾略扬；一双笑眼——双眼皮、眼尾弯弯、下眼睑微微上提，眼神明亮洒脱、带三分狡黠；鼻梁挺直、鼻头圆润；嘴唇适中，笑时嘴角一侧上扬、露出一点牙齿的爽朗坏笑；完全无须——唇上、下巴和两腮都干干净净，没有八字须、没有山羊胡、没有短髯、没有胡茬；肤色是健康的浅麦色，皮肤紧致年轻。整体比原图年轻四五岁、脸更圆更饱满。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「梅庄换囚」和小朱印必须原样保留，一笔不改、不增不减。

    【画风】项目的写实手绘古风剧情插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温与原图一致、自然融入，不要像照片贴上去。

    【不要】不要新增或删除人物；不要改动题字；不要串脸；不要幼态（童颜、娃娃脸）；不要照片质感、磨皮、网红脸；不要水平镜像；衣襟保持右衽。

    【本张另外要求】画里只有令狐冲一人，他躺在铁床上、头部在画面左上方；保持地牢的昏暗光线与色调。这张图里他的脸已经去掉了胡须，这次只再往基线靠：脸型收成基线那种饱满圆润的鹅蛋脸（现在的脸偏宽、偏方），眼睛改成基线那种明亮的双眼皮笑眼的眼型、黑眼珠清楚（现在偏细、偏眯），整体更年轻、更有二十三四岁的少年感，不要显老、不要皱纹和法令纹。'
