    【本张另外要求】令狐冲是画面左侧挥剑、穿蓝灰长衫、头系黑布头带、头顶发髻的青年（从左数第 2 个人）；门边的紫衣女子任盈盈、白衣老者向问天、前景戴斗笠的黑袍大汉任我行、右边红衣的东方不败，脸一律不改。'
