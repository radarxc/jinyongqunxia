  prompt: '【任务】这是一次图像编辑（改脸），不是重新创作。第 1 张是小昭的身份基线（作者审核通过的立绘，脸部特写）；第 2 张是张无忌的身份基线（作者审核通过的立绘，脸部特写）；第 3 张（最后一张）是待改的剧情插图（3:2 横幅）。请以最后一张为底稿，只把画中小昭、张无忌的脸改成与各自的身份基线是同一个人，然后输出修改后的完整插图：3:2 横幅，构图与原图完全一致。

    【画里谁是谁】这张插图画的是：灵蛇岛小昭为救众人承担总教责任、随船离别。小昭为成年女子，瓜子脸、修长眉、高挺秀鼻，清澈眼睛带自然轻淡蓝意、颊边浅梨涡，肤色白净，汉人面貌为主带些波斯血统的立体感，穿完整的素色长衣与轻披巾、不戴脚镣、不性感化；站在波斯大舰船头，向另一艘归航船上的张无忌举手作别。无忌换素青行旅长袍，一手停在半空，温厚目光里有离愁。两艘航船分居对角，已扬帆而间距渐开，中间是逐渐拉宽的海面，不出现岸边送行者；暮色海风、朴素船帆，船上随从压为远景剪影不捏造具体容貌；以两船分离后的互望定格，构图机位属原创扩展，重点两人克制惜别。

    【要对齐的部分】小昭、张无忌各自的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；表情保留原图的情绪方向；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

