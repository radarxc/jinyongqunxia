    第3张参考：凤天南本人基础图，只锁定该人的面容与成人体态；未另述衣装时沿用本人base，明确场面要求优先。

    最后两张为项目画风基线，只借笔触、设色、自然材质，不借人物身份。各人脸与发式严格隔离，不串脸。未上传的人物只按下述文字塑造，不复制演员面孔。

    【场面】佛山湿热街巷与北帝庙石阶，成年青年胡斐横立普通百姓身前，手按普通单刀鞘、怒视持长棍的富豪凤天南；两人留有距离、局面将发未发。新胡斐脸和夏日轻装明确；百姓全成年，不画钟家死者作证，不画袁紫衣帮助截拦凤天南。

