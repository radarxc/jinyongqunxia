    【萧中慧的基线脸】基线里的萧中慧二十岁上下，爽朗大方：脸型较宽、颧骨宽而柔和、下颌圆润，不是窄 V 形脸、下巴不尖；眉毛自然平直；一双明亮的杏眼、双眼皮、眼神温和带笑；鼻子较宽、鼻头圆润（不是细窄的小鼻子）；嘴唇饱满，带温和的笑；两颊和鼻梁上有淡淡的雀斑；健康自然的肤色；成年女子的五官，不要少女化。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「笔墨退敌」和小朱印必须原样保留，一笔不改、不增不减。

    【画风】项目的写实手绘古风剧情插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温与原图一致、自然融入，不要像照片贴上去。

    【不要】不要新增或删除人物；不要改动题字；不要串脸；不要幼态（童颜、娃娃脸）；不要照片质感、磨皮、网红脸；不要水平镜像；衣襟保持右衽。

    【本张另外要求】萧中慧是画面中间枣树下坐着的年轻女子（从左数第 2 个人，脸较小）；左边挥笔的书生袁冠南、右边持棍的大汉，脸一律不改。'
