  prompt: '【任务】这是一次图像编辑（改脸），不是重新创作。第 1 张是萧峰的身份基线（作者审核通过的立绘，脸部特写）；第 2 张是段誉的身份基线（作者审核通过的立绘，脸部特写）；第 3 张（最后一张）是待改的剧情插图（3:2 横幅）。请以最后一张为底稿，只把画中萧峰、段誉的脸改成与各自的身份基线是同一个人，然后输出修改后的完整插图：3:2 横幅，构图与原图完全一致。

    【画里谁是谁】这张插图画的是：无锡松鹤楼，萧峰与段誉饮酒初识。萧峰灰褐粗袍、魁伟豪爽；段誉青色长衫、温雅书卷气，二人隔朴素木桌各举陶酒碗，桌上酒坛和小菜。窗外水乡屋瓦、木栏、暖日斜照。只画饮酒相识，不把正式结拜移进酒楼；概括构图为原创扩展。

    【要对齐的部分】萧峰、段誉各自的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；表情保留原图的情绪方向；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「松鹤豪饮」和小朱印必须原样保留，一笔不改、不增不减。

    【画风】项目的写实手绘古风剧情插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温与原图一致、自然融入，不要像照片贴上去。

