  subject: 郭襄十六岁生辰与杨过献礼（ch03_shendiao）
  prompt: '生成一张全新的1536×1024横幅剧情插画，3:2，不透明背景。用所附四位角色各自现行身份参考从空白画面生成；所附图只是身份参考，不是待编辑的剧情图。没有上传旧插图，绝不可复刻旧插图构图。


    【原著瞬间】《神雕侠侣》第三十七回《三世恩怨》：郭襄十六岁生辰，杨过三件大礼已经揭晓，他公开拜见郭靖、黄蓉后走到郭襄身前含笑。此时襄阳城西大校场已入夜，云淡星稀、钩月斜挂，校场四角戏台、灯笼、火炬与古代花炮齐庆，群豪惊叹喝彩。这里的花炮是杨过现身后庆寿戏台旁重放的，不是他尚未到场时的第二礼十字烟花。请画这一同一时刻，不画城门外，不画揭面，不画虚构纸盒礼物，不画血腥战果。


    【四位角色与严格身份对应】第1张身份板为郭襄，左右两格是同一个人原立绘与脸部放大；第2张为十六年后独臂杨过；第3张为神雕时期黄蓉；第4张为作者选定的郭靖B脸。四人各自用对应参考的眉眼、眼距、鼻形、唇形、脸型、下巴；不能串脸。参考板不是分镜，输出只是一幅完整的剧情画面。

    郭襄：十六岁青春少女，五官清秀灵动，眼睛和小鼻子严格以第1张为准；淡灰绿外衣、白色内领与明珠、半挽发髻和白缎发带沿用自己的base。不要把参考里的露齿大笑带过来：闭唇含蓄浅笑，眼中有喜悦的湿润感，脸颊一点自然红晕，喜泪尚未落下。自然偏身朝杨过，双手松松相拢于身前、轻轻欠身致谢，手指正确，不挤成拳，不捧礼盒。

    杨过：三十六岁上下，十六年后成熟清俊、有浅淡胡茬，独臂蓝衫，右臂自上臂缺失，空右袖自然下垂，只有左手。用第2张自己的脸，不照搬高台救人的掌势，不穿破烂衣服，不拿剑或面具。左手自然放低，眉间舒展、闭唇含笑，眼神明确而柔和地看郭襄，是长辈欣慰关照小辈。身姿挺拔从容，保留双方约一臂距离，不握手、不拥抱、不俯身贴脸，不画成恋人。

    黄蓉：后景稍近，来自第3张的独立脸型、眉眼、唇形，画成四十多岁的中年母亲，少量真实眼尾细纹和温柔沉着的神情，与郭襄显出一代年龄差；素雅已婚盘髻，黛青绿衣，站在郭靖身旁关注女儿与故人。不能用郭襄的脸，不能画成少女姐妹，不作舞台式大笑。

    郭靖：在黄蓉旁，用第4张B的方正骨相、厚实眉眼、鼻口及黄日华版神韵，年长化为作者要求的四十上下中年，有适度细纹与淡须，身形结实宽肩，稳重欣慰、嘴角可有细微笑意；穿本场南宋守城侠士的深色布袍，不照搬年轻参考的蒙古金刀驸马毛边装、弓箭。黄药师、郭芙等具名人物在镜头外，不新增无参考的具名面孔。


    【构图与动作】以郭襄和杨过为视觉重心的自然平视中近景，腰部至大腿上方入画，人物身体有真实重量与站立重心；杨过在左、郭襄偏右，郭靖黄蓉在后面偏左，两人各自独立轮廓，勿挡主要人物脸。人物正在庆寿交流而非排队合影。所有四人的脸都能看清，每张脸有足够像素。脸部至多轻微三分之二转侧（约10–20度），郭襄只轻转眼神看杨过，头颈基本中正，不能昂头折脖子。背景有高台、两根旗杆、挂灯笼的小戏台、匿名群豪席地饮宴或转身喝彩；群豪读得出惊喜，远景脸不需刻画成肖像。画面上方留出夜空，古代花炮升起、散出金红青色细小花雨与烟气；热闹而不喧宾夺主，不是现代大型烟花秀。


    【下巴、下颌线与脖子是首要验收点】郭襄下巴严格保持第1张自然短而圆润的脸型收束，颏部居中，左右下颌与嘴的中轴吻合；不要尖下巴、歪下巴、拉长下巴、削脸、突起的颏骨或下巴下的额外肉团。所有人头、颈、肩遵循同一空间方向，脖子从下颌后方自然接到胸锁乳突与衣领，转头时下颌轮廓仍连续，不能扭折、细长、断开或粘贴式连接。正常的头身比例，避免为了看烟花把头过度仰起。完整绘出脸颈一体的自然皮肤明暗。


    【画风、光线】照项目STYLE.md：细腻写实手绘武侠人物，女性古典清秀、男性真实骨相，与四张身份参考同一质感；远景古风水墨空气层次。清楚的手绘线条和自然笔触，真实的皮肤细纹、布料经纬、自然发丝，沉稳低饱和蓝绿衣装与温暖灯火；夜间灯笼、火炬、花炮构成可信柔和照明，脸上亮度充足但不漂白，不磨皮，不打美颜棚光，不发光武功，不做照片、塑料CG、3D渲染、漫画或厚涂油画。


    【题字】画面右上角竖排一列毛笔楷书，从上到下严格仅写简体「襄阳献礼」，四个字独立、清晰、准确，题字占画宽约6%、高度约28%，不挡脸、不挡郭襄头发；可附一枚无可读文字的小朱印。除这一题字，不画其他可读文字（戏台匾额不写字，花炮散为花雨）。


    【禁止】身份串脸、统一网红脸、尖歪长下巴、脖子角度错、过度仰头、露齿大笑、情侣暧昧、额外杨过右手、手指错误、多余肢体、具名人物无参考、少女性化、裸露、血腥、耳朵战果展示、现代物件、水印、Logo、边框、分镜。


    【本张构图变化】取稍舒展的腰部中景，郭襄与杨过各有完整颈肩与清楚脸型；郭靖黄蓉位于两人之间稍偏左的后景，保证互不遮脸；天空金红青细花雨映照灯笼与群豪。

