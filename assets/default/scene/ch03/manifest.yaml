  prompt: '【任务】这是一次图像编辑（改脸），不是重新创作。第 1 张是杨过的身份基线（作者审核通过的立绘，脸部特写）；第 2 张是小龙女的身份基线（作者审核通过的立绘，脸部特写）；第 3 张（最后一张）是待改的剧情插图（3:2 横幅）。请以最后一张为底稿，只把画中杨过、小龙女的脸改成与各自的身份基线是同一个人，然后输出修改后的完整插图：3:2 横幅，构图与原图完全一致。

    【画里谁是谁】这张插图画的是：重阳宫重逢救援的编辑性构图，具体交战与婚誓先后待考。杨过人物自身右臂已断，仅左手持玄铁重剑，空右袖清楚，不许双臂或普通细剑；他站在疲惫的小龙女身前护住她。小龙女双手各有一柄细长古剑但收势低垂，素白衣被尘沾染仍完整。远处金轮法王是极高极瘦的中老年藏僧，身披黄袍、头部剃净、额顶轮廓自然微陷，脸颊瘦削、下巴仅短须影，不画红袍壮汉或白须仙翁；手持金属轮，其余轮束在腰侧，木殿残烛与碎瓦衬托危险；三人并非画成杨龙各一细剑交叉的错误造型。

    【要对齐的部分】杨过、小龙女各自的脸型与骨相、眉眼、鼻口、胡须、肤色与年龄感要和自己的基线一致，让人一眼认出；表情保留原图的情绪方向；发式和头饰保持原图。每个人只像自己的基线，严禁串脸。

    【原图保持不变】除这几张脸以外，原图的一切都保留：画幅与构图、所有人物的位置、大小、姿势、手势和动作、服饰、兵器道具、背景场景、光线、色调、笔触画风；画里其他人物（没有给基线的）的脸也不要改。右上角的竖排毛笔题字「重阳同心」和小朱印必须原样保留，一笔不改、不增不减。

    【画风】项目的写实手绘古风剧情插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温与原图一致、自然融入，不要像照片贴上去。

    【不要】不要新增或删除人物；不要改动题字；不要串脸；不要幼态（童颜、娃娃脸）；不要照片质感、磨皮、网红脸；不要水平镜像；衣襟保持右衽。'
