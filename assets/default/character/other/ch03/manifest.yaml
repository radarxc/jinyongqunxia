  prompt: '生成一张1024×1536、2:3竖幅的单个神雕完整主体立绘，用于《金庸群侠传·天书录》默认风格包。《神雕侠侣》剑冢中与杨过练剑的神雕，非人形、非拟人，成年大型猛禽，身躯魁伟，双足稳稳着地，双翼自然收拢；完整保留头顶、弯喙、双翼轮廓、尾羽与两只足爪，四周留白，视线平稳，不裁边。

    辨识重点：粗重的钩喙、锐利而自然的小型禽眼、头顶暗红肉瘤状轮廓，羽毛以暗灰褐为主，羽缘自然磨损，体态厚重有力量。它不是金色雄鹰、凤凰或机甲，不穿衣服、不握人类兵器，不增加人手、角冠、第二个头或发光眼。具体羽色层次、嘴喙磨损和静立姿态为原创美术设计；原著颜色、翼形、体高细节仍待指定修订版逐字核对。

    写实手绘古风人物同系列的禽鸟插画，细腻自然的羽片层次、克制的低饱和设色、柔和左上自然光。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。此要求对应禽鸟的喙、足爪、眼周与羽毛，绝不能据此加人类皮肤或头发。不是照片，不是动漫，不是油画，不用厚涂或画布纹。

    背景是不透明暖浅灰纸底，极淡的水墨远山和大面积留白，墨色不侵入主体，脚下只有轻微接触阴影；轮廓清楚便于后续抠图。不要任何文字、题字、签名、印章、水印、边框、分格、多人或多只鸟。禁止雏鸟、幼态吉祥物、大头小身、额外肢体、错误足爪、失重翅膀、断裂羽翼。不要杨过或其他人入画，不加巨剑、山洞、树枝或战斗特效。

