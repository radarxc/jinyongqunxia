    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画；皮肤有真实质感——细小毛孔、细纹、晒痕、轻微色斑和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】欧阳锋，《神雕侠侣》时期的老年西毒，杨过的义父；神志紊乱、到处游荡，武功却深不可测；华山终局之前。

    【身份参考】随提示词上传的第 1 张图是射雕时期的欧阳锋本人：这是同一个人约二十年后的样子——保持同一张西域面孔（高鹰钩鼻、深眼窝、浓眉、方阔的颧骨与下颌），自然老去，不要换成另一个人。不要照搬图中的整洁白袍、蛇杖和姿势。

    【年龄与体态】七十岁上下的老人，身材依旧高大，但微微佝偻。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：疯癫的老西毒——须发蓬乱灰白，衣衫旧而完整，眼神时而迷乱、时而凶光毕露。

    【面容】同一张脸老去：须发已经花白、蓬乱，棕黄的须毛里夹着大片灰白；额头与眼角皱纹深；眼神时而迷乱、时而凶光毕露。

    【发式】花白长发披散、只在脑后胡乱一束。

    【服饰】旧灰白长袍（衣缘有磨旧，但完整不破碎），内着交领右衽素衫，褐色布带，旧软靴。

    【道具】空手（不持蛇杖）。

    【姿态与神情】微微弓着背站立，双手低垂、像蛤蟆功蓄势（不画特效）；神情疯癫而凶猛。

