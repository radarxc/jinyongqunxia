    【独臂与兵器】原著断的是右臂：右臂从上臂中段以下没有了——右边衣袖从肩下就是空的，扁平、软塌塌地在上臂处打一个结垂下，袖子里明显没有手臂、没有手（独臂必须一眼看清）；只用左手握住一柄乌黑厚重、宽钝无锋、毫无装饰的玄铁重剑，剑尖朝下拄在身体左侧的地上，剑身完整入画。不能画成左臂缺失。

