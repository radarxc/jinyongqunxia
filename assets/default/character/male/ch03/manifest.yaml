  subject: 洪七公（ch03_shendiao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【参考图】第 1 张参考图是本项目刚画好的《射雕》时期洪七公立绘（同一人锚点）：这是同一个人十几年后的样子——长方脸、五官、颏下微须的样式、粗大的骨架和九指都以第 1 张为准，自然老去，不要换成另一个人；不照搬它的构图和姿势。第 2 张是该角色经典影视造型的剧照，只借老叫化的神采与气度，剧照里的白色长髯不要；必须重新绘制成项目画风，不要照片质感。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准，但不取基线人物的长相。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】洪七公，《神雕侠侣》时期的老年北丐、前任丐帮帮主（打狗棒已传给黄蓉）；华山雪峰与杨过相遇、命终之前，依旧豪爽诙谐。

    【年龄与体态】约七十岁、精神矍铄的老叫化：比第 1 张年长十余岁，骨架仍然粗大、粗手大脚，人清瘦了些，但腰板仍直、精神十足，不老态龙钟。

    【面容】同一张长方脸自然老去：头发和眉毛都已全白，皱纹更深，眼角和额头的纹路更密；胡须仍是原著的颏下微须——下巴颏下几绺短而稀疏的白须，贴着下巴、长不过一寸多，唇上只有极短的白髭，两腮没有胡子；眼睛细长带笑，鼻头大而红润；脸色仍然红润，皮肤粗糙、有风霜和老人斑。

    【服饰】厚实的灰褐色交领旧布袍（右衽，左襟压右襟），外罩一件打满补丁的短褂（补丁整洁、洗得干净），深色布带，裹腿布鞋，衣着完整御寒；白发在头顶挽个髻，用旧灰布条束住。

    【道具】背上斜背那只朱红漆大酒葫芦，系绳清楚；左手扶一根普通的旧黄竹杖（不是碧绿的打狗棒），五指完整。右手抬到胸前、掌心朝外——九指：右手食指缺了一截，只剩靠近掌根的短短一节，断处早已愈合成圆钝光滑的指头（无血、无伤口），拇指、中指、无名指、小指完整。

    【姿态与神情】站姿洒脱，身体基本正面，笑眯眯、豪爽乐观。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要换成另一张脸；不要碧绿打狗棒（已传位）；不要白色长髯或垂胸长须；不要十指俱全，也不要血淋淋的断指；不要老态龙钟、佝偻拄拐。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
