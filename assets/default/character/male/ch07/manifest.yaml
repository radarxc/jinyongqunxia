    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】主角（男）：本作原创的穿越者，此刻身处《碧血剑》明末（约 1630–1645 年，项目推定，取入关前）；明末汉地城镇间的普通江湖旅人，不属军阵。本图是他在这一时代的基础立绘，不代表特定门派或结局。

