  prompt: '【任务】AR-73 / AR-89：崇祯帝朱由检，以图1现base为构图编辑目标，用图2作者提供的题「大明毅宗烈皇帝」画像改定人物。图3为这幅画像面部冠服细节。画像标题只用于辨认，输出不要文字。

    【面容与年龄】五官、脸型、须式照图2和图3：清瘦略长面、纤细下颌，自然细长眼与平弧眉、鼻唇关系按画像；八字口髭加短颏须，短而稀疏，绝不能长络腮胡或长尖胡须。画三十出头、《碧血剑》崇祯末年，真实青年壮年肌肤，不画晚年。神情忧急、刚愎，眉宇轻收、嘴唇闭合，严肃不笑。体态清瘦，肩胸腰收而正常健康，不硬加胖。

