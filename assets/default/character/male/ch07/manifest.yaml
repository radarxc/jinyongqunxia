    【服饰】墨黑色交领长衫（右衽，左襟压右襟），白色内领，衣缘有暗赭红色窄边，窄袖，腰束黑布带，深色长裤与布靴。

    【道具】右手低持金蛇剑——一柄金色的奇形宝剑，剑身弯曲如游动的蛇，剑尖分叉如蛇信；腰间挂一只小皮囊（装金蛇锥）；左手自然下垂。

    【姿态与神情】身体基本朝前、肩颈松弛，目光冷定地看向前方。

