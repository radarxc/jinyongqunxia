    【人物】夏雪宜，人称「金蛇郎君」，《碧血剑》中袁承志未曾谋面的武学传承者；本图是主线之前他在世时的回忆形象（明末）。

    【年龄与体态】约三十岁的成年男子，身材颀长清瘦而筋骨结实，站姿孤傲。

    【经典造型】八十年代经典港剧里的金蛇郎君：一身墨黑长衫、黑发束起额前垂着散发、唇上八字须配颏下短须，手持金蛇剑；俊美、冷傲、孤绝，带一丝邪气和悲凉，是好看的危险人物。

    【面容】按剧照：修长的脸，颧骨清晰，下颌线锋利；浓眉斜飞入鬓、眉头微蹙；眼窝略深，眼神冷傲孤僻，带一丝邪气和隐忍的悲凉；鼻梁高挺；嘴唇薄、嘴角紧抿；唇上修剪整齐的八字须，颏下一撮短须；肤色偏白，有真实纹理。俊美而危险，亦正亦邪。

