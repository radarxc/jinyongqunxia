    经典形象：要一眼认出是辽东大侠胡一刀——黑漆般的脸、满脸钢针似的浓髯、蓬乱不结辫的浓发、腰挎单刀，乍看凶恶如门神，眼神却豪迈坦荡、透着亲切；粗豪而有英雄气。

