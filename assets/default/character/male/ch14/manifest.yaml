  subject: 田归农（ch14_xueshan）
  prompt: '生成一张 2:3 竖幅全身人物立绘。

    参考图：上传的第 1 张参考图是同一个人（田归农）的立绘，请保持同一张脸（俊朗儒雅、细长眼睛、修整的细髭短须）；衣服和兵器按下面的文字重画，不要照搬参考图的宝刀。

    人物：田归农，金庸《雪山飞狐》前史回忆中的天龙门掌门，外表温文尔雅、内心阴险的人。

    经典形象：要一眼认出是田归农——靛青绸袍、修整细髭、温文尔雅、风度翩翩，笑意不达眼底；让人一见倾心的中年美男子，阴险只藏在眼神里。

    年龄与体态：四十岁左右的男人，身材修长匀称，长身玉立，约七个半头身。

    脸与五官：与参考图同一张白净俊秀的长圆脸：修长的眉，细长的眼睛含笑而笑意不达眼底，鼻梁挺直，薄唇，唇上细髭、下巴一小绺修整的短须；眼角有细纹。风度翩翩，不是凶相。

    发式：清代男子发式：前额剃净，后脑乌黑整齐的长辫。

    服饰：深靛青色绸面长袍，领缘有少量暗纹，交领右衽（穿着者左襟压右襟），窄皮腰带，深色长裤，整洁的皮靴。

    兵器与道具：左腰悬一柄普通中式长剑，完全入鞘，小巧的旧铜剑格；右手轻搭剑柄，左手拢在袖里。

    姿态与神情：站姿端整，带着礼貌的浅笑，目光冷静审视。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；凶恶丑化；络腮胡；宝刀或军刀；自尽伤口、幽灵或透明效果。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；参考图只取画风、光线、质感和背景处理，不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
