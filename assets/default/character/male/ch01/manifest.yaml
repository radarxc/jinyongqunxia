    画法统一为精细国风水墨设色人物插画，墨线随骨相和衣褶有轻重转折，淡墨与低饱和色层染体积，保留纸面透色；面部、双手和关键器物精细可读，衣摆与大衣褶适度写意，以清楚的大形组织结构，避免密集摄影毛孔、布料噪点、油亮高光或三维塑料感。柔和左上漫射光，不用舞台逆光。统一不透明暖浅灰纸底，极淡纸纹，无建筑山水或叙事场景。竖幅2:3，目标2048×3072 PNG，单人单视图完整全身，平视近正面轻微三分之四，中性透视，头顶、双手、双足、衣摆与设定器物端点完整且四周留边；约88–92%占高仅为美术目标，绝不绘制标尺或百分比。衣料完全不透明。汉式交领为穿着者左襟压右襟的右衽。人物有独立的面容、轮廓与内在气度，不能给参考人物换衣便当作新角色。 本图以真实坐姿及完整支架的包围盒安排画幅，不能为了占高拉伸为站姿；支架底座下允许极轻接触影。

