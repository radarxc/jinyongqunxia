    【人物与场景】虚竹，《天龙八部》，灵鹫解厄·以仁释缚。阶段：青年，保留质朴而有辨识度的僧人骨相，不作老人。童姥、李秋水身后，虚竹承继灵鹫宫责任，并为受生死符之苦者解厄的阶段。 对应《天龙八部》第38、39回。

