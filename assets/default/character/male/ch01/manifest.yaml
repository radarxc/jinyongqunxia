    人物与完整衣装动作：青年男子，面容质朴，较宽鼻梁与温厚眼神，骨相区别于段誉的秀雅与萧峰的雄峻；不是模板美少年，也不以夸张丑相取乐。 剃度僧人头相，保持同一面部身份，不长出道士髻或西夏驸马长发。 延续完整灰褐僧衣、素白内领、素腰束、长裤与僧鞋，衣物朴素而整洁；不突然换为逍遥仙袍或宫主礼服。面料厚薄、袖口和大褶真实连贯。右手拇指加入此阶段刚取得的掌门指环，尺寸克制。 完整站在木屋门外，一手抬至胸下端详新得指环，另一手自然垂落；肩背挺直，眼神惶惑中已有承担之意。 人物面部、皮肤、头发、衣服与鞋采用完整连贯的写实国风插画塑造；实体体积清楚、柔和光影连续、轮廓干净，墨染和纸面纹理只留在背景。

    器物与阶段限制：已获得的掌门七宝指环，尺寸克制；佩戴位置沿项目既有人物设计，不额外编造珠宝权杖。

    仅背景使用水墨：一扇浅墨木门、石阶与稀薄山雾，屋内留暗但不呈现人形。 门内外明暗转换表达骤得责任；不画无崖子灵魂、真神授戒或仙光飞升。 背景只作浅淡场景识别；无第二人物、多人战场、完整神像、可读题字或替身残影。

    本场具体构图：虚竹从浅墨木门前站定，右手轻抬在胸下端详新得掌门指环，左手自然放低；善良、惊讶与将承担责任的神情可见。只加已获指环，不提前赋予宫主礼服、后来掌法或生死符。

