    独立的清瘦长椭圆脸、舒展长眉、清俊自然鼻唇、少量细微年龄纹，目光明净沉静；顺垂乌黑长须与黑发构成鲜明识别，绝非白须白发的丁春秋。身形瘦长、双下肢瘦弱但完整，神态表现高龄阅历，面容保养良好不等于年轻年龄。墨青右衽长衣、浅灰内层、素布带、完整长裤与软鞋，黑发收拢低髻；衣料垂坠包覆全身，不露伤处，以长须、细长面容和墨青大形形成清雅轮廓。

