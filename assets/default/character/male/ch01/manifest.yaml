    第一张扫地僧剧照只取这位老僧自己的苍老面容、慈和眉眼和不争的定力，不抹去年龄或把他英雄化成威武方丈。本图仍是清瘦耄耋、肩背微弯、剃发且不戴剧照僧帽，洗旧青灰朴素僧衣，双手轻握日常竹柄扫帚、枝束末端落地；不沿用剧照合十动作、风吹长须、室内背景或强光，不增加佛光与威压特效。

    主体是扫地僧，北宋《天龙八部》少林藏经阁止斗前后的无名老僧，耄耋高龄、确龄不详，清瘦衰老、衣着朴素。他是止斗与点化者，人物气度来自看透争执的平和与慈悲，不是凶悍首领；不可用英雄气抹去年龄或变成壮健青年。

    瘦长老年面容，稀疏灰白眉自然低垂，眼睛仍清醒明亮、目光慈和安定，松弛面颊和真实柔和皱纹，嘴角平和。清瘦肩背轻微佝偻，手背有可信筋腱，约6.5–7头身但随自然年老姿态而变化；不骷髅化、不夸大病弱。剃发头部有自然年龄纹。让观者感到此人不争而自有定力，避免怒目、苦相与刻意威压。

    洗旧青灰汉地僧衣、灰布内层、窄布带与旧布僧鞋；衣料完整、衣边仅少量磨损，无破洞，也不穿玄慈式方丈袈裟。长而清楚的衣褶随微弯身体自然下垂，灰青大块面与少量墨线构成低调沉静的轮廓。

    近正面微侧，身体轻微佝偻而双足站稳，双手轻握一把真实日常竹柄扫帚；细竹柄与朴素竹枝束头完整，扫帚靠在身体一侧，枝束末端自然落地，握持不用力威吓。眼神平静看向前方，像准备以一句话止住争执。不抬手施法、不摆武术架势，不加经书、兵器或光环。

    画法统一为精细国风水墨设色人物插画，墨线随骨相和衣褶有轻重转折，淡墨与低饱和色层染体积，保留纸面透色；面部、双手和关键器物精细可读，衣摆与大衣褶适度写意，以清楚的大形组织结构，避免密集摄影毛孔、布料噪点、油亮高光或三维塑料感。柔和左上漫射光，不用舞台逆光。统一不透明暖浅灰纸底，极淡纸纹，无建筑山水或叙事场景。竖幅2:3，目标2048×3072 PNG，单人单视图完整全身，平视近正面轻微三分之四，中性透视，头顶、双手、双足、衣摆与设定器物端点完整且四周留边；约88–92%占高仅为美术目标，绝不绘制标尺或百分比。衣料完全不透明。汉式交领为穿着者左襟压右襟的右衽。人物有独立的面容、轮廓与内在气度，不能给参考人物换衣便当作新角色。 扫帚枝束、鞋底的极轻接触影可读，无藏经阁或寺院场景。

    不要文字、题款、印章、logo、新增装饰水印、分格、多视图、额外人物；保留工具原有溯源。不要多肢多指、错接手腕、手物融合、裁断头足或器物、无依据的刀剑装备、法阵能量、现代物件、跨时代衣饰、水平镜像、夸张健美肌肉或性感化；不要照片质感、模板脸、塑料磨皮、动漫大眼。


