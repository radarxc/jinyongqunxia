  subject: 丁典（ch09_liancheng）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【参考图】第 1–2 张参考图是该角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征，让人一眼认出是这个角色；但必须重新绘制成项目画风，不要照片质感，不要照搬剧照的构图、光影、背景和姿势，也不要做成照片修图。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【剧照借鉴要点】剧照是他入狱前在菊花会上的样子：只借脸型、五官、浓眉和温厚沉毅的神情；狱中的乱发浓须、囚衣与铁镣按下文文字画，不要照搬剧照里的白衣和披发。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】丁典，《连城诀》中梅念笙的传人、神照经的唯一传人；被囚在荆州大牢多年、与狄云结下信任、尚未中毒出狱的时期，日日隔着窗子望凌霜华窗台上的菊花。

    【年龄与体态】约三十五岁的壮年男子，身材高大魁伟，肩背宽厚、前臂粗壮，约七个半头身；多年牢狱让面颊削瘦，但脊背挺直，武人气度不减。

    【经典造型】要一眼认出是狱中的丁典——乱发浓须、铁灰粗布囚衣、手脚都锁着旧铁镣，身形魁伟、神情沉毅温厚，抬头望向高处的窗口；是落难的英雄，不是凶徒，粗犷而有男人味。

    【面容】照剧照的脸型和五官（同一个人在狱中多年后的样子）：宽长的脸，直而宽的鼻梁；浓黑的眉毛，深陷而明亮的眼睛，目光沉静坚定，望着高处时透出温柔的牵挂；满脸未经修剪的浓须，杂乱但不遮住眼睛和嘴；颧骨在削瘦的脸上显得突出；肤色是久不见日光的灰黄，有真实的毛孔、细纹和风霜。

    【发式】清初俗家男子发式，但久囚失修：前额剃过的地方长出一层短发茬，脑后的辫子松散粗乱，垂在背后；鬓发蓬乱。

    【服饰】铁灰色粗布长衣（清初圆领大襟右衽，衣襟从领口斜向右腋下扣合）、暗褐色长裤、旧布鞋；衣物磨旧、有一两处补丁，但完整、遮蔽严实，不是带「囚」字的制服。

    【道具与姿态】空手，不拿兵器；双腕和双踝各锁着一副旧铁镣，短铁链松松垂下，不连到画外；宽肩打开、脊背挺直，双手低垂略分开，头微抬，目光望向高处（像在看窗台上的菊花），双脚稳稳站着，不跨过链条。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要整洁的书生装、白衣或英雄头巾；不要血迹、伤口、骷髅或刑具以外的锁链墙；不要发光的经脉或气功特效；不要第二个人或凌霜华；不要老态龙钟；不要明代发髻或网巾；不要日式服饰。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
