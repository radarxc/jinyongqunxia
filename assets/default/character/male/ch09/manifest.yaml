  prompt: |-
    POSE IS A PRIMARY REQUIREMENT: one FRONT-FACING full-body standing figure, head and neck naturally UPRIGHT. The forehead–nose–chin centreline is VERTICAL and both eyes are on a HORIZONTAL line. Keep the head centered over the torso, camera level, chin neutral and gaze straight ahead. NO head tilt, NO Dutch angle, no rolled camera and no head leaning toward either shoulder. These requirements override every reference portrait pose. Preserve natural facial asymmetry without tilting the head.

    Create a beautiful REALISTIC Chinese wuxia character illustration of DI YUN / 狄云. Image 1 is the ONLY FACIAL IDENTITY reference: this character's reliably mapped portrait from classic MS-DOS Heroes of Jin Yong, used as a facial design reference, not a rendering style. Preserve recognizable facial relationships rather than a generic handsome template. Reconstruct a natural front-facing realistic face from the low-resolution drawing. Image 2 provides only restrained male rendering/colour quality and image 3 only an ink-wash background. Do not borrow any other person's facial identity.

    阶段与身体事实：狄云是冤狱幸存者、丁典传承者；刚经历破庙事件并换上宝象僧衣以避追索，并非主动为恶的血刀僧。乌蚕衣已在狱中从丁典处获得，不能把取得点挪到破庙。本图在后来水笙一方伤腿之前：双腿完整、能够正常承重行走，不画断腿、夹板、拐杖或跛立。长期牢狱后清瘦，青年成年人的骨架依然结实，肩颈可以显疲惫但背部与头颈保持自然直立，双眼水平；疲倦用眼下与嘴角表达，不能歪头缩颈或变成老僧。

    本人面部辨识：第一参考原版游戏狄云头像的面形偏长且颧颊、下颌有厚实转折，较浓较低的眉压着深而偏窄的眼裂，眼神深沉而非凶狠；眉眼间距和眼窝关系需保留。鼻梁长直，鼻头与鼻翼较宽实，较宽的闭合唇线、上唇较薄与自然下唇、方圆而坚实的下巴构成朴厚辨识感。保留这副有风霜的青年本人骨相，自然转为正面，长期牢狱令面颊略消瘦、眼下轻倦，但不衰老、不丑化。肤色温暖略深，皮肤有真实清楚质感。绝不继承头像的侧垂黑长发、绿色领口或侧脸朝向；本阶段必须去发无须，以同一眉眼鼻口识别本人。

    僧衣伪装与完整布料：拔去或削去须发后的光头、无胡须面容，不画戒疤、辫子、束髻、披肩长发或宗教冠帽。暗砖红色旧僧袍罩住不透明内衫与长裤，衣料虽旧色但整片完整可穿，领口、袖口、下摆有明确剪裁和连续边线，不主动添裂口、破洞、碎带或泥污斑块。汉式交领左襟压右襟、向本人右侧合拢，不镜像；灰布绑腿及完整旧布鞋。乌蚕衣是贴身黑色细密织物，只在领口规整层次露出一小段乌黑内衣边，不变成外露黑铁甲。衣襟必须保留宝象僧衣识别纹样：用红线绣出一柄小短刀，刀尖下恰有三滴血形的红线针脚纹。纹样是缝在布上的低调刺绣，有真实线的质地；这是服饰图案，不是实体武器、真实流血、文字、印章或水印，不让图案扩成血迹。

