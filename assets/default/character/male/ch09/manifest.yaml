    阶段与身体事实：狄云是冤狱幸存者、丁典传承者；刚经历破庙事件并换上宝象僧衣以避追索，并非主动为恶的血刀僧。乌蚕衣已在狱中从丁典处获得，不能把取得点挪到破庙。本图在后来水笙一方伤腿之前：双腿完整、能够正常承重行走，不画断腿、夹板、拐杖或跛立。长期牢狱后清瘦，青年成年人的骨架依然结实，肩颈可以显疲惫但背部与头颈保持自然直立，双眼水平；疲倦用眼下与嘴角表达，不能歪头缩颈或变成老僧。


    本人面部辨识：第一参考原版游戏狄云头像的面形偏长且颧颊、下颌有厚实转折，较浓较低的眉压着深而偏窄的眼裂，眼神深沉而非凶狠；眉眼间距和眼窝关系需保留。鼻梁长直，鼻头与鼻翼较宽实，较宽的闭合唇线、上唇较薄与自然下唇、方圆而坚实的下巴构成朴厚辨识感。保留这副有风霜的青年本人骨相，自然转为正面，长期牢狱令面颊略消瘦、眼下轻倦，但不衰老、不丑化。肤色温暖略深，皮肤有真实清楚质感。绝不继承头像的侧垂黑长发、绿色领口或侧脸朝向；本阶段必须去发无须，以同一眉眼鼻口识别本人。


