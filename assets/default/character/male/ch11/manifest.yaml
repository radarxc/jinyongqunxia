    重新设计宽阔而有沉雄分量的方脸，较宽眉骨与厚实下颌，自然眼角纹、深沉清醒的眼睛，浓眉平缓舒展，眼神中兼有洞察与温厚，嘴角克制微笑。浓密、自然完整的假虬髯连续覆盖两腮与下巴，体积宽厚而整洁，不是只有下巴的尖细山羊须，不露伪装缝口或半脱落部分。头颈结实、肩胸魁伟，约7头身宽厚骨架，胸背打开、有多年习武的沉稳力量，不画肚大商贾或健美力士。
    清式暖褐长袍、深栗色对襟马褂、暗赭窄缘、素布腰带、深色长裤与黑布靴；衣料较考究，以朴素整洁的大色块和有分量的大褶表现萧府主人气度，减少旧图全身密集绣纹，绝无补子、龙纹或朝廷官爵纹章。清式剃发留整齐辫子，素深色瓜皮帽，发际干净，不披散乱发。若露交领，穿着者左襟压右襟，勿镜像。
