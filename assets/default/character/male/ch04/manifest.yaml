- id: por_npc_xiexun__ch04_elder_blind_base
  file: por_npc_xiexun__ch04_elder_blind_base.png
  category: character/male
  style: default
  subject: 谢逊（ch04_yitian）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【剧照参考】随提示词上传的第 1 张参考图是这个角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征（脸型、眉眼、鼻唇的比例与神态），让人一眼认出是这个角色；但必须重新绘制成本项目画风的手绘写实插画，不要照片质感，不要照搬剧照的构图、取景、光影、背景和姿势，也不要做成照片修图或磨皮美颜；剧照里的影楼柔光、浓妆、字幕和水印都不要。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【人物】谢逊，《倚天屠龙记》明教四大护教法王之一「金毛狮王」；灵蛇岛上、屠狮大会之前的中老年阶段：双目已经失明，尚未出家，屠龙刀完整在手。

    重出要求（上一版的问题，这次必须改正）：上一版的脸像西方人、又是怒目凶相：本图要画成汉人的脸——宽脸、颧骨高、鼻梁厚直但不是高挺的西方鹰钩鼻，眼型是细长的东方眼型；神情沉郁威严、带着失明者的静默，不要皱眉怒视；双眼失明——上眼睑半垂、眼神空茫地望向前下方，瞳色略浅但不是白眼。

    【年龄与体态】五十多岁的魁梧汉子，身材高大、胸背厚实、前臂粗壮。

    【经典造型】照剧照里这一版深入人心的金毛狮王来画：一头蓬松浓密、微卷的金黄色长发披过肩背，像狮子的鬃毛；同色的浓密长须垂到胸口；一身旧的暗红褐色粗布长袍；虽已失明，仍有狮王的威势与沧桑。

    【面容】照剧照的脸型和五官来画：宽厚、轮廓深的脸，额头和眼角有很深的纹路；金黄色的浓眉；鼻梁厚直；双目已盲——眼睑低垂、双眼失焦无神，不与观者对视（不画血洞、白眼或发光的眼睛）；浓密的金须从上唇和下巴自然长出。威严沉郁、饱经风霜，不是鬼怪凶脸。

    【服饰】暗红褐色粗布交领右衽长袍（宽袖），深色宽腰带，布裤、旧布靴；衣料厚实完整。

    【道具】一柄完整的屠龙刀：乌黑沉重的中式厚背单刃长刀，刀柄够两手握持，简洁护手，刀面无字无纹；两只手一前一后握住同一刀柄，刀身斜向本人左下方伸出，刀尖离地，整把刀从柄尾到刀尖都在画内。

    【姿态与神情】正面站立、双脚分开，重心稳定，头部端正；脸朝前方但眼神失焦，像在凝神听着周围的动静；神情沉郁、威严。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、照片修图感、三维渲染或动漫大眼；不要直接复制剧照的画面；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要黑发黑须或白发白须的普通老者；不要金发青年偶像、狮头兽人、兽耳、王冠；不要恢复视力的锐利目光、独眼、眼罩、蒙眼布、血洞或白眼；不要僧袍、光头；不要断刀、第二把刀、倚天剑、刀鞘；不要单手轻甩重刀、刀尖插地或穿过身体、刀面文字或发光。

