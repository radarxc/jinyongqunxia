    服制与发式：元末义军灰蓝右衽战袍、深褐轻札甲、暗红窄布巾束髻、皮带与布面靴，甲片层次节制，肩臂便于活动。衣料完整不透明，衣缘缝线连续；只少量宽缓有重力的褶皱，不画裂纹、碎布和飞白。灰蓝义军战袍与深褐轻札甲节制整洁，暗红窄布巾扎发髻，布面靴完整；不用后世明朝公侯礼服。


    正面姿态与器物：正面自然立定、头颈竖直、双眼水平，双足稳。本人左手从下方托一册合拢兵书，书完整包在无字素布封套中、轻贴左腹侧；右手自然垂下。本人右腰只有一柄普通单刃腰刀完全入完整刀鞘，短悬带连皮带，鞘端露出不裁切；刀柄和鞘口连贯，不拔刀、不拿屠龙刀。书不打开、不显文字或符文。


    人物画法：美观、精细而可信的写实国风人物插画。面部、双手、身体、衣料和器物都是完整坚实连续的体积，眼睛大小自然，皮肤具有适龄柔和明暗与自然纹理，不塑料磨皮、不复刻像素块。成熟和老年人物保留眼角、颊口、颈部的真实年龄关系；皱纹是完整皮肤的起伏，不是裂缝、污渍或飞白。衣服是可穿的完整不透明织物，剪裁与缝线清楚，只保留少量宽缓受力褶皱，不用密集噪点、碎布条或破损表现真实。脸手头发衣摆轮廓清楚，柔和左上漫射主光，连贯明暗与克制低饱和设色。手绘笔触细腻，不是照片、电视剧截图、3D模型或换头拼贴。水墨只在背景，墨痕与纸纹绝不侵入人物本体。


