  subject: 张无忌（ch04_yitian）
  prompt: '生成一张 2:3 竖幅全身人物剧情场景图：画面里只有这一个人物，完整全身（头顶、双手、双脚和手中器物都在画内），人物是画面主体；头部端正、五官清楚，镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG，也不是油画。

    【场景背景】武当山：殿门一角、石坪和几株松影，用淡墨轻轻勾出；不画巨大的太极光阵。背景用低对比、低饱和的淡彩水墨来画，只保留能认出地点的少量轮廓，不喧宾夺主；人物轮廓清楚、与背景分开，水墨不侵入人物和衣服。

    【人物与场景】张无忌，《倚天屠龙记》，武当木剑。阶段：援救武当、初学太极剑应对强敌的阶段；仍穿着扮作小道童时的简素道衣的青年。

    【身份参考】随提示词上传的第 1 张图是张无忌本人的新版基础立绘：保持同一张脸、同样的年龄感、体格与发际（偏长的鹅蛋脸、浓黑平直的剑眉、温和明亮的眼睛、挺直的鼻梁、厚薄适中的嘴唇，年轻无须），头顶小发髻的发式也一致；本场的服饰、动作、道具与背景按下文，不要照搬基础立绘的姿势与背景。

    【衣装】青灰色交领小道童简衣（窄袖、白色内领），布腰带，布裤布鞋；黑发在头顶束成小髻、用青布带扎住（与基础立绘同样的发式）。

    【动作与神情】持剑的手腕放松，剑势圆转收势，另一手掐剑诀自然呼应；神情专注，像正在领会剑意；衣带随动作轻扬。

    【器物】一柄木制的假倚天剑：木纹、钝口清楚，不是金属剑；手腕、剑柄与五指握持清楚。

    【体态】成年男子的身体比例（约 7.5 头身），身材匀称结实，衣着完整。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人（设定里的动物除外）；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽，不要水平镜像；不要现代物品、发光特效、法阵或能量光；不要换成另一张脸；不要分身残影；不要可读文字或图谱口诀。不要真倚天剑或金属银刃、老年白须、太极光阵、多臂残影；不要画成张三丰。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和水墨处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
