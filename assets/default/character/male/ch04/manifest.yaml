  prompt: 'POSE IS A PRIMARY REQUIREMENT: ONE FRONT-FACING full-body standing figure. Head and neck naturally UPRIGHT; forehead–nose–chin centreline VERTICAL, both eyes on a HORIZONTAL line. Camera level, chin neutral, gaze forward, head centered over the torso, shoulders naturally relaxed. NO head tilt and NO Dutch angle. These requirements override every reference pose. Preserve natural facial asymmetry without tilting the head.


    Create a REALISTIC full-body portrait for a Chinese wuxia game of 朱元璋. This supporting character has an ORIGINAL TEXT-DEFINED FACE. Neither input is an identity portrait: image 1 supplies palette/painting quality only and image 2 pale ink background only. Do not copy, average or borrow any reference face. Build the distinct facial anchors below; no claim of game, TV actor or historical likeness.


    身份与阶段：朱元璋（npc_zhuyuanzhang），《倚天屠龙记》 ch04_yitian。壮年义军领袖，濠州前因至应天府权力交替的书末阶段，尚未称帝。


    年龄与体型：壮年成年约35岁的视觉参照：项目约1363减史实1328；不是原著确岁。身体结实中等、未称帝的义军领袖，不画老皇帝。


    原创本人面容：原创成熟长脸：高而宽的额头，太阳穴平顺，浓眉较长而眉尾平缓，偏窄眼裂和自然上眼睑，眼距中等，目光审慎克制。颧骨中宽、颊部平整偏瘦，鼻梁长而端正、鼻尖实在不鹰钩、鼻翼中等；嘴线紧但不邪笑，薄厚正常双唇，口周短黑须。下颌清楚而不过分突、下巴长度自然圆方，额眼口边浅纹呈三十余岁。区别徐达的低平眉与窄额，不照搬任何帝王画像，更不画鞋拔子夸张长下巴。


    服制与发式：元末义军首领的深赭右衽长袍、墨色短外衣、暗红布巾束髻、窄皮带与朴素皮靴，少量衣缘暗纹而无龙纹、补子。衣料完整不透明，衣缘缝线连续；只少量宽缓有重力的褶皱，不画裂纹、碎布和飞白。深赭长袍、墨色短外衣和暗红布巾，衣缘少量低对比暗纹；不可加任何龙纹、明朝补子、皇冠冕旒。


    正面姿态与器物：身体正面稳立，头颈竖直、双眼水平、下巴中性，肩背自然收束但不驼。本人右手在身体外侧握一卷闭合军务文书，卷面素无字，细素绳真实捆住；左手轻压窄腰带，不作捧笏仪典姿势。不持玉玺、皇帝笏板、屠龙刀或发光秘籍。眼神有决断，不龇牙狞笑。


    人物画法：美观、精细而可信的写实国风人物插画。面部、双手、身体、衣料和器物都是完整坚实连续的体积，眼睛大小自然，皮肤具有适龄柔和明暗与自然纹理，不塑料磨皮、不复刻像素块。成熟和老年人物保留眼角、颊口、颈部的真实年龄关系；皱纹是完整皮肤的起伏，不是裂缝、污渍或飞白。衣服是可穿的完整不透明织物，剪裁与缝线清楚，只保留少量宽缓受力褶皱，不用密集噪点、碎布条或破损表现真实。脸手头发衣摆轮廓清楚，柔和左上漫射主光，连贯明暗与克制低饱和设色。手绘笔触细腻，不是照片、电视剧截图、3D模型或换头拼贴。水墨只在背景，墨痕与纸纹绝不侵入人物本体。


    背景与交付：单人单视图、水平平视镜头、原生竖幅2:3、完整全身，头顶、发饰、双手、两足、衣摆和全部实际道具端点完整入画，四周自然留净空，不用固定占高或头身数字强行拉长人体。目标2048×3072不透明PNG；接受工具真实原生2:3尺寸并如实登记，保存原始PNG字节及元数据，不裁切、放大、旋转或重新编码。暖浅灰不透明纸底，人物之外只有极浅低对比水墨远山、薄雾和留白，脚下少量接触阴影；不画具体剧情场景、建筑、其他人或文字。按最新提速要求先1张候选，基本清晰、正面端正、身份可辨即可保存；仅严重身份/结构/不可读才补，不为细手指、微装备、微角重复。每张仅一人。所有输出仍为candidate待用户最终审核，不自动approved。


    事实边界：元末，项目主体约1336–1363；每人只用本稿具体阶段。约年只作时代与视觉年龄参照，不能覆盖小说化生平。 身份、年龄、生命态、器物依最新本地角色/名录/剧情；原稿标记待考仍保留，未新浏览外网或声称指定版本终校。元末军伍、散人、和尚各循本稿服制，不套后世明清官服；历史原型身份与小说画像分开。具体衣色、器型细节、面部写实转译及静立姿态属于本次美术落实。项目书末约1363尚未1368称帝，服装和无字军务卷是本稿美术补足。历史肖像不作本次身份参考，不仿或恶搞特定皇帝画像；政治判断不画成神异武功。


    图像输入使用边界：第一输入同性别项目基线只供低饱和色卡、柔和光线、细腻手绘品质；不是本人，不抄其五官、年龄、身体、发式、服饰、道具或姿势。保留原审批状态，不传递给新图。 第二输入用户王语嫣图只供暖浅灰留白、极浅水墨远山背景；不继承其中女性、脸、衣裙、体型、飘带或倾头，墨迹不侵入人物。


