  prompt: '【任务】这是一次图像编辑（只改神态），不是重新创作。第 1 张参考图是待改原图（鹿杖客的基础立绘）；第 2 张是同一张原图的脸部特写（看清五官细节，用来保持是同一个人）。请以第 1 张为底稿，只改鹿杖客的面部神态——眼神、眉眼的松紧、嘴角与笑容——然后输出修改后的完整图片：2:3 竖幅，构图、取景与第 1 张原图完全一致。

    【人物】鹿杖客：玄冥二老之兄，六十多岁，阴狠好色。

    【新神态（按年龄与性格定，不要千篇一律的平静脸）】不怀好意的阴笑：眼睛眯起，嘴角挂着阴恻恻、不怀好意的笑。

