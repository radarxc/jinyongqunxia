  subject: 张三丰（ch04_yitian）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【剧照参考】随提示词上传的第 1、2 张参考图是这个角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征（脸型、眉眼、鼻唇的比例与神态），让人一眼认出是这个角色；但必须重新绘制成本项目画风的手绘写实插画，不要照片质感，不要照搬剧照的构图、取景、光影、背景和姿势，也不要做成照片修图或磨皮美颜；剧照里的影楼柔光、浓妆、字幕和水印都不要。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【人物】张三丰，《倚天屠龙记》元末武当派开山祖师，百岁出头，正在传授太极拳的阶段；当世武功第一，却慈和平易、不修边幅（年轻时被人背后叫作「邋遢道人」）。

    【年龄与体态】一百多岁的老人，身形高大、骨架宽；背微驼但精神矍铄，站得稳如古松。

    【经典造型】照剧照里这一版深入人心的张三丰来画：仙风道骨、慈祥可亲——满头银发在头顶挽成道髻，戴一顶小小的旧银道冠；雪白的长眉、雪白的长须垂到胸前；素白长道袍外罩一件深褐与土黄旧布块拼缀成的坎肩（补缀而成，邋遢而不破烂）；笑眯眯的老神仙模样。

    【面容】照剧照的脸型和五官来画：瘦长的脸、额头宽阔，满脸细密的皱纹；雪白的长眉毛；眼睛细长、笑眯眯的，目光清亮温厚；鼻梁挺直、鼻头圆厚；耳垂厚长；嘴唇被白须半掩，带着和蔼的笑；脸色红润（鹤发童颜）。

    【服饰】素白交领右衽宽袖长道袍（洗得发旧，衣襟有几块洗不掉的淡渍），外罩深褐与土黄旧布块拼缀成的坎肩式外披，腰系一根旧布带，白布袜、旧布鞋。

    【道具】空手。

    【姿态与神情】双手在身前做太极拳的收势（两掌一上一下、虚抱如球，手指自然舒展），站姿松沉；笑眯眯、和蔼可亲，又深不可测。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、照片修图感、三维渲染或动漫大眼；不要直接复制剧照的画面；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要板着脸的严肃表情；不要只有六七十岁的面容；不要金碧辉煌的华丽道袍、大金冠；不要拂尘、宝剑；不要太极阴阳图或发光特效。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
