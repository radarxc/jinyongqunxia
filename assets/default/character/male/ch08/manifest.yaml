    人物：海大富，《鹿鼎记》中的宫中老太监，双目已盲、仍在宫中暗查旧案的时期。

    年龄与体态：约六十多岁的老太监，身形消瘦，微微弯背，但双脚站得稳。

    面容：面色蜡黄带病容，脸上没有胡须；双颊凹陷，额头有平行的皱纹，眉毛稀疏灰白，眼袋下垂；双眼已盲，眼睛自然睁着却没有焦点、眼神空茫；鼻梁较高、鼻尖厚；嘴唇薄而苍白，神情阴沉警觉，像在侧耳倾听。

    发式：前额剃光，稀疏的灰白细辫，头戴黑色圆顶小帽。

    服饰：清宫老太监的灰褐色圆领大襟长袍（右衽），外罩暗蓝色短褂，腰系软布带，黑布鞋。

    道具与姿态：空手；一手按在胸口，像刚压住一阵咳嗽，另一只手低低地伸向侧前方探知动静；身体正面站立。


    构图：竖幅 2:3，单人全身立绘，从头顶到双脚完整入画，四周留出余白；站姿自然、重心稳定，身体正面或微侧，头颈端正、双眼平视；双手和所持器物完整清楚。背景：暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物轮廓与背景分明、边缘干净（后续要抠图），脚下只有极淡的接触阴影。


