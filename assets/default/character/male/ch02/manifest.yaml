  subject: 郭靖（ch02_shediao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】郭靖，《射雕英雄传》南宋（约 1220 年前后）的主角：在蒙古大漠长大的汉人青年，江南七怪之徒，已得洪七公传降龙十八掌，桃花岛历练前后。憨厚老实、重诺守信，是正在长成的大侠。

    【年龄与体态】约二十岁的青年，身材粗壮结实、肩宽背厚、胸膛厚实，手掌宽大，四肢有骑马射箭练出的力量（约 7.5 头身），站姿稳得像一棵树。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：八十年代经典港剧里那位憨直可亲的郭靖——浓眉大眼、方正敦厚的脸，一笑就露出朴实温暖的憨笑；头顶束髻、扎深色布巾；一身朴素的布袍，背弓挎箭，是大漠里长大的神箭手。

    【面容】方圆脸、宽额，浓黑粗眉，一双大眼睛又圆又亮、眼神朴实专注；鼻梁宽厚挺直、鼻头圆；嘴唇略厚，嘴角带一点憨厚的笑；面颊是大漠风日晒出的小麦色、两颊微红，没有胡须。憨厚而英俊、浓眉大眼的好男儿，让人一看就信得过——不是粗笨，也不丑。

    【发式】黑发在头顶束髻，用深色布巾包住，鬓角整齐。

    【服饰】灰青色交领右衽窄袖布袍（宋式），赭褐色腰带，深色布裤与实用的深色布靴；衣料朴素厚实、完整干净。

    【道具】左手低垂握一张朴实的木质反曲弓（单根弓弦清楚、两端弓梢入画、不搭箭不拉弦），背上斜挎一只箭囊，露出几支箭羽；不佩剑。

    【姿态与神情】正面站立、双脚与肩同宽，胸肩自然舒展；神情憨厚坚毅，目光坦诚专注。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要像任何真实演员或明星；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要瘦削身材或精致偶像脸；不要中年胡须（这是射雕青年期）；不要华服佩剑；不要龙形掌风特效。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
