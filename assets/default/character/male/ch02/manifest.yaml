    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】《射雕英雄传》的拖雷，郭靖的安答、蒙古王子，取西征军职时期约三十岁的成年男性。骑乘锻炼的结实腰腿，厚颈宽肩，稳健坦率而有责任感；与铁木真明显隔一代，不能画成少年。

    【面容】宽额、较高的颧骨、方而不尖的下颌，平直浓眉、外眼角略收紧的长眼，鼻梁宽直、较厚下唇，短髭而没有长胡须。皮肤自然日晒、脸颊有细微色差，嘴角轻微不对称。

    【衣饰】十三世纪蒙古军旅的实用皮袍，内衬灰蓝窄袖织物衣、外层赭褐皮革与护肩、皮腰带和皮靴；袍向本人右侧扣合，软毡帽下露出收束发辫，不能清式剃额长辫。

    【道具与姿态】身侧一手垂握反曲弓的弓身中段，弓弦只连接上下弓梢；另一手自然停在腰带。侧后箭囊与短腰刀均有明确皮带连接，刀完整入鞘。头端正、两眼水平、双脚站稳，完整头足和弓梢都在画面内。

    【考据边界】身份、成年西征阶段及骑射按名录和原提示词；具体脸型、灰蓝赭褐配色、弓刀设计为原创扩展。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要儿童安答、现代民族盛装、清朝王爷服、皇帝龙袍、战马、猎鹰、军阵。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
