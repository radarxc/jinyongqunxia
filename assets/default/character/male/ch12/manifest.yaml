    经典形象：要一眼认出是红花会总舵主陈家洛——月白长衫、轻袍缓带、手握书卷、腰悬短剑，面如冠玉、凤眼含愁，儒雅俊秀的贵公子兼一帮之主；英俊出众。

    年龄与体态：二十四五岁的成年男子，身材修长挺拔，肩背舒展，约七个半头身。

    脸与五官：面如冠玉：白净细致的皮肤（仍有真实的毛孔和淡淡血色，不是瓷娃娃）；长方脸，下颌线干净；剑眉，眉峰清楚；一双细长的凤眼，眼神温润沉静，眼底藏着心事和犹豫；鼻梁高挺笔直；嘴唇偏薄，线条分明；不留胡须。儒雅的书卷气里带着一帮之主的威仪。

    发式：清代男子发式：前额与头顶前半部剃净，后脑长辫垂到背后，辫梢系素色丝绳。

    服饰：月白色细布长衫，衣袍宽松（轻袍缓带），腰间松松系一条浅青色丝绦；交领右衽（穿着者左襟压右襟），领口露出白色中衣；黑色布靴。整洁考究，像个贵介公子，没有绣金。

    兵器与道具：左腰佩一柄短剑（霍青桐所赠，古朴的铜饰剑鞘，长度约一尺半），剑完全在鞘内；左手轻按剑柄，右手握一卷合起的线装书（封面无字）。

    姿态与神情：微侧站立，身姿挺拔从容，目光平视远方。

