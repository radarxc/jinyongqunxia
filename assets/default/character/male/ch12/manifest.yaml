    年龄与体态：十八九岁、已经成年的青年男子，中等个子，精干灵活，约七头身，是成年人的脸和身体。

    脸与五官：圆方脸，脸颊已经有成年人的骨感；眉毛浓黑；眼睛明亮机灵；鼻头略圆；嘴角带笑；下巴和唇上有一层淡淡的青色须根；被回疆风沙晒黑的健康肤色。

    发式：清代男子发式：前额剃净，后脑长辫；戴一顶旧布小帽。

