  prompt: '生成一张 2:3 竖幅全身人物立绘，用于武侠游戏。画风必须与上传的两张参考图（本项目的基线立绘）一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净，低饱和沉稳设色，柔和自然光从左上方照来；背景是暖浅灰纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚，与背景分开，脚下只有很淡的接触阴影。参考图只取画风、光线、质感和背景处理，不要照搬参考图里人物的长相、服饰和姿势。构图：2:3 竖幅，单人全身，从头顶到靴底完整入画，四周留出余白，平视镜头。排除：任何文字、水印、边框；第二个人物；幼态、童颜；网红脸、锥子脸、塑料皮肤、过度磨皮；油画笔触、厚涂和画布纹理；清代剃发留辫；现代物品；日本刀。

    人物：胡斐，金庸《飞狐外传》的男主角，二十岁上下、行走江湖的少年英雄，胡家刀法传人。

    外貌：高大健壮，英俊而带江湖气：浓眉大眼，眼神明亮，笑起来爽朗豪迈，露出一点洁白的牙；轮廓分明的脸，两颊和下巴有淡淡的青色胡茬；晒成蜜色的皮肤。黑发在脑后随手扎成一束，几缕散发被风吹起。

    服饰：墨蓝色窄袖劲装，外披一件赭红色短披风（领口系结），素白内衫，黑色护腕，腰间缠深色布带并挂着酒葫芦，黑色布靴；风尘仆仆但干净整齐。

    兵器：右手握着一柄出鞘一半的中式单刀（柳叶刀，刀光雪亮），左手提着乌木刀鞘。

    姿态：三分之四侧身，迈出半步，回头看向观者，笑容豪迈，充满少年意气。'
