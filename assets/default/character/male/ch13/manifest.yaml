  prompt: '生成一张 2:3 竖幅全身人物立绘。

    参考图：上传的第 1 张参考图是平阿四现有的立绘，只用来保持他的脸型、五官和缺了右臂的样子；他脸上的刀疤要按下面的文字改成一条又长又粗、斜贯整张脸的旧疤；衣服和姿势按文字画。

    人物：平阿四，金庸《飞狐外传》中胡家的忠仆，当年拼死救出婴儿胡斐并把他养大的人。

    经典形象：要一眼认出是平阿四——一条斜贯整张脸的粗大旧刀疤、右袖空空掖在腰带里、粗布短褂，忠厚坚定的胡家老仆。

    年龄与体态：四十五岁上下的男人，干惯粗活的瘦削身体，肩背略弯，约七头身；缺了右臂，左臂完整有力。

    脸与五官：劳苦人的瘦削长脸，皮肤黝黑粗糙；一条粗大的旧刀疤从他自己的右眉起，斜斜穿过鼻梁，一直延伸到左边嘴角——疤痕早已愈合，微微隆起，颜色比周围皮肤浅，把鼻梁和上唇都划过；眼神忠厚而坚定；下巴一层短胡茬。

    发式：清代男子发式：前额剃净，灰黑的后辫；头上包一块旧的深褐布头巾。

    服饰：灰褐色粗布短褂，交领右衽（穿着者左襟压右襟），腰带，深灰布裤，旧布鞋；衣上有几块整齐的补丁。右边的袖管是空的，折起来掖在腰带里。

    兵器与道具：左手提着一个蓝灰色布包袱。

    姿态与神情：站得稳当，神情朴实、坚定，像一个守着少主的老仆。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；现有的左手完整（右边是缺臂的空袖，不要补画右臂），道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；两只手臂齐全；只在眉边的小疤；疤痕方向画反；鲜血或新伤；凶狠表情。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；参考图只取画风、光线、质感和背景处理，不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
