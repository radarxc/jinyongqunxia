  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【参考图】第 1–2 张参考图是该角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征，让人一眼认出是这个角色；但必须重新绘制成项目画风，不要照片质感，不要照搬剧照的构图、光影、背景和姿势，也不要做成照片修图。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【剧照借鉴要点】取剧照里这一版苗人凤的长脸、深陷的眼、沉郁冷峻的神情、唇上八字须和颏下短髯，以及黑色毛皮暖帽、黑毛领的关外装束；身材按原著画成极高极瘦；剧照里的字幕不要。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】苗人凤，金庸《飞狐外传》中人称「金面佛」的苗家剑高手，号称打遍天下无敌手，此时眼伤已经治好、视力正常。

    【年龄与体态】四十五岁上下的男人；极高极瘦，像一根竹篙，比常人高出一头，肩宽而薄，手臂很长，约八头身；一双手掌大如蒲扇，指节根根分明、青筋显露。

    【经典造型】要一眼认出是「金面佛」苗人凤——黑毛皮暖帽、黑色立领短褂配黑毛领、蜡黄长脸、八字须、极高极瘦如竹篙、剑不出鞘，沉郁孤傲、不苟言笑的一代剑客。

    【面容】照剧照的脸型和五官：长脸，两颊瘦削，颧骨高；面皮蜡黄；眉毛浓黑平直，眼窝深陷，眼神沉郁锐利；鼻梁高而直；薄唇紧闭，嘴角下沉；唇上两撇八字须、颏下一撮短髯；不笑。

    【发式】清代男子发式：前额剃净（被暖帽遮住），后脑长辫垂到背后；头戴一顶黑色毛皮暖帽。

    【服饰】深灰色长袍，外罩一件黑色对襟短褂（立领，领口和门襟镶银灰色窄滚边），领口一圈黑色毛领；黑色长裤，布靴；朴素干净。

    【道具与姿态】右手垂握一柄完全入鞘的普通中式长剑，乌黑的剑鞘贴着腿侧；不出鞘。笔直地站着，冷峻孤傲，像一棵瘦松。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要蒙眼布或失明；不要胖或魁梧；不要笑容；不要金色面具或佛像；不要出鞘的剑；不要日式服饰。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
