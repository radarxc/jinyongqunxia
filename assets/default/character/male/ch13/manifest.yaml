  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【参考图】第 1 张是本项目已入库的同一人物前一书界立绘，作为跨书身份锚点：保持脸型、眉眼、鼻口的主要骨相，让人认出是同一人；年龄、神态、肤色、发式、衣装和道具按下面本书阶段的文字来画，不要照搬第 1 张的衣服、器物、站姿和表情，也不要照搬它的构图。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准，但不取基线人物的长相。

    【跨书】参考为书剑版陈家洛。承接同一人的额头、眼形、鼻唇；气质比前书沉静成熟、增加轻微眼周细纹。不照搬锚点华丽背心，改为本稿朴素青灰袍。五官自然不对称，削弱照片式精修感。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】《飞狐外传》陈家洛。红花会总舵主；取掌门大会后、安慰马春花之前的本人行旅形象。。

    【面容】长椭圆脸、舒展平眉、细长而温和的眼形、鼻梁挺直、薄唇和清楚唇峰；成人约三十岁观感。承接书剑本人图的骨相。。所有人物一眼看出成年，约7.5头身。

    【衣装】青灰长袍、暖白内领、褐色窄带与软靴，清制剃额留辫，素深色小帽；右衽，不穿福康安官服。。

    【道具】闭合素色折扇低持身侧，腰侧一柄普通长剑完整入鞘；不用扇面字画。。

    【姿态】头正、平视、双足稳立，双手腰部以下自然扶器物；道具端部距画框保留至少半个头长空白。骨相细部与服色均为原创扩展设计。

