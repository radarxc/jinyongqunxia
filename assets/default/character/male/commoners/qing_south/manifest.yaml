  prompt: '生成一张 2:3 竖幅全身人物立绘。


    画风参考：上传的两张参考图是本项目的基线立绘，只取画风、光线、质感和背景处理（精细写实的手绘插画，笔触细腻柔和、边缘干净，低饱和沉稳设色，柔和自然光从左上方照来；暖浅灰纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚，脚下只有很淡的接触阴影），不取长相：不要照搬参考图里人物的脸型、五官、发型、服饰、体型和姿势。本张画的是无名的普通路人，长相朴素平常、有自己的个体特征，与参考图人物明显不同。年龄、脸型和体型严格按「人物」段的描写来画：中年、老年要有相应的皱纹、眼袋、皮肤松弛和体态，写了结实就画结实，不要年轻化，不要美化成俊男美女。长相要有辨识度：在眼型、鼻型、眉形、胡须、痣或小疤、牙齿这类细节里挑一两处与众不同的特征，不要和其他路人长成一个模子。


    人物：清·江南男铁匠，壮年成年人，铁匠；只画一个明确成年的普通人，不对应任何具名人物或真人。成年宽鼻方脸，前臂粗壮、腹腰自然，神情专注沉着，不画夸张肌肉；江南自然肤色与湿润气候质感，不统一白皙。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


    长相设定（本张独有，必须画出来，和服饰一样重要）：约 32 岁；国字脸，皮肤黝黑粗糙，额头抬头纹很深，眼袋重，蒜头鼻，嘴角下垂，短须花白。这张脸和体型要一眼就和参考图男子那种清瘦长脸、剑眉、高颧骨、八字胡、额头系发带露出发髻的样子不同，也不要画成千篇一律的路人模板脸。姿态：身体朝画面左侧转约三十度，重心落在后脚，动作自然。


    服饰：首服/发式：剃额留辫，戴素瓜皮帽或包巾；上衣：窄袖长袍外加短褂；下装：长裤；鞋：黑布鞋；配饰：窄带；颜色与材质：靛蓝、茶褐、米白棉布；职业差分：外加厚皮或粗布围裙，袖口卷起，少量煤灰只在手臂和围裙，不涂黑整张脸。服装结构、穿法、磨损和垂坠必须可信，遵守清·江南时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    服饰补充：服饰各项若与「职业差分」冲突，以职业差分为准。清制发式必须看得出：前额与两鬓剃净（帽檐下露出剃光的前额），脑后留一条长辫，从肩头垂到胸前或在身后清楚可见；不画明代网巾发髻，不画汉式束发。配色：在给定的颜色里，这一张的外衣以「米白」为主色，其余作辅色。


    标志道具：小锻锤与铁钳，冷却状态且无火花特效。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。


    手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。也不要油画笔触、厚涂和画布纹理。


    背景：不透明暖浅灰纸底，加极淡水墨远山，只作微弱层次，不画具体建筑、街市或多人场景；背景与人物分离，轮廓清楚，脚下仅轻微接触阴影。目标规格 1024×1536 PNG，后续统一抠图。


    排除项：不要文字、汉字、伪字、题字、标签、签名、印章、logo、水印；不要多人、群像、重复人物、分格、多视图、半身或裁断头脚与道具；不要儿童、少年感、幼态成人、娃娃脸；不要统一网红脸、明星脸、真人肖像、浓妆、磨皮、AI 塑料皮肤、动漫大眼、摄影写真或三维渲染感；不要跨朝混搭、错置族群服饰、影视套路制服、帝王贵族纹样、现代物件、现代服装、拉链、腕表、运动鞋、塑料制品；不要日式刀具、欧式奇幻铠甲、赛博、蒸汽朋克、发光兵器、法阵、粒子特效；不要裸露、透明衣料、性感化、污秽猎奇、恶搞贫困、血腥、畸形肌肉、多肢、多指、粘连手指、悬空道具或错误受力。'
