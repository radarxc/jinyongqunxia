    人物：西夏男铁匠，壮年成年人，铁匠；只画一个明确成年的普通人，不对应任何具名人物或真人。成年宽鼻方脸，前臂粗壮、腹腰自然，神情专注沉着，不画夸张肌肉；河西强光下自然晒色，不夸张党项五官。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


    长相设定（本张独有，必须画出来，和服饰一样重要）：约 34 岁；国字脸，皮肤黝黑粗糙，额头抬头纹很深，眼袋重，蒜头鼻，嘴角下垂，短须花白。这张脸和体型要一眼就和参考图男子那种清瘦长脸、剑眉、高颧骨、八字胡、额头系发带露出发髻的样子不同，也不要画成千篇一律的路人模板脸。姿态：侧身约三分之一，头转回来看向观者，动作自然。


    服饰：首服/发式：党项式短发或秃发轮廓从简，戴低软帽；上衣：圆领窄袖长袍；下装：长裤；鞋：乌皮靴；配饰：长织带；颜色与材质：土黄、赭褐、暗青毛麻；职业差分：外加厚皮或粗布围裙，袖口卷起，少量煤灰只在手臂和围裙，不涂黑整张脸。服装结构、穿法、磨损和垂坠必须可信，遵守西夏时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


