    画风参考：上传的两张参考图是本项目的基线立绘，只取画风、光线、笔触质感和背景处理（暖浅灰纸底、极淡水墨远山、大面积留白），不取长相、脸型、发型、服饰、配色和姿势；本张画的是与参考图人物毫不相像的另一个普通人。


    人物：金男铁匠，壮年成年人，铁匠；只画一个明确成年的普通人，不对应任何具名人物或真人。成年宽鼻方脸，前臂粗壮、腹腰自然，神情专注沉着，不画夸张肌肉；北方自然肤色与风晒痕，不用族群刻板脸。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。面孔差异：严格按上面写的脸型、年龄、体型和神情画出此人独有的长相——胡须有无与样式、鼻形、眼形、眉形、发际线、皱纹与斑痕、胖瘦都要有个人特征，不要套用同一张模板脸，也不要美化成影视俊男。


    服饰：首服/发式：女真式编发或汉人裹巾按身份二选一，不混搭；上衣：窄袖左衽皮毛缘袍；下装：长裤；鞋：皮靴；配饰：革带；颜色与材质：深褐、灰绿毛织与旧皮；职业差分：外加厚皮或粗布围裙，袖口卷起，少量煤灰只在手臂和围裙，不涂黑整张脸。服装结构、穿法、磨损和垂坠必须可信，遵守金时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    标志道具：小锻锤与铁钳，冷却状态且无火花特效。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。


    背景：不透明暖浅灰纸底，加极淡水墨远山，只作微弱层次，不画具体建筑、街市或多人场景；背景与人物分离，轮廓清楚，脚下仅轻微接触阴影。目标规格 1024×1536 PNG，后续统一抠图。


    排除项：不要文字、汉字、伪字、题字、标签、签名、印章、logo、水印；不要多人、群像、重复人物、分格、多视图、半身或裁断头脚与道具；不要儿童、少年感、幼态成人、娃娃脸；不要统一网红脸、明星脸、真人肖像、浓妆、磨皮、AI 塑料皮肤、动漫大眼、摄影写真或三维渲染感；不要跨朝混搭、错置族群服饰、影视套路制服、帝王贵族纹样、现代物件、现代服装、拉链、腕表、运动鞋、塑料制品；不要日式刀具、欧式奇幻铠甲、赛博、蒸汽朋克、发光兵器、法阵、粒子特效；不要裸露、透明衣料、性感化、污秽猎奇、恶搞贫困、血腥、畸形肌肉、多肢、多指、粘连手指、悬空道具或错误受力。'
