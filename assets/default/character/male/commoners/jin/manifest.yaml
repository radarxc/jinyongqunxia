    人物：金男铁匠，四十六岁上下的壮年成年人，铁匠；只画一个明确成年的普通人，不对应任何具名人物或真人。族属：女真人（金朝本族）。粗壮敦实、肚腹微凸、脖子粗短；圆阔的大脸、扁宽的鼻子、浓粗的眉毛、浓密的黑色短络腮胡夹着几根灰须、厚嘴唇；脸膛和前臂被炉火烤得发红，神情专注沉着。不用族群刻板脸，五官真实自然。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。本图重点：女真辫发（剃光的额顶和脑后及肩的辫子）必须一眼可辨。面孔差异：严格按上面写的脸型、年龄、体型和神情画出此人独有的长相——胡须有无与样式、鼻形、眼形、眉形、发际线、皱纹与斑痕、胖瘦都要有个人特征，不要套用同一张模板脸，也不要美化成影视俊男。


    服饰：首服/发式：女真辫发：额顶到头顶的头发剃去（头皮上有一层青色短发茬），只留后脑的头发，编成两条辫子垂在脑后，长度只到肩，辫梢用褪色的红丝绳扎住；不戴帽，发式清楚可见；上衣：窄袖左衽盘领短袍（女真式，衣长过膝，领口、袖口镶一道旧皮毛边）；下装：长裤；鞋：乌皮靴；配饰：革带；颜色与材质：灰白粗毛布袍（女真尚白）、黑褐皮围裙与旧皮；职业差分：外加厚皮或粗布围裙，袖口卷起，少量煤灰只在手臂和围裙，不涂黑整张脸。服装结构、穿法、磨损和垂坠必须可信，遵守金时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    标志道具：小锻锤与铁钳，冷却状态且无火花特效。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。


