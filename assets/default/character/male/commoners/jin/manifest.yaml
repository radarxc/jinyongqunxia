    服饰：首服/发式：花白头发在头顶挽成小髻，裹一块洗得发白的旧灰布头巾（汉人裹法，巾角在脑后打结）；上衣：交领右衽旧夹袄（汉式，穿着者左襟压右襟）；下装：长裤打着绑腿；鞋：旧麻鞋；配饰：革带；颜色与材质：褪色的土黄、灰褐粗麻；职业差分：有少量整齐补片和磨白边缘，但衣物仍完整可穿，不以污秽畸形丑化贫困。服装结构、穿法、磨损和垂坠必须可信，遵守金时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    标志道具：木碗与磨旧手杖。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。


    背景：不透明暖浅灰纸底，加极淡水墨远山，只作微弱层次，不画具体建筑、街市或多人场景；背景与人物分离，轮廓清楚，脚下仅轻微接触阴影。目标规格 1024×1536 PNG，后续统一抠图。


    排除项：不要文字、汉字、伪字、题字、标签、签名、印章、logo、水印；不要多人、群像、重复人物、分格、多视图、半身或裁断头脚与道具；不要儿童、少年感、幼态成人、娃娃脸；不要统一网红脸、明星脸、真人肖像、浓妆、磨皮、AI 塑料皮肤、动漫大眼、摄影写真或三维渲染感；不要跨朝混搭、错置族群服饰、影视套路制服、帝王贵族纹样、现代物件、现代服装、拉链、腕表、运动鞋、塑料制品；不要日式刀具、欧式奇幻铠甲、赛博、蒸汽朋克、发光兵器、法阵、粒子特效；不要裸露、透明衣料、性感化、污秽猎奇、恶搞贫困、血腥、畸形肌肉、多肢、多指、粘连手指、悬空道具或错误受力；这是金朝治下的汉人：不要画辫发、髡发或左衽。'
