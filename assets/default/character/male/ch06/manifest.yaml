    【要对齐基线的部分】脸型与骨相、额头与发际线、眉形与眉眼间距、眼型与眼神、鼻梁与鼻头、颧骨、嘴型与唇厚、下颌与下巴、胡须的形状与疏密、肤色与年龄感。要让人一眼看出两张图里是同一个人。基线里的石破天二十一二岁，朴实结实的青年：脸型方正、下颌宽而方、两腮结实、下巴宽，不是窄脸尖下巴；颧骨略高；浓黑粗直的眉、眉头略压；眼睛不大、眼窝略深、眼神朴实坦诚；鼻梁挺直、鼻头略宽；嘴唇厚实；日晒的古铜肤色，皮肤有风霜感、看得见细纹和晒痕，不是光洁的少年皮肤；几乎无须、只有极淡的胡茬阴影。

    【原图保持不变】除脸以外，第 3 张原图的一切都保留：取景与构图、人物在画面中的位置和大小、头部朝向与角度、身体姿势、手势与手中器物、服装的款式颜色与褶皱、道具、背景场景、光线方向与色调、纸底与水墨处理、笔触与画风。【神态】学刀收势后站定：憨厚坦诚、专注，嘴角带一点朴实的笑意。

    【本张另外要求】把原图偏窄、下巴偏尖、皮肤光洁的少年脸改成基线那张方下颌、两腮结实、带日晒风霜感的二十出头青年脸。

    【画风】项目的写实手绘古风人物插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。新脸的光影、色温和笔触要与原图其余部分一致、自然融入，不要像照片贴上去。

    【不要】不要文字、题款、印章、水印；不要第二个人；不要改变头身比例和头部大小；不要幼态（童颜、娃娃脸、少年身材）；不要网红脸、磨皮、照片质感；衣襟保持右衽，不要水平镜像。'
