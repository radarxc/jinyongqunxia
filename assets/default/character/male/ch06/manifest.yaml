    姿态与实际道具：仅佩一柄普通中式直身双刃长剑，完全入素鞘，细长剑鞘足以容纳剑刃，小型横向剑格，柄、格、鞘口、鞘尾同轴。挂于本人左腰（观者右），短系带真实连接腰带，剑鞘略斜但与腿分离、全长可见；不是石清黑剑或闵柔白剑，更不带黑白双剑。本人右手轻搭腰带不摸剑，左手空着自然垂于身体外侧；手腕手指清楚，不借参考握刀动作。两脚着地稳定，一脚略前但胸肩脸正面，身体重心轻微自然偏移，不斜肩歪颈。


