  prompt: '生成一张 2:3 竖幅全身人物立绘。


    画风：写实手绘古风人物插画，与项目现有立绘保持一致——像功力深厚的画师用细腻笔触画出的真实人物，不是照片、不是三维渲染、不是动漫。皮肤要有真实质感：看得见细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不打油亮高光；布料看得见经纬纹理、自然褶皱和穿用后的轻微旧化；整体是低饱和、沉稳的设色；柔和的自然光从左上方照来，明暗过渡连贯。


    人物：苏鲁克，《白马啸西风》中铁延部的资深勇士、苏普的父亲，性情粗犷刚烈。

    时代：唐代武周长安年间（约 702 年），西州—庭州一带的西域（游戏设定）。服饰按唐代：汉人男子束发、戴软幞头或裹巾，穿圆领窄袖袍（缺胯袍）、半臂，骑行可穿翻领胡服；汉人女子高髻或高束发，穿短襦、半臂、高腰长裙或窄袖胡服；草原牧部（铁延部，突厥—铁勒背景的虚构混合牧部）穿翻领窄袖袍、长裤、软靴，编辫、戴毡帽。

    年龄与体态：约五十五岁的中老年男子，身材魁梧、肩背宽厚，略有发福但依旧强壮。

    面容：宽大的方脸，下颌宽厚；粗浓的灰黑眉毛紧锁；眼睛细长、眼角深纹，目光倔强刚硬；宽鼻，鼻梁有一处旧折痕；厚嘴唇向下撇；满腮灰白相间的硬须；风霜粗糙的深褐皮肤，额头三道深纹。

    发式：灰白相间的头发编成辫子，戴一顶低矮的褐色毡帽。

    服饰：深褐色翻领窄袖长袍，两肩加一副暗红色皮护肩，腰束宽皮带（带扣用一块旧狼皮包着），深色长裤，旧皮靴。

    道具与姿态：左腰挂一柄只带轻微弧度的单刃长刀（刀在鞘内）；右手按着刀柄；叉开双脚站立，粗犷威严。


    构图：竖幅 2:3，单人全身立绘，从头顶到双脚完整入画，四周留出余白；站姿自然、重心稳定，身体正面或微侧，头颈端正、双眼平视；双手和所持器物完整清楚。背景：暖浅灰色纸底，只在远处有极淡的水墨远山（西域雪山与草坡的远影）和薄雾，大面积留白；人物轮廓与背景分明、边缘干净（后续要抠图），脚下只有极淡的接触阴影。


    排除：不要任何文字、题字、印章、签名、水印、边框；不要多个人物、多视图或拼贴；不要幼态（童颜、娃娃脸、儿童或少年身材、头大身小）；不要塑料皮肤、磨皮、网红脸、锥子下巴、过大的眼睛、浓妆滤镜、过度对称、过度精修、偶像化打光或蜡像感；不要与任何真实演员或明星相像；不要照片质感、三维渲染或动漫画风；不要现代物件；不要裸露、透视衣料或性感化；不要血腥；不要裁掉头顶、手指、双脚或器物；不要多余或残缺的手指、手与器物粘连。不要清代剃发留辫、瓜皮帽、马褂、清式补服或顶戴；不要明代网巾、宋代直脚幞头；不要现代民族礼服、伊斯兰式缠头或面纱、清真寺等后世宗教符号；不要用夸张的五官或肤色来表现族属。不要大弯月形弯刀；不要和车尔库同一张脸。汉式交领一律右衽（穿着者左襟压右襟），不要左衽、不要水平镜像。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；参考图只取画风、光线、质感和背景处理，不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
