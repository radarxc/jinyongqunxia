  prompt: '生成一张 2:3 竖幅全身人物立绘。


    画风：写实手绘古风人物插画，与项目现有立绘保持一致——像功力深厚的画师用细腻笔触画出的真实人物，不是照片、不是三维渲染、不是动漫。皮肤要有真实质感：看得见细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不打油亮高光；布料看得见经纬纹理、自然褶皱和穿用后的轻微旧化；整体是低饱和、沉稳的设色；柔和的自然光从左上方照来，明暗过渡连贯。


    人物：白马李三，《白马啸西风》中李文秀的父亲，河东出身的汉人护商武者，以一匹白马闻名；西行遭追杀之前的时期。

    时代：唐代武周长安年间（约 702 年），西州—庭州一带的西域（游戏设定）。服饰按唐代：汉人男子束发、戴软幞头或裹巾，穿圆领窄袖袍（缺胯袍）、半臂，骑行可穿翻领胡服；汉人女子高髻或高束发，穿短襦、半臂、高腰长裙或窄袖胡服；草原牧部（铁延部，突厥—铁勒背景的虚构混合牧部）穿翻领窄袖袍、长裤、软靴，编辫、戴毡帽。

    年龄与体态：约三十五岁的壮年男子，身材高大结实，肩宽背厚，有骑手的稳健。

    面容：宽额长方脸，下颌方正；浓黑平直的眉毛；眼睛不大但坦荡有神，目光沉稳直率；鼻梁上横着一道早年留下的浅色旧疤（已愈合）；嘴唇厚实、嘴角坚毅；唇上与下巴留修短的胡须；风吹日晒的麦色皮肤，眼角有细纹。

    发式：黑发束髻，用灰褐布巾裹头（唐代行旅的裹巾）。

    服饰：灰蓝色圆领窄袖袍（缺胯袍，两侧开衩），外罩一件栗色齐腰短褙，腰束黑色革带，深色长裤，黑色长靴。

    道具与姿态：左肩扛着一副镶银饰的旧马鞍（白马的鞍子，鞍下垂着一截缰绳）；右腰挂一柄直刃长剑在鞘内；正面站立，憨厚坦荡。


    构图：竖幅 2:3，单人全身立绘，从头顶到双脚完整入画，四周留出余白；站姿自然、重心稳定，身体正面或微侧，头颈端正、双眼平视；双手和所持器物完整清楚。背景：暖浅灰色纸底，只在远处有极淡的水墨远山（西域雪山与草坡的远影）和薄雾，大面积留白；人物轮廓与背景分明、边缘干净（后续要抠图），脚下只有极淡的接触阴影。


    排除：不要任何文字、题字、印章、签名、水印、边框；不要多个人物、多视图或拼贴；不要幼态（童颜、娃娃脸、儿童或少年身材、头大身小）；不要塑料皮肤、磨皮、网红脸、锥子下巴、过大的眼睛、浓妆滤镜、过度对称、过度精修、偶像化打光或蜡像感；不要与任何真实演员或明星相像；不要照片质感、三维渲染或动漫画风；不要现代物件；不要裸露、透视衣料或性感化；不要血腥；不要裁掉头顶、手指、双脚或器物；不要多余或残缺的手指、手与器物粘连。不要清代剃发留辫、瓜皮帽、马褂、清式补服或顶戴；不要明代网巾、宋代直脚幞头；不要现代民族礼服、伊斯兰式缠头或面纱、清真寺等后世宗教符号；不要用夸张的五官或肤色来表现族属。不要画出马；不要和霍元龙、陈达海同一张脸。汉式交领一律右衽（穿着者左襟压右襟），不要左衽、不要水平镜像。

