    【新神态（按年龄与性格定，不要千篇一律的平静脸）】坦荡豪迈：目光炯炯而警醒，嘴角一丝豪迈的笑意。

    【本张另外要求】上一版仍是严肃板脸，豪迈笑意不可见。请舒展眉间、目光炯炯警醒，嘴角双侧明显上扬，可自然微露上齿，形成一眼看得出的坦荡豪迈微笑；不夸张大笑，不软弱讨好。原脸型五官、胡须皱纹、肤色年龄、头巾衣饰、肩上马鞍、手势兵器、姿势和构图背景完全保留。

