  subject: 通用江湖男子 窄轮廓空手 A 字全身正面参考（约八头身、肩宽、中等体型，约45°双臂，素色短衣窄裤布靴）
  prompt: '【任务】修正第 1 张参考图这位通用江湖男子的双臂姿势，制作 Tripo 建模绑骨用的全身正面 A 字图。保留第 1 张同一张大众化男子面孔、平和不笑神情、小头八头身、肩宽中等身材、朴素束发、灰青素色布短衣、布腰带、窄裤和布靴。第
    2、3 张仅参考手绘画风，不照搬人物或服饰。

    【核心修改：双臂必须外展 45°】第 1 张的手臂角度过小，只有约 30°，必须从肩关节向两侧再抬高展开，双臂基本伸直，沿左右向下的 45° 对角线放置。肩关节到腕部的水平外移距离与竖直下移距离近似相等；左右手腕抬到腰带附近高度、至多比腰带低一点，不要仍垂到大腿侧。左手腕应在画面约
    (125,590)，右手腕约 (900,590)，这些坐标仅供构图参考，绝不能画成标记、文字或标尺。肩膀自然放松，不耸肩。手臂和腰侧之间有宽阔背景间隙。双手空手，手掌略向前，每手五指自然轻轻分开，拇指单独向外，手指结构正确可数。

    【服装】整条袖子贴合胳膊形体，袖口紧收腕部，去掉肘部垂挂的蓬松多余布料。衣服素色无纹样；下摆短而窄、不超过肩宽；双裤腿和靴子完整分开，腰带没有长飘带。男约八头身，适度宽肩，不改成矮胖或大头。腿脚姿势、脸、束发、配色与第
    1 张一致。

    【画面】完整全身正面，单人居中，头顶、左右手指和两脚底均不裁切，留边。1024×1536 PNG，2:3 竖幅，平视近正交视角。背景统一浅暖灰纯色 #E6E1D8，无渐变、纹理、投影或地面。柔和均匀光，写实手绘古风插画、棉麻布衣材质自然。

    【禁止】无文字、数字、标尺、坐标、标签、水印、边框、拼图、第二个人、兵器、道具、披风、宽袖、长袍、裙装、长飘带；不能变成 T 字，也不能仍保持 20°到30°的低垂手臂。'
