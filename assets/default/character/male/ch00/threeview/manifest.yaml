    (1) FRONT THREE-QUARTER: body turned 45° toward the viewer''s LEFT, face and chest visible; the character''s LEFT shoulder, arm and leg are nearer to the viewer (they appear on the right side of this figure).

    (2) LEFT-FACING SIDE PROFILE: the character faces the left edge of the image in a true 90° profile; the character''s LEFT side is toward the viewer.

    (3) BACK THREE-QUARTER: facing away toward the upper-left; back of head, top-knot and back visible; the character''s LEFT side is nearer to the viewer (it appears on the left side of this figure).

    All three figures face the LEFT side of the image.


    POSE identical in all three: neutral A-pose, arms straight and held about 20–30° away from the body so the armpits show background; palms toward the thighs, fingers relaxed and slightly apart; legs straight, feet shoulder-width apart, both soles on one common ground line; head level. Hands EMPTY: the sword from image 1 is a separate prop and is NOT on this sheet (no sword, no scabbard).


    CONSISTENCY: same height (crown and soles aligned), same scale, same costume details in every view; Han crossed collar right-lapped (wearer''s left panel over right) in every view; never mirror a view.


    STYLE: same refined realistic hand-painted rendering as image 1; soft even diffuse light from the upper left; muted colors; crisp silhouette edges. Hand-painted illustration texture, not a CG render: no overly smooth skin, no perfectly symmetrical features, no plastic highlights, no over-sharpened hair strands; keep natural brushwork and slight imperfections. Adult proportions.


