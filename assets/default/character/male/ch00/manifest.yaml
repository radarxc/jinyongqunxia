  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画；皮肤有真实质感——细小毛孔、细纹、晒痕、轻微色斑和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】范蠡，《越女剑》中越王勾践的上大夫，春秋末越国（约公元前 482 年）。他在越营请阿青教越军剑法，是序章越营一段的叙事人物。

    【年龄与体态】中年男子，约四五十岁（确龄待考）；中等偏高、身形清瘦挺拔，举止从容。

    【面容】长脸、额头宽阔，眉目清朗、眉毛修长，眼睛细长、目光深沉而有远虑，鼻梁高直；唇上与下巴留修剪整齐的短须，鬓角已有几丝灰白，眼角有细纹；神情儒雅、干练，带一点不轻易流露的忧思（原创扩展）。

    【发式】黑发在头顶束髻，戴一顶简朴的黑色小冠，以骨笄横贯固定。

    【服饰】春秋士大夫的深衣式长袍：深青色交领右衽，宽袖，衣缘有窄的玄色镶边，腰束丝质大带、带端垂下，腰侧系一块素玉佩；脚穿黑色布履。形制细节（待考），不画成汉以后或宋明官服。

    【道具】左手持一卷合拢的竹简，右手自然垂下或轻拢袖口。

    【姿态与神情】正面站立，身姿端正、从容不迫，目光平视前方，像在权衡一件大事。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要盔甲、长剑或兵符；不要宋明清服饰、乌纱帽；不要第二个人（西施只在剧情中被提及，不入画）。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。

    【去 AI 味】手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。'
