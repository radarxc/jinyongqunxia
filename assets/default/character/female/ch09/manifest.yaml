    【人物】凌霜华，《连城诀》中荆州知府凌退思的女儿、丁典倾心相守的人；为拒绝父亲逼婚而自毁容貌之后的时期。

    【年龄与体态】约二十二岁的成年女子，身材修长纤弱，体态端正。

    【经典造型】要一眼认出是凌霜华——知府千金的素雅装束、手捧一盆绿菊、清冷温婉的书卷气，脸上留着自毁容貌的旧刀疤却神情坦然；即使有疤也是端庄动人的美人。

    【面容】清秀的长鹅蛋脸；眉毛细长柔顺；眼睛明澈而温柔，眼神坚定沉静，带着书卷气；鼻梁秀挺；嘴唇薄；皮肤白皙，有真实的毛孔与纹理。脸上有几道已经愈合的淡红色刀疤，从额角斜划过左颊，清楚可见却不血腥；她坦然面对，不用头发遮掩。

    【发式】乌发整洁地收成低髻，插一支细银簪。

    【服饰】知府小姐的素雅装束——烟紫色交领长袄（右衽）、暖灰白长裙、软底鞋；衣缘只有极少的同色细线。

    【道具与姿态】双手捧着一盆绿菊花——淡绿色的细长花瓣，素陶花盆，没有字；平静站直，目光柔和。

