  prompt: '生成一张 2:3 竖幅全身人物立绘。


    画风：写实手绘古风人物插画，与项目现有立绘保持一致——像功力深厚的画师用细腻笔触画出的真实人物，不是照片、不是三维渲染、不是动漫。皮肤要有真实质感：看得见细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不打油亮高光；布料看得见经纬纹理、自然褶皱和穿用后的轻微旧化；整体是低饱和、沉稳的设色；柔和的自然光从左上方照来，明暗过渡连贯。


    人物：凌霜华，《连城诀》中荆州知府凌退思的女儿、丁典倾心相守的人；为拒绝父亲逼婚而自毁容貌之后的时期。

    年龄与体态：约二十二岁的成年女子，身材修长纤弱，体态端正。

    面容：清秀的长鹅蛋脸；眉毛细长柔顺；眼睛明澈而温柔，眼神坚定沉静，带着书卷气；鼻梁秀挺；嘴唇薄；皮肤白皙，有真实的毛孔与纹理。脸上有几道已经愈合的淡红色刀疤，从额角斜划过左颊，清楚可见却不血腥；她坦然面对，不用头发遮掩。

    发式：乌发整洁地收成低髻，插一支细银簪。

    服饰：知府小姐的素雅装束——烟紫色交领长袄（右衽）、暖灰白长裙、软底鞋；衣缘只有极少的同色细线。

    道具与姿态：双手捧着一盆绿菊花——淡绿色的细长花瓣，素陶花盆，没有字；平静站直，目光柔和。


    构图：竖幅 2:3，单人全身立绘，从头顶到双脚完整入画，四周留出余白；站姿自然、重心稳定，身体正面或微侧，头颈端正、双眼平视；双手和所持器物完整清楚。背景：暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物轮廓与背景分明、边缘干净（后续要抠图），脚下只有极淡的接触阴影。


