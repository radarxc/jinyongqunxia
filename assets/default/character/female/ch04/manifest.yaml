  subject: 灭绝师太（ch04_yitian）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【剧照参考】随提示词上传的第 1 张参考图是这个角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征（脸型、眉眼、鼻唇的比例与神态），让人一眼认出是这个角色；但必须重新绘制成本项目画风的手绘写实插画，不要照片质感，不要照搬剧照的构图、取景、光影、背景和姿势，也不要做成照片修图或磨皮美颜；剧照里的影楼柔光、浓妆、字幕和水印都不要。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【人物】灭绝师太，《倚天屠龙记》峨眉派掌门；六大派围攻光明顶、万安寺被囚之前，手持倚天剑。性情刚烈、疾恶如仇，手段狠辣。

    重出要求（上一版的问题，这次必须改正）：上一版的眉毛几乎是平的，缺了原著最醒目的特征：两条眉毛必须从眉头起就明显向两侧外下方斜垂，眉尾比眉头低很多，呈倒写的“八”字（眉头高、眉尾低），让整张脸显得阴森冷厉、面相诡异——这是本图最重要的辨识点，一定要清楚画出来；眼神要更严厉、带杀气，嘴角下压。

    【年龄与体态】五十岁上下（原著四十多岁），身材瘦削挺拔。成年女性的身体比例（约 7 头身），衣着完整端庄。

    【经典造型】照剧照里这一版深入人心的灭绝师太来画：头上紧裹一顶灰褐色布尼帽，把头发和耳朵全包住，只露出脸；眉心一点圆圆的白色小珠饰；面容端正却冷厉，不苟言笑；灰褐僧衣外搭金褐色回纹锦边的袈裟，手持倚天剑。

    【面容】照剧照的脸型和五官来画：端正的圆长脸、两颊略松，法令纹清楚；原著写她两条眉毛斜斜下垂、一副面相极是诡异：两条长眉从眉头向眉尾明显斜斜下垂（呈八字形），使整张脸显得阴森、冷厉；眼神严厉；嘴角下压。

    【发式】出家人，头戴灰褐布尼帽，不露头发。

    【服饰】灰褐色交领右衽僧衣，白色内领，外搭一条金褐色回纹锦边的袈裟（从左肩斜披），布带，僧鞋。

    【道具】右手握倚天剑，完整入古朴的黑色剑鞘，剑尖朝下；左手拇指上戴一枚铁指环（峨眉掌门信物）。

    【姿态与神情】正面站立，神情冷峻严厉、不怒自威。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、照片修图感、三维渲染或动漫大眼；不要直接复制剧照的画面；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要平直或上挑的眉毛；不要露出头发、不要金莲花冠；不要老态龙钟；不要倚天剑出鞘或剑光特效。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
