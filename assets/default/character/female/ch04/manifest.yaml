    【剧照参考】随提示词上传的第 1、2 张参考图是这个角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征（脸型、眉眼、鼻唇的比例与神态），让人一眼认出是这个角色；但必须重新绘制成本项目画风的手绘写实插画，不要照片质感，不要照搬剧照的构图、取景、光影、背景和姿势，也不要做成照片修图或磨皮美颜；剧照里的影楼柔光、浓妆、字幕和水印都不要。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【人物】小昭，《倚天屠龙记》黛绮丝之女，明教光明顶上被锁着手足铁链的侍女；光明顶密道中现出真容、铁链尚未解开的阶段。温柔聪慧、恭顺体贴，心里却极有主见；日后会成为波斯明教圣女。

    【年龄与体态】原著年纪还小，按本作规定画成约二十岁的成年年轻女子，身材纤秀。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】照剧照里这一版深入人心的小昭来画：额前一条细细的银额链、正中坠一颗小小的浅蓝宝石；长长的黑发分在两侧垂到胸前，发间缠着细白丝带和小发饰；温柔乖巧、楚楚动人，眼里藏着聪慧和深情。剧照里没有的手脚铁链按下文加上。

    【面容】照剧照的脸型和五官来画：柔和的鹅蛋脸、下巴秀气；修长的眉毛；一双湛湛有神的大眼睛，深棕瞳色里透出一点淡淡的海水蓝（波斯混血的标志，清楚但自然）；鼻梁比一般汉族女子略高挺；小巧的嘴、唇色淡红，嘴角浅浅含笑、颊边一个浅浅的梨涡；肌肤雪白细腻。美丽动人、清秀绝俗，让人一见就心生怜爱。

    【发式】中分的乌黑长发，头顶一小半挽起，其余分成两股从耳后垂到胸前，发间缠着细白丝带和几枚小银饰；额前那条细银额链，正中一颗小浅蓝宝石。

    【服饰】朴素的侍女衣裙：月白交领右衽窄袖上衣，肩头一片浅青蓝色的织花小披肩，浅青灰长裙（裙内有长裤），布腰带，平底布鞋；干净整洁。

    【道具】两只手腕之间连着一段细铁链、两只脚踝之间也连着一段细铁链，铁环朴素，链条松松下垂，可以小步行走；不勒伤、不悬吊。

    【姿态与神情】正面站立，双手轻轻托着腕间的铁链；神情温柔恭顺中透着聪慧，嘴角浅浅含笑，梨涡隐现。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、照片修图感、三维渲染或动漫大眼；不要直接复制剧照的画面；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要娃娃脸、少女或儿童身材、双丫髻；不要华丽宫装或仙女长裙；不要金发碧眼的外国人；不要浓妆；不要驼背歪嘴的伪装形象；不要圣火令、教主冠服；不要与周芷若、赵敏撞脸。

