  subject: 黛绮丝（紫衫龙王真容）（ch04_yitian）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】黛绮丝，《倚天屠龙记》明教四大护教法王之首「紫衫龙王」，当年的武林第一美人；本图是她卸去「金花婆婆」老妇易容之后的真容。外表高傲冷艳，心里背负着与波斯明教的旧约和对亡夫的深情。

    【年龄与体态】约四十岁的成熟女子，风姿犹存；身材高挑修长、体态优雅（水性极佳，常年习武）。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：一袭深浅相间的紫衫，长发半挽，冷艳高贵、带着异域风情的绝代美人，眼神里有高傲也有落寞。

    【面容】中原与波斯混血：高鼻梁、略深的眼窝，一双杏眼（瞳色深褐中透一点灰蓝），浓密修长的眉毛，唇形丰润，肌肤白得像雪，面部轮廓立体；眼角有浅浅细纹，却风韵极盛。风华绝代的成熟美人，冷艳而动人。

    【发式】乌黑而带一点自然波浪的长发半挽成髻，用一支金簪固定，其余垂在背后；不戴金花婆婆的金花。

    【服饰】原著因常穿紫衫得名：一身淡紫色长衫（交领右衽，衣缘有少量波斯风格的细纹滚边），外罩深紫色长褙子，深紫色腰带，同色长裙，软靴。

    【道具】空手。

    【姿态与神情】挺拔站立，一手轻提衣襟、一手自然垂下；眼神深邃，带着高傲和难以言说的落寞。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要像任何真实演员或明星；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要老妇或驼背的金花婆婆造型；不要金发碧眼的外国人（是混血，仍有汉人轮廓）；不要暴露或异域舞娘装束；不要浓妆。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
