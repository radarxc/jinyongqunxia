    【人物】周芷若，《倚天屠龙记》峨眉派掌门，汉水船家之女、灭绝师太的传人；屠狮大会上的阶段，已暗练九阴白骨爪。外表温婉清丽，内心隐忍要强、有心机。

    【年龄与体态】约二十二三岁的成年女子，身形纤细修长，但有习武的筋骨。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】照剧照里这一版深入人心的峨眉掌门来画：眉心一点朱砂红点，高髻两侧横插几支细长的金簪，两条细辫从耳后垂到胸前，耳垂坠着细长的耳坠；一身素白衣裙配淡粉镶边；清丽温婉，眉眼间却压着清冷、隐忍和倔强。

    【面容】照剧照的脸型和五官来画：修长的鹅蛋脸、下巴略尖、两腮清瘦；眉毛细长、眉尾微微下压；一双清澈的大眼睛、双眼皮，眼神温婉收敛、隐忍里藏着倔强；鼻梁秀挺；唇形小而饱满、唇色淡红；肤色白皙。清丽绝俗、温婉动人。

    【发式】乌发在头顶盘成端正的高髻，髻的左右两侧各横插三支细长的素金簪（向两边平伸）；额前发际干净，耳后各垂下一条细辫到胸前；眉心一点小小的朱砂红点。

    【服饰】素白交领右衽长衣，衣襟和袖口镶一道淡粉色绣花边，淡粉色内衫、领口合拢，浅粉长裙，素色窄腰带；耳坠是细长的银珠坠。

