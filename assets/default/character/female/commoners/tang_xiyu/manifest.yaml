    人物：唐·西域女郎中，中年成年人，女郎中 / 草药医者；只画一个明确成年的普通人，不对应任何具名人物或真人。成年长椭圆脸，肤色自然，手指灵活，体态匀称，神情冷静亲切；西域风沙下自然晒褐肤色，不夸张族群五官。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


    长相设定（本张独有，必须画出来，和服饰一样重要）：约 45 岁；窄长脸，下巴略方，单眼皮细长眼，眉毛稀淡，圆鼻头，嘴角一颗痣；身材瘦小。这张脸和体型要一眼就和参考图女子那种瓜子脸、大眼睛、柳叶眉、樱桃小口的美人样子不同，也不要画成千篇一律的路人模板脸。姿态：侧身约三分之一，头转回来看向观者，动作自然。


    服饰：首服/发式：黑发编束后覆素头巾或小毡帽；上衣：长袖对襟衫；下装：及踝长裙配内裤；鞋：软皮靴；配饰：窄织带；颜色与材质：土红、沙白、暗青羊毛与麻布；职业差分：衣袖洁净收口，腰间有素布药囊，不穿仙侠医女白纱或华丽宫装。服装结构、穿法、磨损和垂坠必须可信，遵守唐·西域时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    服饰补充：服饰各项若与「职业差分」冲突，以职业差分为准。这是唐代西域（安西四镇一带）胡汉杂居的风貌：不画清真寺、宣礼塔、新月或伊斯兰纹样，不画后世维吾尔式四角花帽与艾德莱斯绸，不画清代辫发。配色：在给定的颜色里，这一张的外衣以「沙白」为主色，其余作辅色。


    标志道具：分格药篮、小木药杵与无字布签。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。


    手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。也不要油画笔触、厚涂和画布纹理。


    背景：不透明暖浅灰纸底，加极淡水墨远山，只作微弱层次，不画具体建筑、街市或多人场景；背景与人物分离，轮廓清楚，脚下仅轻微接触阴影。目标规格 1024×1536 PNG，后续统一抠图。


