    人物：西夏农妇，壮年成年人，农妇 / 村妇；只画一个明确成年的普通人，不对应任何具名人物或真人。成年圆脸，眉眼有生活纹理，肩臂结实、身材自然，神情温和有主见；河西强光下自然晒色，不夸张党项五官。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


    长相设定（本张独有，必须画出来，和服饰一样重要）：约 32 岁；椭圆脸偏胖，双下巴，眼袋明显，额头和眼角有细纹；身材丰腴。这张脸和体型要一眼就和参考图女子那种瓜子脸、大眼睛、柳叶眉、樱桃小口的美人样子不同，也不要画成千篇一律的路人模板脸。姿态：身体朝画面右侧转约三十度，重心落在一条腿上，动作自然。


    服饰：首服/发式：高髻配小团冠；上衣：交领右衽窄袖衫；下装：百褶长裙；鞋：弓履；配饰：窄织带；颜色与材质：暗红、灰绿、沙白绢麻；职业差分：外加耐磨围裙或护膝布，袖口收好，衣着完整不性感化。服装结构、穿法、磨损和垂坠必须可信，遵守西夏时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


