    重出要求（上一版的问题，这次必须避免）：上一版画成了三十出头、清秀苗条的美人，不对：这次要画四十多岁的中年妇人，宽椭圆脸、颧骨平缓、体态结实，眼角和嘴角有细纹，相貌平常。


    人物：南宋女掌柜，中年成年人，店铺女掌柜；只画一个明确成年的普通人，不对应任何具名人物或真人。成年宽椭圆脸，颧骨平缓，体态结实，神情爽利沉着；江南湿润环境下自然肤色，劳动者保留晒痕。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


