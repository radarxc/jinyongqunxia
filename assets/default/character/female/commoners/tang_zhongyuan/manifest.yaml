    人物：唐·中原女掌柜，中年成年人，店铺女掌柜；只画一个明确成年的普通人，不对应任何具名人物或真人。成年宽椭圆脸，颧骨平缓，体态结实，神情爽利沉着；中原自然肤色，劳动者保留日晒与生活纹理，不统一磨皮。面孔朴素而有个体差异，真实骨相与生活纹理，五官和体型不要套模板，避免与任何具名人物撞脸。


    长相设定（本张独有，必须画出来，和服饰一样重要）：约 58 岁，鬓角已有白发；鹅蛋脸但五官平淡，眉毛淡，眼睛不大，鼻翼略宽，嘴角下垂，神情有些疲惫；中等身材。这张脸和体型要一眼就和参考图女子那种瓜子脸、大眼睛、柳叶眉、樱桃小口的美人样子不同，也不要画成千篇一律的路人模板脸。姿态：侧身约三分之一，头转回来看向观者，动作自然。


    服饰：首服/发式：黑发盘成低髻，以木簪固定；上衣：交领右衽窄袖襦；下装：及踝高腰长裙；鞋：平底麻履；配饰：素色披巾与窄带；颜色与材质：低饱和藕褐、灰绿、米白麻布与普通绢；职业差分：外加素布短围裙和窄袖套，衣领封闭端庄，不堆珠翠。服装结构、穿法、磨损和垂坠必须可信，遵守唐·中原时代及地域，不把史料中的贵族、宫廷或高阶礼服降格套给普通人。


    服饰补充：服饰各项若与「职业差分」冲突，以职业差分为准。配色：在给定的颜色里，这一张的外衣以「灰绿」为主色，其余作辅色。


    标志道具：木筹、钥匙串与一个无字布袋。道具比例、握持、佩挂和受力关系清楚，所有端点完整入画。


    画风与构图：写实手绘古风，与项目具名人物立绘一致；单人、单视图、完整全身，平视近正面略侧，成年人体态自然，头顶、双手、双足和全部道具均不裁切，人物轮廓清楚。真实皮肤与布料质感，自然不对称，普通人长相，不要网红脸与 AI 塑料感；低饱和设色，柔和自然光，不用夸张武侠特效。


    手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。也不要油画笔触、厚涂和画布纹理。


    背景：不透明暖浅灰纸底，加极淡水墨远山，只作微弱层次，不画具体建筑、街市或多人场景；背景与人物分离，轮廓清楚，脚下仅轻微接触阴影。目标规格 1024×1536 PNG，后续统一抠图。


    排除项：不要文字、汉字、伪字、题字、标签、签名、印章、logo、水印；不要多人、群像、重复人物、分格、多视图、半身或裁断头脚与道具；不要儿童、少年感、幼态成人、娃娃脸；不要统一网红脸、明星脸、真人肖像、浓妆、磨皮、AI 塑料皮肤、动漫大眼、摄影写真或三维渲染感；不要跨朝混搭、错置族群服饰、影视套路制服、帝王贵族纹样、现代物件、现代服装、拉链、腕表、运动鞋、塑料制品；不要日式刀具、欧式奇幻铠甲、赛博、蒸汽朋克、发光兵器、法阵、粒子特效；不要裸露、透明衣料、性感化、污秽猎奇、恶搞贫困、血腥、畸形肌肉、多肢、多指、粘连手指、悬空道具或错误受力。'
