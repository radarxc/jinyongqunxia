    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】程灵素，金庸《飞狐外传》的女主角，毒手药王的关门弟子，住在药王庄、种花用药的村女，和胡斐初识之后。

    【年龄与体态】二十岁上下的成年女子：身材瘦小单薄，双肩窄而斜削，但五官和身体都是成年人的比例（约七头身），不是孩子。衣着完整端庄。

    【气质定位】不是艳丽的标准美女，而是清冷素净、有书卷气和高级感的女子——越看越有味道，像一株安静的兰草；聪慧、沉静、有主见（作者：别画丑，要高级一些）。

    【面容】清瘦小巧的脸，骨相清秀，颧骨微显，下巴小巧；肤色是偏暖的浅麦色，不施脂粉，干净有光泽，不是病容；眉毛淡而细长，鼻子小巧挺秀，嘴唇薄、颜色淡；一双眼睛明亮之极，眼珠漆黑、黑白分明，抬眼一看时精光四射——眼睛不必画得特别大，但要是全脸最亮、最有神的地方。神情安静、聪慧、温柔里带着倔强。

    【发式】发色偏浅、带一点黄褐，发量不多但柔顺整洁，在脑后挽成一个小小的低髻，用一条洗旧的绿色布带扎住，额边几缕细软的碎发。

    【服饰】洗得发白的青布短衫，交领右衽（穿着者左襟压右襟），深蓝布裤，腰上系一条旧布围裙，脚穿布鞋；朴素的村女打扮，衣服干净平整、剪裁合身，配色素雅（青、靛、米白），朴素里见讲究。

    【道具与姿态】右手提一把小小的竹柄花锄；腰间挂一只灰褐色小布药囊。不拿兵器。安静地站着，微微抬眼望向前方，眼神清亮、聪明、温柔里带着倔强。

    【不要】画面里不要任何文字、题款、印章、签名、水印、台标、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、日式服饰或日本刀、发光特效、法阵或能量光。不要浓妆、性感化或暴露的衣着；不要白皙皮肤配乌黑浓密秀发的甜美标准美女脸；也不要丑化、菜色病容、枯槁憔悴、蓬头垢面；不要丰满身材；不要病危、毒斑、死亡的样子；不要蜡烛和毒雾。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
