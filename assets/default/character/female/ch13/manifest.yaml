  prompt: '【任务】Use case: identity-preserve。这是图像编辑，不是重画。第1张为待改原图（骆冰），第2张为该原图的脸部特写。以第1张完整图为底，只修改面部，然后输出完整1024×1536的2:3竖幅图片。

    【作者AR-69目标】作者要求骆冰不要露齿。只编辑面部表情，把露齿的笑改为不露齿的浅笑：上下嘴唇自然合拢、牙齿完全不可见，嘴角轻微上扬，眉眼轻松，温婉而爽朗。不要抿嘴用力，不要变成板脸或大笑。ch12与ch13两张的笑意强度、闭唇状态、眼角放松程度要一致。 第3张是已定下的ch12骆冰面部，仅用于对齐这个不露齿浅笑的分寸；仍以第1张为底，不借用第3张的服饰、器物、发式或年龄阶段。

    【必须保留】是原图的同一个人物，年龄、基本骨相、脸的大小位置、头部朝向和身体姿势保留；只在脸部完成要求。发式与头饰、发丝轮廓、服装款式颜色纹理和每处褶皱、右衽方向、腰带、佩饰、刀剑刀鞘、手和器物、鞋子、人物站位、构图取景、背景山水花枝纸底、光线色调与画风保持原图不变。不要裁切、镜像或重排。

    【画风】与原图一致的写实手绘古风人物插画。面部自然，有轻微不对称和细腻的手绘肤质；不要皮肤磨皮、塑料高光、照片质感、完美对称五官、网红尖下巴和玻璃大眼。面部的新光影色温笔触与其余部分一致。

    【不要】不要露齿、张嘴、夸张大笑；不要文字、字幕、题款、印章、水印、电视台logo；不要第二个人；不要复制剧照的镜头拼接或场景；不要改变衣饰、发式、构图、手、兵器、背景和画风。

    【重出具体修正】首轮ch13虽然闭唇了，但嘴角近乎平直，显得不笑，明显弱于第3张已定ch12。保持ch13原本的脸、年龄与骨相，匹配第3张ch12的表情肌分寸：嘴角两端轻轻上扬到与ch12相同程度，嘴唇仍轻松闭合且完全不露齿，脸颊略提、眼角放松，温婉爽朗。不是照搬ch12五官或衣服，只把笑意强度对齐。避免板脸与抿嘴。其余部分严格保留第1张。'
