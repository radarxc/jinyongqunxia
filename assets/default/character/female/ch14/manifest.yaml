  subject: 苗若兰（ch14_xueshan）
  prompt: '生成一张 2:3 竖幅全身人物立绘。

    人物：苗若兰，金庸《雪山飞狐》的女主角，苗人凤与南兰的独生女，琴棋书画皆通，在玉笔山庄听众人讲述旧事、与胡斐相遇的时候。

    经典形象：要一眼认出是苗若兰——淡绿皮袄镶白毛边、鹅黄百褶长裙、凤头珠钗，肤光胜雪、眉间书卷清气，温雅端庄；清丽绝俗的美人。

    年龄与体态：约二十岁的成年女子，体态纤细修长、端正，约七头身，成年女性比例。

    脸与五官：清丽的鹅蛋脸，下巴略尖而柔和；眉毛细长舒展，眉间隐然有一股书卷清气；一双眼睛清澈沉静，眼窝略深、鼻梁高直，带一点父亲苗人凤的轮廓；唇形端正；肤光胜雪，微带红晕。温雅端庄、不卑不亢。和母亲南兰有几分相像，但没有那种含愁的怯意，更沉静大方。

    发式：乌黑的长发半绾，头顶挽一个小髻，插一支小巧的凤头珠钗，其余长发垂到背后。

    服饰：淡绿色皮袄（领口和袖口镶一圈白色毛边），下着鹅黄色百褶长裙，暖白色平底鞋；交领右衽（穿着者左襟压右襟）。

    兵器与道具：不拿兵器；一手轻拢另一侧的袖口。

    姿态与神情：安静站立，略侧身像在聆听，温雅而有主见。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；浓妆、性感化或暴露的衣着；十六七岁的少女脸、娃娃脸、儿童比例；网红脸；性感化；兵器；和南兰同一张脸。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；参考图只取画风、光线、质感和背景处理，不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
