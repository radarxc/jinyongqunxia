  prompt: '生成一张 2:3 竖幅全身人物立绘。

    人物：胡夫人，金庸《雪山飞狐》回忆中胡一刀的妻子、胡斐的母亲，刚生下孩子不久，在沧州客店看丈夫与苗人凤比武的时候。

    经典形象：要一眼认出是胡一刀的夫人——裹在皮裘里只露出一张白皙美丽的脸，眉如远山、眼神沉静聪慧而有胆识；大方开朗、有英气的美人。

    年龄与体态：二十五岁左右的少妇，身体纤秀而有骨架，约七头身；产后略带倦意但精神清醒。

    脸与五官：偏长的瓜子脸；眉毛修长舒展，像远山；一双清亮的眼睛，眼神沉静、聪慧、带着胆识；鼻梁挺秀；唇形饱满；肌肤白皙（与丈夫的黝黑形成强烈对比）。美得大方开朗，有英气，不是柔弱的闺秀，也不是网红脸。

    发式：已婚妇人的低髻，一支素银簪固定。

    服饰：全身裹在一件厚实的浅米色皮裘里，只露出脸和双手；皮裘里面是右衽夹袄和灰蓝长裙，软底鞋。

    兵器与道具：空手，双手拢住皮裘的前襟。

    姿态与神情：静立微侧，肩背舒展，目光专注地望向前方，温婉中有胆识。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；浓妆、性感化或暴露的衣着；和南兰、马春花同一张脸；童颜；浓妆；抱婴儿；兵器；伤口血迹。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

