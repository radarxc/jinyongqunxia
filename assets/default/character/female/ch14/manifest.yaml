    【人物】主角（女）：本作原创的穿越者，此刻身处《雪山飞狐》清乾隆·雪地（约 1780 年，项目年表）；长白山雪地旅途的普通江湖人。本图是她在这一时代的基础立绘，不代表特定门派或结局。

