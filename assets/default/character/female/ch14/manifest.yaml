  prompt: '生成一张 2:3 竖幅全身人物立绘。

    人物：南兰，金庸《雪山飞狐》回忆中苗若兰的母亲、苗人凤的前妻，官家小姐出身，生前的日常模样。

    经典形象：要一眼认出是南兰——圆整低髻、素金簪、藕荷绸袄、手握素帕，含愁带怯、美得精致而忧郁的官家小姐。

    年龄与体态：二十五岁左右的少妇，体态纤弱娇柔，约七头身。

    脸与五官：小巧的鹅蛋脸，下巴圆润；细细弯弯的柳叶眉；一双含愁带怯的杏眼，眼尾微微下垂，眼神飘忽不定；鼻子小巧；嘴唇小而红润（天然的红，不是浓妆）；肤色白如凝脂。美得精致，却带着忧郁和不安分。

    发式：绾成圆整的低髻，插一支小小的素金簪。

    服饰：浅藕荷色右衽绸面夹袄（穿着者左襟压右襟），领缘深梅色，米灰色百褶长裙，厚度适合寒地；平底绣鞋。

    兵器与道具：手中轻握一方素白手帕。

    姿态与神情：侧身静立，目光微微移向远处，惆怅而克制。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；浓妆、性感化或暴露的衣着；和胡夫人、马春花同一张脸；和苗若兰同龄的少女脸；浓妆；性感化；珠钗。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

    【画风基线】上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；参考图只取画风、光线、质感和背景处理，不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
