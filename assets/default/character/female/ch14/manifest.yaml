    【姿态与神情】双脚坚定落地、肩背舒展，目光沉静，厚冬衣下仍看得出同一个人的挺拔体态，不因寒冷显得疲惫衰老。成年女性的身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

