    服饰与材质：浅黄白右衽窄袖衣、淡青短外衫、青灰齐腰长裙、平底布鞋与朴素腰束；黑发收束清楚，仅少量低调发饰。完整衣料裁剪利落，领襟袖口下摆有清楚缝边，以明晰衣形表现少女帮主的自信。软猬甲内穿，不靠金冠、首饰堆叠或外露尖刺体现威信。

