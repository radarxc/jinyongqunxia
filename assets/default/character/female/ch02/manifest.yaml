  subject: 梅超风（ch02_shediao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画；皮肤有真实质感——细小毛孔、细纹、晒痕、轻微色斑和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】梅超风，《射雕英雄传》黑风双煞之一“铁尸”，黄药师的叛徒弟子，陈玄风已死、双目已盲的阶段；阴狠孤绝，却仍念师恩。

    【年龄与体态】约四十岁的成熟女子，身形瘦削修长，肩臂有长年练九阴白骨爪的筋骨。成年女性的身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：铁尸梅超风——披散的长黑发、一身黑衣，双目失明，阴森冷厉之中带着几分凄美。

    【面容】瓜子脸、颧骨略高、面颊瘦削，眉毛细长上挑，鼻梁挺、薄唇；双目失明——眼珠灰白无神、眼皮半垂；脸色苍白中透青，眼角有细纹；神情阴森冷厉（面貌细节原著待考，此为原创扩展）。五官本是清秀的美人底子，只是神情阴森。

    【发式】乌黑长发披散到腰，只有一缕在脑后随意束起。

    【服饰】深灰黑色交领右衽长衫、黑色长裙（内有长裤），黑布腰带，软底鞋。

    【道具】右手握一条长长的银白色长鞭（白蟒鞭），鞭身盘成几圈、鞭梢拖在地上，完整入画；左手五指微屈成爪，但指甲正常、不长出利爪。

    【姿态与神情】站姿警觉，像在凝神听四周的动静（头部仍端正）；冷厉阴森。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要明亮正常的眼睛；不要鬼怪化的长指甲或骷髅；不要血腥；不要年轻少女面孔。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。

    【去 AI 味】手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。'
