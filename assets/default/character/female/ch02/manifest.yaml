  subject: 黄蓉（ch02_shediao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】黄蓉，《射雕英雄传》南宋桃花岛主黄药师的独生女，君山大会后接任丐帮帮主的阶段；聪明绝顶、古灵精怪、俏皮狡黠，又真心护着郭靖。

    【年龄与体态】原著十五六岁，按本作规定画成约二十岁的成年年轻女子，身材纤秀匀称、体态轻盈灵动。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：九十年代港剧里黄蓉最灵动的那一版气质——一双大眼睛顾盼生辉，笑起来眼睛弯成月牙、嘴角翘起，甜美里带着狡黠和机灵，浑身透着神采飞扬的灵气（已是成年人）；乌发半挽、发间箍着金环，衣裙轻盈；手握碧绿竹棒。

    【面容】原著写她肌肤胜雪、娇美无比、容色绝丽。具体为：圆润柔和的鹅蛋脸，两颊饱满、下巴圆而小巧；一双黑白分明的大眼睛，眼波流转、眼尾微微上挑，亮晶晶的满是灵气；眉毛细长弯弯；鼻梁小巧挺直；嘴唇饱满、嘴角天生上翘，似笑非笑带着俏皮；肌肤白皙透亮、两颊自然红润，妆容清淡。美丽动人、灵气逼人，让人一见就喜欢。

    【发式】乌黑长发一半在头顶挽成一个小巧的发髻、一半披在肩后，发髻前箍一枚精巧的金环（玫瑰花枝纹，桃花岛珍藏），额前有少量碎发。

    【服饰】淡绿色交领右衽窄袖衫，外罩更浅的嫩绿短褙子，月白齐腰长裙，腰系一条浅金色丝绦，平底绣鞋；衣料轻柔，干净雅致。

    【道具】右手握一根碧绿通透的竹棒（丐帮打狗棒，约齐肩高，竹节清楚，像碧玉一样），棒梢轻点地面。

    【姿态与神情】正面站立、重心略偏、一只脚轻轻点地，头部端正；眼神灵动带笑，嘴角翘起，像刚想到一个鬼主意。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要像任何真实演员或明星；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要粉色或桃色衣裙、两侧垂辫加成簇花饰的造型；不要网红尖下巴、厚重眼妆、艳丽红唇；不要双丫髻或孩子气的发饰；不要少女或儿童身材。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
