  prompt: 'Image 1 is the approved full-body portrait of this character: the female protagonist in her "high charm" look, a Chinese woman of about 22. Use it for identity (face, age, body type), hairstyle and the exact costume (colors, layers, trims, sash, shawl, shoes). Image 2 is a turnaround sheet of a DIFFERENT character: use it ONLY for the layout (three figures side by side, spacing, scale, plain background, A-pose); never copy that man''s face, body, hair or costume.


    IDENTITY ANCHORS, copied exactly from image 1 and identical in every view: (a) the same beautiful gentle face, small mole under her eye on the same side as in image 1, black hair half-up: one loose bun on the crown with a plain white jade hairpin and a short vermilion-red cord at the base of the bun, the rest of the long straight hair falling down the back to the waist, a few loose strands at the temples; (b) moon-white (warm off-white) Han crossed-collar robe with wide flowing sleeves, right-lapped, over a white inner robe; (c) a pale silver-grey silk sash tied at the front waist in a simple knot with two long ends hanging down; (d) a floor-length white skirt with two or three layers of light gauze; (e) a very thin white shawl ribbon (pibo) draped over both forearms; (f) plain white cloth shoes. Slender graceful adult build, about 7.5 heads tall.


    TASK: a clean CHARACTER TURNAROUND MODEL SHEET of this same person for 3D multi-view modeling. Exactly THREE full-body figures side by side, left to right:

    (1) FRONT THREE-QUARTER: body turned 45° toward the viewer''s LEFT, face and chest visible; the character''s LEFT shoulder, arm and leg are nearer to the viewer (they appear on the right side of this figure).

    (2) LEFT-FACING SIDE PROFILE: the character faces the left edge of the image in a true 90° profile; the character''s LEFT side is toward the viewer.

    (3) BACK THREE-QUARTER: facing away toward the upper-left; back of head and back visible, the long hair falling down her back; the character''s LEFT side is nearer to the viewer (it appears on the left side of this figure).

    All three figures face the LEFT side of the image.


    POSE identical in all three: neutral relaxed A-pose, arms straight and held about 20–30° away from the body so the background shows between the arms and the body; the wide sleeves and the shawl ribbon hang straight down under gravity (NO wind, nothing flying), close to the body but not merging with it; palms toward the thighs, fingers relaxed; feet together about hip-width, both shoe tips visible under the skirt hem, both soles on one common ground line; head level. Hands EMPTY (no prop).


    CONSISTENCY: same height (crown and soles aligned), same scale, same costume details in every view; Han crossed collar right-lapped (wearer''s left panel over right) in every view; never mirror a view. Opaque fabrics (no see-through), clean readable silhouettes and layers.


    STYLE: same refined realistic hand-painted rendering as image 1; soft even diffuse light from the upper left; muted colors; crisp silhouette edges. Hand-painted illustration texture, not a CG render: no overly smooth skin, no perfectly symmetrical features, no plastic highlights, no over-sharpened hair strands; keep natural brushwork and slight imperfections. Adult proportions, no childlike face or body.


    LAYOUT: plain flat uniform warm light-grey background (#E6E1D8); no texture, ink wash, scenery, ground plane, cast shadow, vignette or frame; at least 6% empty margin around and between figures; orthographic eye-level view, no perspective distortion. Wide landscape 3:2 canvas, 1536×1024 pixels.


    EXCLUDE: text, labels, arrows, grids, color swatches, extra views, close-ups, duplicate figures, transparent/checkerboard background, weapons, flying ribbons or wind effects.'
