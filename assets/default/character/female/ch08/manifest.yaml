    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】双儿，《鹿鼎记》中庄家送给韦小宝的侍女，此后一路随他同行、贴身护持的时期。

    【年龄与体态】外观约二十岁的成年年轻女子，身材娇小玲珑但为成人比例，体态轻灵。

    【经典造型】要一眼认出是双儿——白底蓝花短袄、青灰裙、圆髻簪粉色小绒花、腰佩短剑，温柔体贴、笑起来很甜，一心护着人；秀美可人的成年女子。

    【面容】脸以剧照为底子——保留剧照里这个角色的脸型、眉眼、鼻唇的比例关系和神气，画成成年人；温柔秀美的鹅蛋脸，面颊柔和；眉毛细长平缓；眼睛温柔明亮，带着体贴、羞涩和一心一意的忠诚；鼻子小巧；嘴唇薄而柔和，笑起来很甜；肤色白净透着健康的红润，有真实的皮肤纹理。温柔体贴、善良忠心，又有一身好武功。

    【发式】黑发在头顶挽成一个圆髻，髻边簪两朵粉色小绒花，额前一层薄薄的碎刘海；不梳双丫髻。

    【服饰】清初江南汉族女子装束——白底淡蓝花纹的交领短袄（右衽，袖口略宽）、青灰长裙、窄腰带、软底布鞋，朴素整洁。

    【道具与姿态】腰侧佩一柄连鞘短剑；双手轻轻交握在身前；安静站立，随时准备护着人。

    【不要】画面里不要任何文字、题款、印章、签名、水印、台标、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、日式服饰或日本刀、发光特效、法阵或能量光。不要照片或照片修图的质感，不要照搬剧照的构图、光影、背景和姿势，不要剧照里的字幕、台标和水印。不要孩子气的脸、头大身小；不要双丫髻；不要厚粉底的戏装脸。清初汉族女子仍穿明式袄裙：汉式交领一律右衽（穿着者左襟压右襟），不要左衽、不要水平镜像。

