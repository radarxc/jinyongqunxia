    【本张另外要求】上一次改得太少，这次必须明显改变脸部结构，否则不合格：①脸型——从偏长的脸改成较短、较圆的鹅蛋脸，两颊比原图饱满，下巴圆润；②眼睛——从细长的眼睛改成基线那样明亮的大杏眼，眼睛更大更有神，眼尾微微上扬成笑眼，双眼皮清楚；③嘴——基线那样饱满红润的嘴唇，嘴角上扬；④眉毛——基线那样细长清楚、眉尾微扬。改完要让人一眼认出：这就是第 1、2 张里那位五毒教主，只是三十年后年长了。

