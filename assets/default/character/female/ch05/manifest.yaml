    【人物】《笑傲江湖》定静师太，恒山长辈、门人撤离阶段，约六十五岁成年女尼，沉静慈和。本图为明代玩法年代，见design/02书界的选定阶段；全部使用成年骨相与成人身体比例。

    【面容】瘦长脸，细灰眉，稍垂长眼，长直鼻，眼周与嘴角深细纹；保留皮肤细纹、自然不对称和真实年龄，不照搬基线人物的脸。

    【衣饰】旧灰褐尼衣、米灰右衽内领，素布僧帽与布鞋，双手在腰前自然轻合。汉式交领为右衽，穿着者左襟压右襟；所有头发、头饰、双手与鞋底完整入画。

    【阶段边界】和定逸区分瘦长骨相，不画佛像光环或盘坐。

    【考据边界】身份与出场沿design/18 §13.6；以上具体五官、配色、衣料和静态姿势为原创扩展，精确原著外貌、服制和年龄仍待三联/广州修订版逐字核对。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。禁止未成年外观、裸露、舞台戏服、现代用品；背景不画具体建筑。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
