    【人物】任盈盈，《笑傲江湖》女主角，日月神教「圣姑」、任我行之女；从恒山援救令狐冲到黑木崖救父的时期，尚未接任教主、尚未成婚。

    【年龄与体态】外观约二十岁的成年年轻女子，身材修长纤秀，肩颈挺拔，体态端庄而有习武者的轻捷。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

