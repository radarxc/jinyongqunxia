  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】任盈盈，《笑傲江湖》女主角，日月神教「圣姑」、任我行之女；从恒山援救令狐冲到黑木崖救父的时期，尚未接任教主、尚未成婚。

    【年龄与体态】外观约二十岁的成年年轻女子，身材修长纤秀，肩颈挺拔，体态端庄而有习武者的轻捷。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】借鉴经典武侠影视里这个角色深入人心的造型，只取发型、装束、配色、标志道具、气质和脸型类型，用原创面孔画出来，不像任何真实演员：清冷高贵、带几分神秘的「圣姑」——一身深色衣裙（玄青、黛紫），乌发长垂、只挽一个简洁的发髻、插一支素银簪；气度令江湖群豪敬畏，眉眼间却藏着一丝腼腆；腰佩短剑。

    【面容】清秀的鹅蛋脸，下颌线柔和但不尖；眉毛细长平缓、眉尾略扬，带一点清冷；眼形细长、眼神清冷聪慧，带着矜持和一丝藏不住的腼腆；鼻梁秀直、鼻头小巧；嘴唇不大，唇色自然淡红，嘴角平静；肌肤白皙细腻、颧部淡淡的血色。清丽脱俗而高贵的美人，不是甜美的邻家少女。

    【发式】乌黑长发在脑后挽成一个简洁的发髻，插一支素银簪，其余长发顺垂在背后；不戴华丽珠翠。

    【服饰】明代女子装束——深青色交领短袄（右衽）、月白内衣领、浅青灰长裙，外罩一件深紫色长比甲，比甲边缘有低调的暗纹；腰系窄丝绦，平底绣鞋。衣料是细密的丝绸，颜色沉稳。

    【道具】腰间左侧佩一柄连鞘短剑（深紫色剑鞘、银色剑格），左手轻按剑柄，右手自然垂在身侧。

    【姿态与神情】沉静、矜持、目光有主见；高贵中带一点害羞。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要像任何真实演员或明星；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要甜美娃娃脸、少女幼态；不要教主冠冕、婚礼红装；不要魔女角饰；不要露肩露腰。

