  subject: 岳灵珊（ch05_xiaoao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【参考图】第 1–2 张参考图是该角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征，让人一眼认出是这个角色；但必须重新绘制成项目画风，不要照片质感，不要照搬剧照的构图、光影、背景和姿势，也不要做成照片修图。最后两张是本项目画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨背景以它们为准。

    【剧照借鉴要点】取剧照里的发型（额前薄刘海，头顶两侧各盘一个小发髻、缀几颗小珠饰，鬓边垂着几缕细辫）、浅绿配白的衣色、娇憨明朗的五官与神情。姿势和构图按下文的全身立绘来画，不照搬剧照。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实人物。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。皮肤有真实质感——细小毛孔、细纹、晒痕和自然的左右不对称，不磨皮、不油亮；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏 CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】岳灵珊，《笑傲江湖》中华山派掌门岳不群与宁中则的独生女、令狐冲的小师妹，尚未成婚的华山时期。

    【年龄与体态】约二十岁的成年年轻女子，身材轻巧匀称、成人比例（约七头身），肩臂有练剑的力量。

    【经典造型】九十年代经典港剧里的华山小师妹：两侧小发髻缀珠饰、鬓边细辫，一身浅绿衣裙，手握长剑；娇憨活泼、爱笑任性，美丽可爱的成年女子。

    【面容】按剧照：略圆的鹅蛋脸、下巴圆润；眉毛弯而清秀；眼睛明亮灵活（自然大小），带着爱笑的神采和一点被宠出来的任性；鼻子小巧挺直；嘴唇饱满红润、嘴角上扬；皮肤白里透红。娇憨、明朗。

    【发式】额前一层薄刘海；乌黑头发在头顶两侧各盘一个小发髻，缀着几颗小珍珠和浅色珠饰，鬓边垂着几缕细细的小辫，其余长发垂在背后。

    【服饰】华山派女弟子装束：浅绿色交领短袄（右衽，左襟压右襟），布面有淡淡的织花，白色内领；浅青色长裙；深青窄腰带；平底布鞋；袖口利落。

    【道具】左手握一柄连鞘长剑（细长素鞘），斜持在身侧；右手自然放在腰前。

    【姿态与神情】轻快站立，笑容明朗。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要大眼娃娃脸、少女幼态；不要满头珠翠；不要和任盈盈、仪琳同一张脸；不要清代旗装。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
