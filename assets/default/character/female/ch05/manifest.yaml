    【服饰】明代女子装束——深青色交领短袄（右衽）、月白内衣领、浅青灰长裙，外罩一件深紫色长比甲，比甲边缘有低调的暗纹；腰系窄丝绦，平底绣鞋。衣料是细密的丝绸，颜色沉稳。

    【道具】腰间左侧佩一柄连鞘短剑（深紫色剑鞘、银色剑格），左手轻按剑柄，右手自然垂在身侧。

