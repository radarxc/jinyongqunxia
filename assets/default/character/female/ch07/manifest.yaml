    【服饰】粉红色交领窄袖长衫（右衽，左襟压右襟），白色内领，衣缘有细小的五毒纹样暗绣；白色长裙（内穿长裤）；细布腰带；黑色软靴。

    【道具】她的左手腕以下是一只乌黑的铁钩，用皮革护腕牢牢连接在前臂上——这是她的标志；右手握着一条收拢的细长软鞭；左前臂略离开身体，让铁钩清楚可见。

    【姿态与神情】从容站立，含笑看人。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要现代节庆的民族盛装；不要毒蛇毒虫缠身；不要血腥；不要把铁钩画到右手，右手是正常五指；不要清代旗装。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
