  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画；皮肤有真实质感——细小毛孔、细纹、晒痕、轻微色斑和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】天山童姥，《天龙八部》灵鹫宫主人，逍遥派大师姐，实际年龄九十多岁；练八荒六合唯我独尊功，此时正处在返老还童期间（虚竹护送她去西夏冰窖之前）。性情暴烈、威严、记仇。

    【年龄与体态】本作规定一律不画儿童身材：画成一位身量非常矮小（约到常人胸口高）、但身体比例和五官都是成年女子的女人；纤瘦、背脊笔挺。

    【面容】返老还童之相，容貌看去像二十多岁的女子，但神情是九十多岁的宫主：瘦削的瓜子脸、颧骨略高，细长的凤眼、眼神锐利老辣，眉毛斜飞，薄唇紧抿、嘴角带一丝冷笑；皮肤光洁但眼神沧桑。

    【发式】乌发中夹着几缕银丝，挽成紧凑的发髻，不戴华丽头冠。

    【服饰】深绛色高领内衫，灰紫色右衽短外袍，长及脚踝的深色长裙，衣服宽松厚实，软布鞋。

    【道具】空手；不画生死符、冰片或发光法球。

    【姿态与神情】背脊笔挺、下巴微抬，一手抬起作指点状（不施法），另一手垂在身侧；神情威严、居高临下、带讥诮。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要儿童身材、婴儿肥、大头小身、卖萌或撒娇表情；不要女童发式；不要老态龙钟的驼背老妪；不要发光特效。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。

