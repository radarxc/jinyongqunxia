    【人物】康敏，《天龙八部》丐帮副帮主马大元的遗孀，人称马夫人；杏子林旧案阶段，一身缟素为亡夫守孝。原著里出了名的美人，外表冰清玉洁、楚楚可怜，骨子里却艳媚入骨、心如蛇蝎。

    【年龄与体态】约三十岁的成熟少妇，身段丰盈婀娜、腰肢纤细，约 7 头身；衣着完整端庄、不透明、不暴露、不性感化——妖娆只来自眼神、嘴角和身段，不靠裸露。

    【面容（作者：参考港版，更妖娆一些）】脸要明显像剧照里的马夫人：饱满柔和的鹅蛋脸、下巴圆润；眉毛细长、眉尾微微上挑；一双细长的媚眼、眼尾上扬、双眼皮、眼波流转；鼻梁秀挺、鼻头小巧；嘴唇饱满、唇峰清楚，点了淡淡的朱红唇色；肤色白腻，眼角有一点成熟女人的细纹。成熟艳丽，不是少女，也不是网红尖下巴。

    【发式】乌黑长发盘成精致的少妇发髻：头顶高髻，两鬓各挽一个小小的垂鬟；髻上只插一支素银簪、簪一朵小白绢花（守孝），耳垂一对小银坠。没有金钗珠翠。

    【服饰】守孝素服：白色交领右衽内衫，外罩米白素绢褙子（长及膝下），灰白色及地长裙，腰束一条素白丝带；白色素面鞋。衣料轻软、完整不透明，素而合身，衬出婀娜身段。

    【手】双手在腰前轻轻交握，指间夹着一方白丝帕。

    【姿态与神情】站姿婀娜：腰肢微扭、重心落在一条腿上，身体基本朝向正面、头部端正不歪；眼睛微微眯起、直直地望着前方，一边嘴角上挑，冷艳的笑意浮在唇边却不达眼底——媚而带毒，美艳动人又让人背脊发凉。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感，不要像剧照照片、照片修图或拼贴，不要照搬剧照的背景、光影、构图和姿势；不要三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要少女脸、娃娃脸；不要袒胸露肩、薄纱透肉；不要剧照里的红衣、金钗与字幕；不要哭丧或愁苦的表情。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
