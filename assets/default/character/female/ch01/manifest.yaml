    【面容】修长柔和的鹅蛋脸、额头光洁，眉毛细长如远山、颜色偏淡，眼睛清澈、眼尾略长微垂，带书卷气和一缕淡淡的愁思，鼻梁细直小巧，唇薄色淡，下颌柔和；肤色白皙、气色清淡、几乎不施脂粉。美在清雅脱俗与书卷气，不是浓艳；与阿朱的灵动、木婉清的冷峻、主角的英气都要明显不同。清雅绝俗、美若天仙。

    【发式】乌黑长发挽成收敛的高髻，插一支素白玉簪，少量长发顺垂在背后。

