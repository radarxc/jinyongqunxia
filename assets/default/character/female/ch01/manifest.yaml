    【面容】揭下面纱后容貌清丽而冷：鹅蛋脸略长、下颌线利落，眉毛浓而直、眉尾上挑，一双黑眸冷冷的、带戒备，鼻梁挺直，唇形薄而紧抿，肤色比常人略白（长年蒙面）；神情冷峻疏离（原创扩展）。冷艳美丽。

    【发式】黑发在头顶高高束成发髻、一根乌木簪固定，其余长发垂在背后；揭下的黑纱折起系在颈侧，不遮五官。

    【服饰】哑光黑色交领右衽窄袖长衫，深灰长裙，裙内有便于行动的长裤，黑布腰带，深色软靴。

