    王语嫣，《天龙八部》，碾坊避雨·赠钗求衣。阶段：青年女子，确龄待考，沿同人基础图保持年轻而不低幼。中毒乏力、与段誉脱离追兵后到碾坊避雨；选在坐凳请求借衣、尚未上楼换衣的时刻。 对应《天龙八部》第17回。

    人物与完整衣装动作：清丽修长的鹅蛋脸、舒展细眉、专注杏眼，自然鼻唇与清楚下颌；修长匀称，目光有思考和自主判断，不套用玩家女主的成熟面相，也不以武装或肌肉制造英雄气。 原束发受雨略松，刚拔下金钗，几缕发贴鬓但整体整洁；头上不再复制同一支钗。 完整闭合的淡藕长衣、玉白内衫与长裙、素鞋；此刻尚未上楼换衣，不能提前换农妇服装。下摆可有剧情所需的有限雨湿色差，布料仍有连贯剪裁和厚度、不透明、不贴体凸显胸腰；无破洞、脱衣或纸屑式白斑。发式因拔下金钗略松，头上不再出现同一支双珠钗。 完整坐在朴素木凳上，双足自然落地，身体略显虚弱却保持清醒；右手低举一支金钗向画外表示交换，左手无力地轻放膝上，目光平等诚恳。 人物面部、皮肤、头发、衣服与鞋采用完整连贯的写实国风插画塑造；实体体积清楚、柔和光影连续、轮廓干净，墨染和纸面纹理只留在背景。

    器物与阶段限制：一支带两颗珠的金钗，尺寸正常、清楚可辨；是向农女借衣的酬谢，非暗器。

    仅背景使用水墨：浅淡木凳、碾坊门框、窗外水轮一小段和雨线，人物面部保持柔光。 不画毒雾绕身或中毒发紫特效，虚弱主要由肩臂与坐姿表达。 单人完整全身，背景浅淡且局部化；不出现段誉、慕容复、丫鬟、群豪或人形玉像。无题字、兵器陈列与重摄影背景。

    本场具体构图：完整着衣坐在低凳上，双足落地；中毒稍显乏力但神志清楚，右手低举一支双珠金钗向画外请求借衣，左手低放膝上。金钗不是暗器，不在头上重复同一支钗。不要脱衣、谷堆只露头、站立战斗或有人抱扶。

    单人单视图，完整头顶、躯干、双手、两腿双足及指定器物都入画，站坐依本场而定，自然留边、真实承重。竖幅2:3，目标2048×3072 PNG，接受工具原生输出，不透明。肤质细腻自然、衣料完整连贯，少量宽缓承重褶；画面墨韵与纸感只用于背景，不能侵入人物。


