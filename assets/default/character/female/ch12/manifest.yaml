    【服饰】一身鹅黄色长衫，窄袖，长及小腿，前襟和袖口有墨绿与黑色的窄边和细小刺绣，立领处一枚深色盘扣；腰系一条深褐皮带；里面是宽松长裤，脚穿深褐色软皮长靴。回疆样式，衣料完整不透，可以骑马。

    【道具与姿态】腰带右侧斜插一柄带鞘短剑（父亲所赐，匕首长短，古铜色剑鞘），左侧佩一柄完全入鞘的长剑；两柄剑都不出鞘。挺拔站立，右手按在腰带上，左手轻扶长剑剑鞘，目光直视前方，英姿飒爽。

