    【面容】照剧照的脸型和五官，带一点西域风情：鹅蛋偏长的脸，颧骨略高；眉毛浓黑修长、眉尾微扬；眼睛明亮有神、眼神冷静自信；鼻梁挺直秀气；嘴唇饱满，嘴角坚定；肤色白里透红，两颊天然红晕，看得见真实的肤理。美而有英气，有统兵的沉着；是成年女子，不是少女。

