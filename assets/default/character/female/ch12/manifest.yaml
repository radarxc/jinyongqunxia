  subject: 关明梅（ch12_shujian）
  prompt: '生成一张 2:3 竖幅全身人物立绘。

    人物：关明梅，金庸《书剑恩仇录》中「天山双鹰」之一，外号「雪雕」，霍青桐的师父，性子刚强好胜。

    年龄与体态：五十多岁的女侠，个子较矮但利落挺拔，约六个半头身。

    脸与五官：较短的椭圆脸，高颧骨；细而有力的嘴唇抿着；眼角和额头有明显的皱纹；眼神锐利、不肯服输；年轻时的美貌依稀可见；皮肤有天山风霜。

    发式：一头银白的头发，挽成低髻，用素木簪和深色布带束紧。

    服饰：灰紫色右衽窄袖长袄（穿着者左襟压右襟），深灰长裙配厚长裤，平底软靴；天山行旅的厚实衣装。

    兵器与道具：一柄普通中式长剑完全入鞘，一手握在鞘口，另一手轻按腰带。

    姿态与神情：双足错开站稳，下颌微抬，眉眼间透着傲气。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；浓妆、性感化或暴露的衣着；白发少女、光滑年轻的脸；道姑拂尘；凶相丑化。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

