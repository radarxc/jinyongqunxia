    【主角标志】发髻上系一根褪色的朱红细绳，露出短短的绳头——每个时代都保留这根红绳。

    【服饰】潮青色汉族右衽窄袖衫袄，浅灰素裙，墨灰窄布带、平底布鞋；黑发盘成简洁低髻，素木簪固定，髻根系朱红细绳。

    【道具】左腰用两根短系带挂一柄普通的中国直身双刃剑，完整入朴素木鞘，小型中式剑格，无纹饰无宝石；剑柄、鞘口、鞘尾都清楚，剑不出鞘；没有红花会标识。

