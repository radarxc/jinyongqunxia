    【发式】乌黑的头发在脑后利落地挽成发髻，插一支缀小珍珠的金钗；鬓边几缕碎发。清代汉族女子发式，不是旗头。

    【服饰】清代汉族女子的出行装束：蓝色窄袖短袄（圆领、大襟右衽、布纽扣），月白色领缘和袖口；深蓝色长裙，裙内穿长裤，便于行走打斗；腰束月白腰带；脚穿平底软靴。衣料厚实不透，以蓝白两色的干净层次为主，不要满身绣花和长飘带。

    【道具】双手各握一柄出鞘的柳叶刀（刀身窄而微弯、刀尖上挑，单刃），刀尖斜指地面、刀身完整入画；两把刀都是普通钢刀。

    【姿态与神情】身体正面朝前，双刀垂在身体两侧，站姿英挺，笑盈盈地看着前方。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；衣襟必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要旗头、花盆底鞋和旗装；不要满身绣花、长飘带和过多首饰；不要娇弱闺秀的神情；不要大眼娃娃脸；不要和杨夫人、任飞燕同一张脸。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。基线图只取画风，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。'
