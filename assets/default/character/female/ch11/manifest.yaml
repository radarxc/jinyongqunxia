  prompt: '生成一张 2:3 竖幅全身人物立绘。

    人物：萧中慧，金庸《鸳鸯刀》的女主角，晋阳萧府的千金，胆大好义、爽朗任性，独自离家去夺宝刀的那一段。

    经典形象：要一眼认出是萧中慧——蓝衣白领、双手各持一柄柳叶刀、发间金钗，英气爽朗、胆大任性；明丽好看的成年女子。

    年龄与体态：约二十岁的成年女子，匀称结实、轻捷有劲，肩背打开，是练过武的身体，约七头身。

    脸与五官：脸型是略带方意的鹅蛋脸，颧骨微显，下颌线清楚；眉毛浓黑平直、眉尾上扬，带一股英气；眼睛明亮有神但不大得夸张，眼型偏长、内双，目光直率，略带倔强；鼻梁直，鼻头圆润；嘴唇略厚，嘴角上扬像要笑出声；肤色健康，两颊被风吹得微红，鼻翼旁有几点浅浅的晒斑。

    发式：乌黑的头发利落地盘成一个小髻，插一支缀小珍珠的金钗（还没送出去）；鬓边几缕碎发。汉族女子发式，不是旗头。

    服饰：蓝色窄袖短袄，月白色内领，交领右衽（穿着者左襟压右襟）；深蓝齐腰长裙，裙内穿长裤，脚穿平底软靴；衣料厚实不透，以蓝白两色的干净层次为主，不要满身绣花和长飘带。

    兵器与道具：两手各握一柄普通的中式单刀（微弧的柳叶刀，刀身长短相近，护手朴素），刀尖分别斜指身体两侧的外下方；腰侧挂两只足够长的空刀鞘，各用短带系在腰带上。刀上没有铭文。

    姿态与神情：双脚一前一后站稳，身体微侧而胸肩舒展，抬眼直视，神情是初闯江湖的自信和一点不服气，不是撒娇卖萌。

    画风：写实手绘古风人物插画，画风与上传的最后两张画风基线图一致：精细写实的数字手绘插画，笔触细腻柔和、边缘干净；不是油画，没有厚涂笔触和画布纹理；不是照片，不是三维渲染，不是动漫或游戏 CG。人物要像真实存在的人：皮肤看得见毛孔、细纹、晒痕和轻微色斑，五官与脸型有自然的左右不对称，不磨皮；衣料看得出织物的经纬、自然的褶皱和穿用后的轻微旧化，但衣服完整，没有破洞碎布。整体低饱和、沉稳的设色；柔和自然的漫射光从左上方照来，不用舞台光和强轮廓光。

    背景：暖浅灰色纸底，远处只有极淡的水墨远山和薄雾，大面积留白；人物轮廓清楚、与背景明显分开（便于后期抠图），墨色不压到人物身上，脚下只有很淡的接触阴影。

    构图：2:3 竖幅，单人全身，自然站姿，平视镜头，头部端正不歪；从头顶到鞋底完整入画，四周留出余白；双手完整，兵器和道具的两端都在画面内。

    不要：任何文字、字母、签名、印章、水印、边框；第二个人物、活的动物、分格、多视角、头像特写；幼态、童颜、娃娃脸、大头小身、儿童身材；网红脸、锥子脸、大眼滤镜、过度对称、塑料皮肤、蜡像感、过度精修、偶像化打光；任何真实演员或明星的长相；现代服饰和物品；日式服饰、日本刀；汉服交领左衽、整幅画面左右镜像；多余或缺失的手指、手与器物粘连；发光特效、血迹；浓妆、性感化或暴露的衣着；圆脸大眼甜笑的偶像脸；娇弱仙女气质；宫装、婚服；刀上刻字或一长一短的宝刀；三把以上的刀。

    质感：手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。

