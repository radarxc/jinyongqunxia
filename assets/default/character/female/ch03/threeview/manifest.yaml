  subject: 小龙女（ch03_shendiao）A 字姿势全身参考：与绝情谷 base 同脸同服饰，去飘带、头发收在身后
  prompt: '【任务】这是一张供 3D 建模与自动绑骨使用的 A 字姿势全身参考图。第 1 张参考图是作者已通过的小龙女立绘，第 2 张是同一张图的脸部特写。请画同一个人：同一张脸（脸型、五官、神情、年龄感、耳坠）、同一身服饰（白色交领广袖长衣、白色长裙、浅银灰腰带、衣缘与褶皱、白色布鞋），只改姿势、头发摆放和背景，并去掉飘带。

    【姿势】正面站立，身体和脸都正对镜头，头部端正、平视前方；双臂伸直、自然下垂并向身体两侧张开约 30°，腋下和腰侧与手臂之间露出背景；手掌朝向大腿方向，五指自然张开、彼此分开、清楚可数，手里不拿任何东西；双脚分开约与肩同宽，平站在同一条地面线上，脚尖朝前，两只鞋完整露出裙摆。

    【服饰处理】宽大的袖子保持原样但自然下垂，袖口不遮住手；去掉第 1 张里手中拿的白色长飘带和金铃，画面里不要任何向外飘的布条；裙摆自然垂落、不飘动、不贴地拖出太远。

    【头发】长发全部收到身后，从背后垂下，不搭在肩前，不盖住手臂和手；发髻与发饰和第 1 张一致。

    【画风】与第 1 张相同的写实手绘古风人物插画；手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。柔和均匀的正面偏左上方光，明暗清楚但没有强烈投影。

    【背景与画面】纯净的浅暖灰色平涂背景（#E6E1D8），没有水墨、山水、地面纹理、投影、暗角或边框；2:3 竖幅，人物完整全身居中，头顶和脚下都留出空白；平视正交视角，没有透视畸变。

    【不要】不要文字、标签、箭头、网格、色卡；不要第二个人、分身或多视图；不要武器、道具；不要幼态；不要水平镜像，衣襟保持右衽（穿着者的左襟压在右襟上）；不要透明或暴露的衣服。'
