  file: por_npc_xiaolongnv__ch03_youth_scene_valley_jade_bee_message.png
  category: character/female
  style: default
  subject: 小龙女（ch03_shendiao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    输出1024×1536，完全成年，禁止童颜或少年身材。

    【身份】第一张是本轮该主角新基础立绘，面部骨相必须保持一致，只依下文变年龄、衣物、姿态、道具与背景；第二张之后的剧照仅借造型，游戏图仅借古典武侠绘画气质，不恢复演员五官。

