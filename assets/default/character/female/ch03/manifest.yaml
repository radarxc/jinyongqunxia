  subject: 完颜萍 npc_wanyanping ch03_shendiao · 成年青年金国遗民，复仇刺耶律家未遂、开始面对旧仇的早期阶段
  prompt: '【任务】对第1张完颜萍完整立绘进行一次真正的整脸重画，输出1024×1536、2:3竖幅完整单人立绘。只重新画整个脸部身份、五官结构与神态，其他造型照第1张。前3轮微调未去掉AI脸，这次不要沿用第1张的模板五官，不是稍微改嘴角。

    【身份参考】第2张是1995年TVB《神雕侠侣》何洁珊饰完颜萍的上半张剧照，第3张是同一张剧照的脸部裁图。这两张定义新脸的身份：Use the woman in reference images 2 and 3 as the facial identity. Redraw her entire face in the existing hand-painted illustration style. Preserve the reference identity, not the original portrait''s influencer face. 眉眼关系、眼型、眼距、鼻型、唇形、颊部和下颌都应明显采用剧照这个人的结构；允许五官位置与骨相相较原立绘有明显改变。不照搬模糊像素、电视色偏、浓妆或照片光线，不复制剧照刘海，头发仍按第1张。

    【神态】成年人，不露齿的自然浅笑：唇轻合，嘴角有细小、左右不完全对称的弧度，眼神有温柔笑意，颊部随笑意自然牵动。人脸有活人感和细微不完美，没有网红模板和塑料皮肤，不要尖V下巴、过大杏眼、过窄鼻头、强行对称、粉白磨皮和丰唇。脸的气质清秀朴素，有她这个人的辨识度。

    【保持】第1张的完整全身构图、头部方向和大小、发式、头饰、灰白米色右衽服装、棕色腰带与系带、刀及刀鞘、持刀手势、身体姿势、左右方向、脚与鞋、背景山水纸底、留白与整体写实手绘画风。脸部换完要和原有颈部色温、光照、画笔自然接合。严格仅单人。

    【画风】细腻写实手绘古风人物插画；自然细纹、轻微不对称与有层次的肤色，柔和真实皮肤，保留适度笔触。不是照片、不是3D、不是偶像海报精修。

    【不要】不要只是改笑容而保留原AI五官、不要露齿、夸张笑、尖V脸、磨皮塑料皮肤、镜像、改衣饰发型姿势或背景，不要增加第二人；不要剧照上的文字、TVB标识、字幕或水印，成图无任何字。

    【A版取舍】尽量贴剧照的真实五官身份，明确摆脱现版的脸型与眉眼模板；浅笑清楚但轻，不露齿，左右嘴角高度略不相等。优先让熟悉这版的人看脸认出完颜萍。


    【后续发际线校正】

    【任务】输出1024×1536、2:3完整单人立绘。这是一次局部发际线校正。第1张是完颜萍A候选：整张脸已经按何洁珊剧照重画，保留这张的新五官和不露齿浅笑；这张唯一不合格的是把剧照的细刘海带过来了。第2张是原有完颜萍全身立绘，第3张是原图头部放大：只用2、3定义必须恢复的发式，不用它们的旧网红五官。

    【只改发际与刘海】删除第1张额头上的所有新增短刘海和碎刘海，恢复第2、3张的中分、露额额头和原有清楚发际线，眉毛以上没有任何垂落短发。刘海不能遮额头、不能遮眉。发顶盘髻、灰褐发饰、两侧长发、脸侧原有两缕长碎发，严格按第2、3张原发式。额头皮肤顺着第1张新脸的自然光照重画接合，不贴白块。

    【严格保留】第1张的新脸身份与骨相：眼型、眉形、眼距、鼻型、颊部、唇形、自然不对称且不露齿的浅笑都完全保持，不改回第2张旧AI脸。发式修正以外的头部方向、脸大小、耳朵、脖颈、衣服、腰带、刀与刀鞘、持刀手、姿势、全身构图、脚鞋、纸底山水与笔触全部保持第1张，不作重新设计。保留手绘自然皮肤，不磨皮。

    【不要】不要刘海、额头短发、遮额、厚齐刘海、空气刘海；不要改新脸、不要露齿、不要镜像、改衣饰姿势或背景、第二人、任何文字水印。


    【饰物同原版】原版耳部没有新增的垂坠耳环，不能增添耳坠；发式和发饰均以原版为准。'
  negative: 不要露齿、张嘴大笑、AI模板脸、照片贴脸；不要新增刘海、耳坠、文字水印；发式服饰构图姿势照旧。
