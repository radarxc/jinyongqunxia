  prompt: 'Use case: compositing / face identity redraw.

    任务：在第1张现行耶律燕完整立绘上整张脸重画，输出一张1024×1536的完整2:3竖幅人物插画。第1张只定义身体、发式、服装、姿势、构图与画风；它当前的五官就是本次必须替换的失败模板，请不要保留该模板脸，也不要仅调整表情。

    输入角色：第2张是1995 TVB《神鵰俠侶》蔡雲霞饰演耶律燕的同一人物剧照（上下两个角度）；第3张是第2张上半幅的面部裁切，二者共同定义新的面部身份。直接以剧照中这个人的面部结构和五官关系为身份依据，在第1张头部原有位置、大小与正面朝向下重新手绘。不要复制剧照衣服、发式、耳饰、背景、偏色、字幕、logo或拼接。

    授权范围：脸型、下颌、颧颊、眉眼、鼻形、唇形与它们的位置关系均可明显改变；让作者一眼看到是重画后的自然面孔。摆脱第1张纤尖网红下巴、过度整齐对称的五官、亮晶晶美容眼和塑料皮肤。保留剧照中自然的椭圆脸与有厚度的下颌、真人眼睑鼻翼唇部关系、两侧细微不对称。以具体剧照身份为准，勿按抽象“古装美女”重新捏一张通用脸。禁止瘦脸、大眼、锐尖鼻、小V脸、磨皮与美容高光。

    神态：嘴唇自然闭合、绝不露齿的浅笑；英气爽朗、坦荡亲切。笑从放松的眉眼与一侧略先上扬的嘴角表现，自然不对称；不能大笑、嘟嘴、魅惑摆拍或冷峻木然。

    保持：脸以外的发髻、双辫、每一处发饰和发丝外轮廓，蓝灰右衽长袍、腰带、护腕、配剑与剑鞘、手指、手势、身体姿态、身高比例、人物站位、全身取景、山水花枝纸底背景、整体色调光线全部照第1张。脸只是在原头部空间内重画，头部朝向不改；不要镜像、裁切、重排、添加人物或道具。

    媒介：保持第1张的写实手绘古风插画笔触，面部色温与身体一致；用自然的皮肤色差和细微手绘笔触代替磨皮，柔和有体积但无蜡像油亮感。脸要融在原画中，不要照片贴脸，不要高清数码人像或3D渲染。只输出一张完整立绘，无文字、水印、标识、对照拼图。

    A版取舍：优先紧贴第2、3张剧照的五官身份。新脸的轮廓、眉眼间距、眼睑、鼻翼与唇部关系要明显向剧照靠近，清楚可认。用轻松坦率、看得见但幅度小的闭唇浅笑，眼神有英气；自然面部起伏与个性要保留，不为“变美”修成对称模板。'
