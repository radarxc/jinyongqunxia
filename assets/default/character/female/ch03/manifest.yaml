    【衣装】素白不透明右衽衣、白布腰带、完整长裙与平底素鞋，黑发用窄白带收束；双手戴素白贴手手套。

    【动作与神情】轻快移步、躯干自然侧转，两手各牵引一条白绸，至少一只脚明确承力；表情专注果断，正在迎战画外的金轮法王。

    【器物】两条白绸带，每条外端系一枚小圆金球铃（金铃索），与衣袖、腰带分开，连接清楚；不持剑。

