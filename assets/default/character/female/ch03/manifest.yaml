- id: por_npc_xiaolongnv__ch03_youth_scene_chongyang_two_sword_combat
  file: por_npc_xiaolongnv__ch03_youth_scene_chongyang_two_sword_combat.png
  category: character/female
  style: default
  subject: 小龙女（ch03_shendiao）
  prompt: '生成一张 2:3 竖幅全身人物剧情场景图：画面里只有这一个人物，完整全身（头顶、双手、双脚和手中器物都在画内），人物是画面主体；头部端正、五官清楚，镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风：人物是完整、坚实、比例真实的写实绘画；皮肤有真实质感——细小毛孔、细纹、晒痕、轻微色斑和自然的左右不对称，不磨皮、不油亮；头发有一根根的发丝和自然碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，带穿用过的轻微旧化，但完整不破烂；整体设色低饱和、沉稳；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。这是手绘写实绘画，不是照片，不是三维渲染，也不是动漫或游戏 CG。

    【场景背景】重阳宫殿内外相接处的淡淡门柱、石阶与道观轮廓；围攻者只用画外方向与阴影暗示。背景用低对比、低饱和的淡彩水墨来画，只保留能认出地点的少量轮廓，不喧宾夺主；人物轮廓清楚、与背景分开，水墨不侵入人物和衣服。

    【人物与场景】小龙女，《神雕侠侣》，重阳宫·双剑御敌。阶段：第26回重阳宫主体交锋，已经周伯通传授左右互搏；选择受重伤之前、以双剑对付围攻的青年阶段。第27回救援续叙不混入本切片。

    【身份参考】随提示词上传的第 1 张图是小龙女本人的新版基础立绘：保持同一张脸、同样的年龄感、体格与发际（清丽的长鹅蛋脸、下颌线柔和，眉毛细长平直、颜色偏淡，眼睛清澈而冷、眼神淡漠出尘，鼻梁细直，唇色极淡，肌肤苍白如雪、几乎没有血色（久居古墓），素面无妆）；本场的服饰、动作、道具与背景按下文，不要照搬基础立绘的姿势与背景。

    【衣装】素白不透明右衽长衣、白布腰带、完整齐腰裙与平底鞋，黑发简束；双手戴素白贴手手套。

    【动作与神情】两手各握一柄剑，左右剑势一前一后错开（左手全真剑法、右手玉女剑法），步法轻灵果断、至少一脚稳稳承重；头眼朝向主要威胁（重伤之前、主动抗敌）。

    【器物】两柄当场从全真弟子手中夺来的普通中式长剑（不是君子剑淑女剑）。

    【体态】成年女性的身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要第二个人物或人群、分身残影；不要可读文字或图谱口诀；不要换成另一张脸。

    【画风基线】随提示词上传的参考图里，最后两张是本项目的立绘画风基线：只参考它们的画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景处理，整体画风必须与它们一致——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理。参考图只取画风、光线、质感和背景处理，不取长相：不要照搬基线图里人物的长相、年龄、发型、服饰和姿势。

    【去 AI 味】手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。'
