    【面容】原著写她明眸皓齿、肤色白腻、美目流盼、桃腮带晕、神态娇媚。具体为：瓜子脸、颧骨略高，眉毛细长入鬓、眉尾上挑，一双妩媚的桃花眼，眼波流转却透着寒意；鼻梁挺秀；唇色红润、嘴角含着温柔却冰冷的笑；肌肤白腻、两颊微红（原创扩展）。美艳动人。

