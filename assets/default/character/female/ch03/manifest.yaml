    【场景背景】大胜关宴厅的淡淡柱影、地面与几盏烛台，留出轻身腾挪的空间。背景用低对比、低饱和的淡彩水墨来画，只保留能认出地点的少量轮廓，不喧宾夺主；人物轮廓清楚、与背景分开，水墨不侵入人物和衣服。

    【人物与场景】小龙女，《神雕侠侣》，大胜关·金铃迎敌。阶段：第13回英雄大宴，重逢杨过后以古墓轻功、白绸金球应对金轮法王；绝情谷取剑与周伯通授左右互搏之前。

