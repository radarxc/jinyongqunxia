  prompt: 'Use case: historical-scene. Asset type: one standalone game city-map building sprite for the tianshu Ming Jiangnan kit. Match the two Southern Song building style references already visible in conversation: finely resolved real clay tiles, stone plinths and wood grain, restrained warm daylight, believable hand-built construction, clean miniature-scale readable silhouette and same detail density. This is a NEW original building, not a copy or edit of those references. Ming Jiangnan palette: chalk-white lime plaster, dark charcoal-grey plain fired clay roof tiles, weathered dark-brown timber, pale grey stone. Authentic restrained south-China timber proportions and gently upturned eaves, no Qing imperial ornament. Camera: STRICT orthographic 2:1 dimetric, yaw 45 degrees, elevation 30 degrees; all ground-plane straight lines slope exactly +0.5 or -0.5; verticals vertical, opposite sides parallel, no perspective convergence. For footprint W by H in metres, the ground diamond is defined by left=(0,16*H), back=(32*H,0), right=(32*(W+H),16*W), front=(32*W,16*(W+H)); show the outer footprint corners clearly, ground only within the footprint, no raised island. Main entrance faces lower-left screen edge. Light from upper-left, tiny soft contact shadow toward lower-right, no wide baked shadow. TRUE transparent RGBA background, all outside regions alpha zero; no painted checkerboard, white background, text, signs, pseudo-writing, people, modern object, sky, neighboring buildings, border, grid, watermark. Full roof eaves, foundations and tiny contact shadow fully visible with generous clear margins. One isolated building or unified compound only. Subject: Ming Jiangnan county administrative yamen compound, one main austere hall at the rear, subordinate side offices, formal low entry gate and enclosing white lime walls. Five-bay main hall in dark timber with grey tiled roof, one drum by doorway as a functional clue. Formal balanced paved courtyard, no imperial yellow or