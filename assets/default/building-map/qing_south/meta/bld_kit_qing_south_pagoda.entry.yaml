prompt: 'Use image_gen to generate exactly ONE final production asset, not a discussion. The first supplied image is a mandatory geometry and camera guide: preserve its full registered footprint, arrangement, south entrance on the lower-left-facing facade, ridge directions, and relative masses. The next two images are historical visual evidence only; borrow period form, proportions, material and construction details without copying their scene composition. Render an isolated realistic early-to-mid Qing Jiangnan building, circa 1660-1780, as high-detail historical 2.5D game map art. Exact orthographic 2:1 dimetric projection, yaw 45 degrees, pitch about 30 degrees, screen ground axes +0.5 and -0.5, verticals upright, absolutely no perspective convergence. True transparent RGBA alpha-0 backdrop, one complete uncropped object centered with generous margin on all four sides, clear footprint baseline, no scenery or ground tile. Screen upper-left soft light and only a short soft lower-right contact
  shadow. Muted lime white, blue-grey brick, charcoal-grey clay tile and dark weathered timber; no bright fantasy palette. Show roof lift and curvature, ridge treatment, tile method, bracket or beam bearing, column grid, foundation, lattice type, decoration restraint and masonry clearly. No people, animals, trees, furniture, text, signs, flags, logos, watermark, checkerboard, white matte, modern objects, fantasy, northern palace silhouette, yellow glazed tile or cropped edge. SUBJECT: a slender 7 by 7 cell Jiangnan multi-storey pagoda, period-inspired and not a literal reconstruction. Preserve guide height and square base. Seven visually legible diminishing storeys: blue-grey brick central shaft on dressed-stone base, shallow timber eaves at each level with dense dark-grey tiles, moderate eave curve, small plain ridge corners and tiny bells implied without clutter. Each level has simple arched or rectangular openings and restrained timber rail detail. Bracket support is a compact single-step
  corbel layer per eave, not ornate palace dougong. Strong taper, no golden finial glow; complete top finial and base within margin.'
