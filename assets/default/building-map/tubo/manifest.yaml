und footprint exactly 15 by 12 metres, front length:right depth=1.25. Visible thin stone contact corners LEFT(168,520), FRONT(834.6666666666666,853.3333333333333), RIGHT(1368,586.6666666666666), BACK(701.3333333333333,253.33333333333337). Avoid squared plan. Ground corners unobscured. Entrance faces front-left; strict equal +0.5/-0.5 slopes on both axes.'
