  prompt: 'Use case: historical-scene. Generate ONE new isolated late Yuan dynasty Jiangnan Chinese town building game sprite, circa 1350 Hangzhou/Jiqing/Pingjiang.
    Input image is a MATERIAL, PALETTE and CAMERA style reference only, not a historical reconstruction target. Match its realistic muted grey
    ceramic roof tiles, weathered warm dark timber, pale lightly weathered lime plaster, fine restrained detail density. Orthographic camera yaw
    45 degrees elevation 30 degrees, dimetric ground edges slope +0.5 and -0.5 (2:1 grid), zero perspective convergence. Front south entrance
    faces lower left. Complete building and footprint on a TRUE transparent RGBA background, not white or checkerboard. Thin ground interface,
    no thick floating block. Make the left, front and right ground footprint corners clear and the entire building fit with 12% transparent margin.
    Lighting upper left, minimal short contact shadow lower right. Roofs plain with restrained eave curves and no extravagant upturned ornament.
    No people, words, lettering, signs, flags, logos, background scenery, mountains, modern materials, bright golden roofs, elaborate Qing polychromy,
    tourist Huizhou horse-head firewalls, cartoon outlines. Subject: LARGE residence, a wider two-storey merchant family home, timber upper floor
    with simple lattice windows, plain overhanging gable grey tiled roof, lower lime plaster infill, modest front porch. Compact rectangular building,
    not a courtyard compound. Parcel 10 meters east-west by 8 meters north-south, ground edge widths ratio 1.25. No balconies filled with plants,
    no shops.'
