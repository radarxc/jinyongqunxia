- id: bld_kit_yuan_south_market_stall
  file: bld_kit_yuan_south_market_stall.png
  category: building-map
  style: default
  subject: 元末江南约1350年市场铺棚（原创扩展，细部待考）
  prompt: 'Use case: historical-scene. Generate exactly ONE production city-map building sprite for tianshu default, late Yuan Jiangnan circa
    1350, anonymous regional interpretation not a named monument. Realistic ancient Chinese building with finely readable yet restrained materials,
    match the viewed southern Song baseline: gray curved clay roof tiles, pale weathered lime plaster, gray stone footings and dark unpainted
    timber. Camera orthographic yaw45 elevation30, ground axes exact slopes +0.5 and -0.5, verticals upright, NO perspective convergence. Front/south
    entrance faces screen LOWER LEFT. Thin flat rectangular ground-contact base with THREE CLEAR VISIBLE CORNERS and straight baseline edges,
    no thick plinth, full footprint must be visible to permit measuring. True transparent RGBA background. Warm neutral daylight from SCREEN UPPER
    LEFT, short soft contact shadow SCREEN LOWER RIGHT. All silhouette, eaves and shadow fully inside image with at least10% transparent margin.
    No surroundings, no landscape, no water rectangle, no people or animals, no labels, writing, logos or watermark; no decorative Ming-Qing tourism
    styling, no Tibetan white stupa, no modern objects. Camera and ground ratio matter more than canvas aspect. One single timber market shed,
    single gray tiled gable roof supported by four plain timber posts, open front counter under the eave, small reed baskets and cloth-covered
    wares confined inside the footprint; empty back plank panel, simple weathered construction, no large banners. Footprint5m east-west by4m north-south;
    screen-down-right ground edge is1.25 times screen-up-right edge.'
