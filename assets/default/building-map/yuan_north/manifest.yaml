    open timber bays beneath a hard-gabled grey pan-and-cover tile roof, low earth-and-brick rear wall, rough squared posts, exposed purlins and rafters, low plank
    stall partitions, hay rack, feed trough and tied bundles; no horses or people, no modern tack. Where architecture appears, render historically legible roof pitch
    and eave curve, individual handmade grey pan-and-cover clay tiles, plain ridge and restrained chiwen or ridge ornaments where appropriate; robust sparse bracket
