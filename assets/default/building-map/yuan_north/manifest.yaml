    doors and windows; buff rammed-earth or adobe or grey masonry as specified. Materials are matte, finely weathered and maintained, with high realistic detail density
    matching the approved Song baseline, never toy-like or low-poly. Natural upper-left light, darker right and rear faces, only a tiny lower-right contact shadow.


    Output one complete asset as a true RGBA transparent-background PNG. Alpha must be zero outside the silhouette and in intended openings. Keep every roof, base
    corner and tree crown fully in frame. No readable text, pseudo-text, plaques, labels, people, animals, flags, banners, modern objects, sky, landscape, water plane,
