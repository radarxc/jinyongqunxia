  prompt: 'Use case: precise-object-edit. Generate one entirely NEW anonymous original Yuan-era north-China game-building sprite. IMAGE 1 is only the locked geometry,
    camera, registered 14-by-11 logical footprint, entrance orientation, approximate silhouette scale and transparent-margin guide. IMAGES 2 and 3 are actual architectural
    photo references; use their visible construction details only, never copy their whole composition. The escort depot function is an ORIGINAL gameplay extension
    and the photos are regional vernacular construction analogues, not proof of a named Yuan escort depot.


    Subject: a defensible cargo-and-escort courtyard depot: buff rammed-earth/adobe perimeter walls over a sparse grey-brick damp skirt; heavy inward-set double plank
    gate in a dark timber frame; plain three-bay hard-gabled rear store hall and lower lean side sheds. Apply IMAGE 2''s compact courtyard scale, straight low hard-gable
    grey-tile roof and earth/brick wall relation. Apply IMAGE 3''s pan-and-cover grey tile rhythm, round rafter ends, exposed post-and-beam frame, thick plank doors,
    small square lattice windows and grey-brick wall foot. Low roof curvature and modest eave projection; plain ridge with restrained end caps, no elaborate beasts;
    sparse simple bracket blocks, no palace-grade dougong or colored painting. A few sealed crates, sacks and one handcart may sit inside; no heraldry or weapons
    display.


    Preserve IMAGE 1''s single coherent compound count, readable ground-contact corners and bottom edge. Orthographic dimetric yaw 45 degrees, elevation about 30
    degrees; screen ground axes about +0.5 and -0.5, verticals upright, opposite edges parallel, no perspective convergence. Soft upper-left light, darker right/rear
    faces, tiny lower-right contact shadow. Restrained realistic weathered materials and fine Song-baseline detail density. TRUE transparent RGBA with clean antialiasing
    and at least 8 percent empty margin on every side; openings alpha zero. No floor plane outside the walls, people, animals, text, pseudo-text, signs, flags, plaques,
    watermark, modern objects, landscape, sky, checkerboard, glow, fog, thick pedestal, clipping, fantasy, yellow glaze or dense Qing decoration.'
