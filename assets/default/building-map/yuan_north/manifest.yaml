  prompt: 'Use case: precise historical image edit for one isolated reusable game asset. Image 1 is the current yuan_north asset and is ONLY a locked composition
    and geometry guide. Preserve its subject count, logical footprint, complete silhouette placement, all visible ground-contact corners, bottom edge and transparent
    margins. Preserve strict orthographic dimetric yaw 45 degrees and about 30 degrees pitch: both ground axes are exact 2:1 slopes (+0.5 and -0.5), all parallel
    edges remain parallel, verticals vertical, with no perspective convergence. Keep the registered footprint proportions and do not add any apron or scenery beyond
    it. Images 2 and 3 are genuine historical or heritage references. Take only form, proportions, regional materials and construction detail from them; do not copy
    their camera, modern surroundings, damage pattern or whole composition.


    Replace the generic old rendering with an ORIGINAL Yuan-dynasty NORTH CHINA interpretation. Required subject details: a compact northern residential courtyard:
    three-bay north main hall and lower east-west wings around an open stone-packed court, axial timber gate and small screen wall, hard-gabled grey pan-and-cover
    tile roofs, plastered earth walls with brick skirts, exposed rafters, dark timber posts, plank-and-geometric-lattice doors. Where architecture appears, render
    historically legible roof pitch and eave curve, individual handmade grey pan-and-cover clay tiles, plain ridge and restrained chiwen or ridge ornaments where
    appropriate; robust sparse bracket arms rather than dense Qing brackets; visible post grid, beams, purlins and rafter ends; period-appropriate plank-and-geometric-lattice
    doors and windows; buff rammed-earth or adobe or grey masonry as specified. Materials are matte, finely weathered and maintained, with high realistic detail density
    matching the approved Song baseline, never toy-like or low-poly. Natural upper-left light, darker right and rear faces, only a tiny lower-right contact shadow.


    Output one complete asset as a true RGBA transparent-background PNG. Alpha must be zero outside the silhouette and in intended openings. Keep every roof, base
    corner and tree crown fully in frame. No readable text, pseudo-text, plaques, labels, people, animals, flags, banners, modern objects, sky, landscape, water plane,
    ground plane beyond the registered footprint, fog, glow, halo, checkerboard, thick diorama pedestal, fantasy elements, Qing-style dense polychrome, yellow imperial
    glazed tiles, front-elevation camera or cropped edges.'
