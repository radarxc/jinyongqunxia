coordinates: 原 PNG 左上原点、零基像素；bounds 的 x1/y1 不包含端点。仅测量，未裁缩或修绘入库 PNG。
height_method: Foreground RGB Euclidean distance > 30 from border median; connected components > 10000 pixels and height > 500 pixels; bounds right/bottom exclusive.
gap_method: 人工定位两腿之间的扫描线窗口，取与边缘背景 RGB 欧氏距离 ≤5 的连续背景区间；是局部可见留白样本，不是整条腿最小间距。
angle_method: 人工估计髋/膝/踝，acos(dot(hip-knee,ankle-knee)/(|hip-knee|*|ankle-knee|))；髋被短褐遮挡，非正式骨架标定。
pose_default: 第三栏按并足执行，不要求腿间留白；平臂解释为侧身、双臂在画面内向前后平举，非自动改变规格。
