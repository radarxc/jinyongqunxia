    Subject: a graceful sheaf of many hair-thin dark silver sewing needles with translucent vermilion and deep cinnabar
    silk-ink trails, issuing from ONE shared feathery root on the LEFT, spreading subtly into an elongated fan to
    the RIGHT. Needle shafts are slim straight pointed pins, not swords, not spearheads. About nine to twelve visible
    slim tips, arranged in fine separated streams with ample white space between them; exact number is visual texture,
    not a count of attacks. Long silk filaments curve and weave delicately around the main direction, suggesting
    impossibly quick precise needle work. All shafts point right; the array stays directional, never a radial explosion.

    Identical local root centered near (120,256), about 70 px tall. All effects bounded by x64..704,y140..372 inside
    each cell; at least 48 px pure white margin everywhere. Needle tips end around x660..690, distributed around
    central y256. Preserve position, length and silhouette across all four frames: faint gathering, clear spread,
    strongest elegant fan, sparse fading echoes. Frame 3 is strongest. Extremely fine Chinese wuxia ink atmosphere,
    airy red silk with feathered translucent edges, steel-gray tips.

    This red is the game''s yang color convention, not historical or novel color evidence. Strict pure #FFFFFF background.
    No hand, person, body, eye, wound, blood, droplets, liquid splatter, paper grain, shadows, flower, flame, electrical
    arcs, full-width laser, scenery, lettering or watermark. No solid white highlights inside the needles; use medium
    gray highlights for clean white-background extraction.'
