  prompt: 'Use case: stylized-concept. Asset type: original wuxia game VFX sprite sheet, Kuihua Baodian ultimate
    Cimu (a precise close-range needle thrust).

    Create ONE image, 1536 x 1024, exactly FOUR frames in an invisible regular 2 columns x 2 rows layout, cell 768
    x 512. Pure solid white #FFFFFF background; all cells isolated with at least 48 px whitespace to edges. No borders,
    labels, text or numbering.

    Subject: ONE extremely slender straight dark silver sewing needle pointing horizontally to the RIGHT, with a
    sharply tapered fine point. Its trailing left end gathers a few vermilion / wine-red silk filaments and two
    delicate looping translucent ink threads. The threads converge tightly onto the needle axis: elegant surgical
    precision, sparse and restrained. A needle has a thin cylindrical shaft, NOT a broad spear or sword blade. No
    eye, victim, wound or blood. The red material looks like silken lines, NOT liquid drops or splatter.

    Local root about (120,256), small feathery red filament origin, about 40px tall. Needle at front from x390 to
    x660 with point at x670,y256. Keep overall effect within x64..704,y180..332. Same positions in every frame:
    top left faint gathering threads, top right clear thrust, bottom left strongest needle with slightly more defined
    red threads, bottom right faint fading trails. Preserve the same length and central silhouette in all frames.

    Refined Chinese ink atmosphere, wispy low-opacity red edges, cool steel gray needle, spare confident detailing,
    no glow bloom, no solid white highlights. No character, no hand, no backdrop scene, no paper texture, no shadows,
    no flower, no fire, no lightning, no wide energy beam. Every visual element is fully contained within its own
    cell.'
