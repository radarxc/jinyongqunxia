  prompt: 'Use case: stylized-concept. Asset type: sprite sheet, Kuihua Baodian martial-arts VFX family, original
    game interpretation. Create ONE white-background image containing exactly FOUR animation frames in a regular
    2 columns by 2 rows grid, reading order. Target sheet 1536 x 1024, each cell 768 x 512. There are NO visible
    grid lines.

    Subject: an exquisitely fine cluster of vermilion and wine-red silken ink filaments swept horizontally from
    left to right, with a few slim cool dark-steel needle-like points woven into the forward tips. Elegant, eerie
    speed and precision; weightless translucent red ink wash, very sparse flecks, ample empty white space. This
    is not a fireball, not a laser, not a sword, not a literal flower. Red is the game''s yang palette, NOT a claim
    of the novel''s color.

    Each frame uses IDENTICAL local coordinates: a small feathery root centered near (120,256); flowing lines extend
    rightward, maximum endpoint near (672,256), with overall height under 200 pixels. Root width about 64 px. Pure
    white margin at least 48 px on every cell edge. Keep the main narrow silhouette and origin stable, with subtle
    changes of thread curvature and opacity. Top-left gathering wisps, top-right clean full form, bottom-left strongest
    full form, bottom-right fading thread echoes still in same position. All four shapes are fully inside their
    own cell; equal cell size and scale.

    Style: sophisticated Chinese wuxia ink atmosphere, delicate dry-brush silk strands, clear needle-thin dark tips
    and pale red translucent fringes. White backdrop exactly #FFFFFF, untextured. No hand, no person, no scenery,
    no paper texture, no ground shadow, no black background, no frame numbers, no letters, no watermarks, no symbols.
    No pure-white painted highlights inside the effect. Flat orthographic effect asset only.'
