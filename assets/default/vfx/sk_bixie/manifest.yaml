  prompt: >-
    Use case: stylized-concept. Asset type: Chinese wuxia game VFX source sprite sheet for sk_bixie (Bixie Swordplay), ONLY disembodied sword-energy traces, not a person, hand, sword, or scene.
    Exactly four sequential frames in a perfectly regular 2-column by 2-row sheet, canvas 1536x1024, each cell exactly 768x512. Pure solid white #FFFFFF background everywhere outside painted energy, no paper texture.
    Absolutely no grid lines, panel borders, labels, letters, calligraphy, symbols, shadows, landscape, character, anatomy, weapons, flowers, birds, moons, religious figures, or literal objects.
    Read frames top-left, top-right, bottom-left, bottom-right: gathering, release, full strength, dissipating. In EVERY cell keep one coherent effect rooted at local (96,256), direction right, with all painted marks entirely inside local x=72..680 and y=105..407, leaving broad clean-white gutters between all cells and at every outer edge.
    The root at x=96 is a narrow continuous 36-pixel-high ribbon that can join a sword tip; it must remain connected to the whole effect in every frame. Keep the same center axis, scale, and silhouette identity; vary only ink density, wisps, and intensity.
    Palette: muted deep blue-green teal and desaturated cold cyan with a little charcoal, reflecting yin nature. Traditional Chinese ink-wash atmosphere with translucent layered strokes, dry-brush gaps, fine dissolving edges, elegant empty space; no bright neon, no solid 3D object, no white painted highlight.
    Primary request: reusable family vocabulary for an unnaturally fast, uncanny seventy-two-route sword method: one long razor-thin forward teal ink slash with two faint offset crescent after-traces tightly braided around it, tapering sharply at the right, sparse charcoal flecks trailing behind.
    It should feel swift and ghostlike yet remain a single connected sword-energy gesture, not a laser beam or projectile. White background must be uniform pure white outside the effect.
