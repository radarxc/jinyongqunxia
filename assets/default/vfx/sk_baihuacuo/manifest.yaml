- id: vfx_mv_baihuacuo_cuoluo__effect_base01
  file: effect/mv_baihuacuo_cuoluo/source_01.png
  category: vfx
  style: default
  subject: 书剑书界 / 百花错落绝招淡金漩势四帧原料（原创扩展）
  prompt: 'Create ONE white-background 2-by-2 sprite sheet, four equal square cells, no grid lines, no text, no numbers. Baihua
    Cuoluo, an ultimate close-combat Chinese wuxia fist technique, original visual interpretation. Antique pale-gold and muted
    ochre ink wash. The unique motif is an asymmetric compact flower-like vortex of six interleaved, offset curved energy
    strokes, different depths of pale ink, open petal-like negative spaces, connected by broad brushwork to a left root; it
    suggests a nearby surrounding flurry, never a literal flower or remote projectile. Each cell has the SAME visible broad
    root at local (0.24W,0.50H), root cross-section about 0.15H; dominant motion travels right and curves upward and downward
    around the adjacent space. All marks inside x=0.17W..0.85W and y=0.16H..0.84H, wide white margins. Four successive frames
    in reading order: gathering interleaved strokes, opening, full offset whorl, light fading ribbons. Maintain comparable
    geometry and a connected root through all four. Dry-brush grain and luminous gold wash with transparent-looking edges,
    no solid filled disk, no dense starburst, no hard shadow. Pure white background, no paper, checkerboard, figures, fists,
    hands, weapons, dragons, beams, borders, text, labels or white highlights. Four equal cells in one square image, ideally
    2048 by 2048.'
