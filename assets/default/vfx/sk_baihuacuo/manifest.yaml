- id: vfx_sk_baihuacuo__family_base01
  file: effect/family/source_01.png
  category: vfx
  style: default
  subject: 书剑书界 / 百花错拳家族淡金水墨四帧原料（原创扩展）
  prompt: 'Create ONE white-background 2-by-2 sprite sheet, four equal square cells, no grid lines, no text, no numbers. Baihua
    Cuo Quan, a close-combat Chinese wuxia fist technique, original visual interpretation. Delicate pale antique-gold and
    muted ochre Chinese ink-wash energy, dry-brush grain, soft translucent edges, generous negative space, never solid metallic
    objects or literal flowers. A compact family motif of three interleaved and deliberately offset curved brush ribbons,
    suggesting deceptive fist paths and petal-like negative spaces. Every cell points right from the SAME broad, visible root
    at local (0.24W,0.50H); root cross-section about 0.12H. Keep all ink within x=0.17W..0.85W and y=0.18H..0.82H, with wide
    pure-white margins. Four successive keyframes in reading order: gathering, fully formed, full compact flourish, gently
    loosening after-trace. Do not greatly change the silhouette or root. The root is connected to the visible curves in every
    frame, no disconnected projectile. Background exactly white, no paper, shadow, checkerboard, figures, fists, hands, weapons,
    labels or white highlights. Gold pigment is distinguishable from white and never neon. Pure effect artwork only; four
    equal cells in one square image, ideally 2048 by 2048.'
  negative: 文字、编号、边框、分格线、水印、纸纹、人物、手、兵器、实物花朵、霓虹、远程弹丸。
