  subject: 书剑书界 / 反常合道绝招回折拳势四帧原料（原创扩展）
  prompt: 'Create ONE white-background 2-by-2 sprite sheet, four equal square cells, no grid lines, no text, no numbers. Fanchang
    Hedao, an ultimate close-combat Chinese wuxia fist technique, original visual interpretation. Delicate antique pale-gold
    and muted ochre ink wash. Unique motif: two deliberately contrary, folded S-shaped brush ribbons cross, briefly curl back,
    then converge into ONE compact blunt forward stroke toward the right, with restrained petal-like gaps connecting to the
    Baihua Cuo Quan family. It suggests reversing habitual motion and returning to one coherent fist path; never a sword beam,
    arrow, projectile or literal yin-yang symbol. Every cell uses the SAME visible broad root at local (0.24W,0.50H), root
    cross-section about 0.12H. Keep all strokes inside x=0.17W..0.85W and y=0.18H..0.82H. Four successive frames in reading
    order: gathering opposing strokes, crossing and turning, a coherent folded flourish, soft declining after-trace. Maintain
    comparable silhouette and connected root, large white margins. Dry-brush texture, layered translucent-looking wash, bright
    pigment distinguishable from white. Exactly white background, no paper, shadow, checkerboard, persons, hands, weapons,
    dragons, literal flowers, text, symbols, borders or white highlights. Four equal cells in one square image, ideally 2048
    by 2048. CRITICAL REVISION: include absolutely NO detached petal shapes, leaf shapes, seeds, dots, or botanical marks; all
    visible pigment must belong to the two continuous folded brush ribbons and their connected root.'
  negative: 文字、编号、边框、分格线、水印、纸纹、人物、手、兵器、实物花朵、霓虹、远程弹丸。
