  file: effect/family/source_sheet.png
  category: vfx
  style: default
  subject: 神雕书界 / 黯然销魂掌 / family 白底四帧原料（原创扩展：阴青水墨）
  prompt: 'Use case: stylized-concept. Asset type: Chinese wuxia game VFX source sprite sheet for sk_anran (Melancholy
    Palm), ONLY disembodied energy, not a person or hand. Exactly four sequential frames in a perfectly regular 2-column
    by 2-row sheet, canvas 1536x1024, each cell 768x512. Pure solid white #FFFFFF background everywhere outside painted
    energy, no paper texture. No grid lines, borders, labels, letters, symbols, shadows, landscape, character, anatomy,
    weapons, dragons, or literal animals. Read frames top-left, top-right, bottom-left, bottom-right: gathering, release,
    full strength, dissipating. Keep the same shape identity and the broad emission root at local (128,256) in EVERY
    cell, direction right. Energy extends to local x=650, with at least 48 pixels of clean white clearance at all edges;
    no overlap between cells. Broad open root approximately 110 pixels high, softly transparent at its left base so it
    will join a palm in later compositing; do not draw the palm. Keep each frame''s main center axis and silhouette nearly
    the same, vary density, wisps and intensity without translating. Palette muted deep blue-green teal and desaturated
    cyan with charcoal ink, watery translucent layered Chinese ink-wash, dry-brush gaps as holes, fine dissolving edges.
    No white painted highlights, no neon bloom, no solid 3D objects. A continuous low forward palm-pressure sweep with
    wide root, NOT a narrow laser or missile.

    Primary request: the reusable family vocabulary of sorrowful palm wind: a broad low rolling ink-pressure fan sweeping
    right, layered like one curling sleeve-shaped gust, a dark teal central fold surrounded by pale translucent cyan
    wisps. Restrained, melancholy, full of empty spaces. No literal sleeve.'
  negative: 无文字、水印、棋盘格、纸纹、真人肖像；不新增角色、兵器、判定范围或伤害段。
