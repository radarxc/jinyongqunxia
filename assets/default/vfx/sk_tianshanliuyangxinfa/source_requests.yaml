requests:
  family:
    candidates_requested: 1
    prompt: |-
      Use case: stylized-concept. Asset type: Chinese wuxia game VFX sprite sheet.
      Make ONE pure-white RGB background sheet containing FOUR sequential animation frames in a precise 2-column by 2-row grid, equal cells, reading left to right then top to bottom. Landscape canvas, ideally 1536 x 1024. No grid lines, borders, labels, text or characters.
      Subject: Tianshan Six Yang inner cultivation, an ORIGINAL artistic extension for a yang-nature self-support skill. A small, elegant vermilion-red cinnabar qi aura, curling from a broad misty contact patch on the LEFT toward a compact hollow oval to the RIGHT. Three layered brush ribbons turn back inward like slow breathing; airy broken contours and transparent gaps. Compact protective breathing aura, never a projectile or attacking beam.
      Style: refined Chinese ink-wash energy, liquid pigment, delicate dry-brush edges, semi-transparent veils with dark-red accents, restrained warm red-ochre highlights. No literal fire, lotus, dragon, sun disc, religious symbols, anatomy, hands or scenery. NO white or near-white painted highlights inside the effect.
      Layout: each cell is 768 x 512; keep effect within local x=90..680, y=90..422 with at least 48 pixels of pure white at every edge. A broad soft root patch at local x=180,y=256, about 140 pixels high, always stays in the same place. Direction is positive X. The largest hollow oval is centered near local x=410,y=256 and ends near x=650. Each frame keeps the same scale, root and viewpoint.
      Sequence: 1 quiet gathering, 2 breathing coil forms, 3 full but translucent protective coil, 4 faint returning wisps. Frame 4 must still contain visible red pigment. Separate all four frames completely with white space. Flat sprite artwork only, no page texture, no drop shadows, no glow painted onto the background.
