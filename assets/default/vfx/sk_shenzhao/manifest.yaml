  subject: 神照经·神照吐纳家族气息：金色回环；连城书界 / 清代语境（原创扩展视觉）
  prompt: 'Use case: stylized-concept. Asset type: four-frame VFX source sprite sheet for a Chinese wuxia game, Shenzhao Jing
    family healing inner breath. Primary request: ONLY the effect, four continuous animation frames on a perfectly pure white
    #FFFFFF background. Landscape 1536x1024 sheet, exactly 2 columns x 2 rows of equal 768x512 cells; no visible grid, no
    borders, no labels. Every cell shows the same compact oval current of translucent warm gold ink, like two delicate breathing
    ribbons looping gently around an airy empty center, joined at a broad soft root on the left and flowing right. This is
    gentle self-directed internal cultivation, not an attacking projectile. Root centered at local (120,256), root width about
    120 px; rightmost tip near x=650; all marks within x=70..700 and y=80..430 in each cell, at least 40 px clean white margin.
    Same silhouette and root placement across frames. Read left to right, top to bottom: gathering, forming, strongest luminous
    breath, fading residual breath; fading frame still visible. Style: elegant Chinese ink-wash energy, diluted metallic ochre
    and warm golden filaments, organically feathered translucent edges, generous holes and negative space, light yet legible.
    Gold is an original harmony-nature visual design, not a claim of novel color description. Keep ink shades amber/ochre/gold
    with readable colored pale areas; no near-white painted highlights. No human, hand, body, weapon, landscape, text, numbers,
    calligraphy, symbols, lotus, dragon, flames, electrical lightning, sci-fi graphics, border, checkerboard, paper texture,
    shadows, watermark. Only four separated golden ink energy effects and a flat white backdrop.'
