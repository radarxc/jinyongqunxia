  prompt: 'Edit target: the supplied four-frame Shenzhao Huming gold ink aura sheet. Keep the same 1536x1024 canvas, flat
    pure white backdrop, four separate cells, two nested soft oval protective contours and broad soft root left of each, all
    flowing to the right. Targeted repair for white-background chroma key: replace the central little glowing seed in each
    oval with a SOLID MATTE AMBER-GOLD pigment bead and a translucent ochre haze, its CENTER DARKER than its edges. No white
    or near-white pixels inside the bead; all bead core RGB must have blue below 140, target #C28A25, lighter gold only #E6BD58.
    Remove every white specular star, luminous white core, starburst, lens flare, and white painted highlight anywhere inside
    the energy. Brightness must come from colored gold, not white. Leave white negative space OUTSIDE the pigment shapes as
    before. Shift/compact each effect only enough to maintain at least 40 pure white pixels on all four sides inside each
    768x512 cell, especially the tall left root of the two lower frames. Keep the left root center at x=128,y=250 for each
    cell, preserve relative shape and continuity across frames. Frame 3 strongest, frame 4 faded yet visible. Elegant golden
    Chinese ink energy only, no hand/body/text/grid/labels. This is a sprite cutout source, not a finished illustration. Preserve
    the original soft thin filaments and hollow spaces, no hard outlines or sharp edges.'
