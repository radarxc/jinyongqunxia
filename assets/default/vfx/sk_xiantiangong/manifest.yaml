  prompt: 'Use case: stylized-concept

    Asset type: white-background four-keyframe VFX sprite sheet for a Chinese wuxia game, Xiantian Gangqi protective internal-qi
    aura. Entire visual is an original interpretation.

    Create one 1536x1024 landscape image with exactly four equal 768x512 cells in a clean 2x2 arrangement, left to right then
    top to bottom. Pure white #FFFFFF background, absolutely no texture, labels or grid.

    Every cell depicts the same compact protective red qi shell: a broad translucent root on the left at local (210,256),
    unfurling toward the right into three nested upright crescent membranes, a rounded protective bow rather than an attacking
    beam. The aura is open and airy, with deep empty spaces between the curved membranes. Each membrane resembles a curved
    sweep of cinnabar ink in clear water, with delicate scarlet threads that fold back toward the root. Concentrate color
    along the right-facing arcs; keep the left root diffuse, so a hand can remain visible underneath. The outer bow reaches
    local x=600, top y=82, bottom y=430. All root wisps remain inside x=150..650,y=60..452. The actual root cross-section
    at x=210 is about 130px tall. No hard shield object and no solid disc.

    Four animation stages: gathering shell, fully formed three-membrane peak, sustained shell with subtly flowing edges, fading
    shell. Maintain the identical root and comparable silhouettes in all cells for smooth crossfade; the last frame remains
    partially visible. No dramatic expansion between cells.

    Style: refined Chinese wuxia ink-wash energy, vermilion and warm dark-red accents with translucent coral edges, very sparse
    flecks. Game yang-red convention; no canonical novel color claim. No pure-white or near-white painted highlights inside
    the colored marks.

    No people, hands, weapons, dragon, animal, fire, lightning, runes, religious diagrams, writing, watermark, border, shadow,
    paper texture, checkerboard, neon beam or 3D glass. Keep at least 40px pure-white safety margins in every cell. Only the
    four energy frames on white.'
