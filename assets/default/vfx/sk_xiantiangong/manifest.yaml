  prompt: 'Use case: stylized-concept

    Asset type: white-background four-keyframe VFX sprite sheet for a Chinese wuxia game, Wuqi Chaoyuan of Xiantian Gong.
    Original visual based on the move name, not a claimed novel depiction.

    Create one 1536x1024 landscape image with exactly four equal 768x512 cells in a clean 2x2 arrangement, read left to right
    then top to bottom. Pure white #FFFFFF background; no grid, labels or texture.

    Every cell contains a compact internal-qi circulation field made of exactly five main vermilion ribbons. All five begin
    softly at the same broad diffuse root at local (200,256), flow a short distance toward the right, then curl around one
    airy empty center at about (435,256), visually gathering toward one source. The five clearly separated calligraphic ribbons
    create an open fivefold whorl with no enclosing hard circle. Keep openings and white gaps so the qi feels immaterial.
    The five outer curves remain inside local x=145..645,y=70..442; root cross-section at x=200 is about 130px tall. This
    is a local around-body energy surge, not five missiles or a long-range beam. The left root must stay visible and connected,
    not become an isolated floating emblem.

    Four animation stages: five strands gathering, complete five-strand peak, subtly flowing sustained whorl, fading five-strand
    remnants. Root stays identical and the silhouette stays close between peak and sustain; partially visible final frame.
    Do not introduce more major ribbons.

    Style: elegant wuxia ink washes suspended in water, deep cinnabar and warm vermilion with translucent coral wisps, sharp
    brush filaments alternating with empty spaces. Red is the game''s yang convention. No rainbow colors, pure-white painted
    highlights, opaque central orb, solid disc or physical flame.

    No person, hand, weapon, dragon, flower, animal, scenery, religious symbol, diagram, letters, watermark, border, shadow,
    paper texture, checkerboard or neon bloom. Keep at least 40px pure-white safety margins per cell. Only the four energy
    frames on white.'
