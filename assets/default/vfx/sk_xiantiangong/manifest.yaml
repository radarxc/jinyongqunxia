  prompt: 'Use case: stylized-concept

    Asset type: white-background four-keyframe VFX sprite sheet for a Chinese wuxia game, Xiantian Gong family; an original
    visual interpretation, not a claimed depiction from a novel.

    Create one 1536x1024 landscape image with exactly four equal 768x512 cells in a clean 2x2 arrangement, read left to right
    then top to bottom. No visible grid or cell labels. Strictly pure white #FFFFFF background, no paper texture.

    Each cell shows the same elegant warm vermilion-red internal-qi aura flowing toward the right: a broad soft root at local
    (100,256), three translucent coiling red ink wisps threading into one gently arched breath, tapering near (650,256). It
    must read as cultivated internal energy, not physical fire, a sword, a laser, blood, or a dragon. Wispy calligraphic ink
    with real empty gaps, delicate warm coral edges and a restrained cinnabar core. Keep the broad root visibly connected
    through every frame.

    Four animation stages: gathering, fully formed peak, soft sustained breath, fading wisps. Root position stays identical.
    Peak and sustained shapes should be close enough to crossfade cleanly. All colored marks stay inside local x=65..700,y=95..417,
    with at least 40px pure white margins; no particle can cross a cell boundary. The left root is about 90px tall at x=100;
    the energy is longer than it is tall.

    Palette: cinnabar, vermilion, dark warm red, transparent-looking coral washes; red is the game''s yang nature convention,
    not a novel color claim. No white or near-white painted highlights within the effect.

    No people, hands, weapons, scenery, symbols, writing, watermarks, borders, shadows, checkerboard, neon bloom, or opaque
    flat discs. Only the four energy frames on white.'
