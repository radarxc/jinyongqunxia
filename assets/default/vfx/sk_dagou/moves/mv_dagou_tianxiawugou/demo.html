<script type="module">
// Seconds throughout. Pure functions: no browser, renderer or wall-clock dependency.
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const smoothstep = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const durations = c => ['charge_s', 'release_s', 'sustain_s', 'dissipate_s']
  .map(key => c.rhythm[key]);

function durationOf(composition) {
  const values = durations(composition);
  if (values.some(x => !Number.isFinite(x) || x < 0)) throw new Error('Invalid rhythm');
  const total = values.reduce((a, b) => a + b, 0);
  if (!(total > 0)) throw new Error('Duration must be positive');
  const template = composition.template;
  if (template) {
    const expected = template.params?.duration_s;
    if (!Number.isFinite(expected) || expected <= 0 || Math.abs(total - expected) > 1e-9)
      throw new Error('Template duration_s must equal the rhythm duration');
    if (template.mode === 'plain_strike' && total > 0.4 + 1e-9)
      throw new Error('Plain strike duration must not exceed 0.4 seconds');
  }
  return total;
}

function sampleTimeline(composition, seconds) {
  if (!Number.isFinite(seconds)) throw new Error('Time must be finite');
  const duration = durationOf(composition), time = clamp(seconds, 0, duration);
  const [c, r, s, d] = durations(composition), endSustain = c + r + s;
  const phase = time / duration, transition = composition.transition;
  const frames = composition.effect?.frames ?? [{phase: 0}, {phase: 1}];
  let frameIndex = 0;
  while (frameIndex + 1 < frames.length && frames[frameIndex + 1].phase <= phase) frameIndex++;
  const nextFrameIndex = Math.min(frameIndex + 1, frames.length - 1);
  const span = frames[nextFrameIndex].phase - frames[frameIndex].phase;
  const mix = transition.interpolation === 'hold' || span === 0 ? 0
    : clamp((phase - frames[frameIndex].phase) / span);
  let stage, alpha = 1, scale = 1, driftPx = 0, reveal = 1, erase = 0;
  if (time < c) {
    stage = '凝聚';
    reveal = smoothstep(time / c); alpha = reveal;
    scale = transition.scale_from + (1 - transition.scale_from) * reveal;
  } else if (time < c + r) stage = '发出';
  else if (time < endSustain) stage = '持续';
  else {
    stage = '消散';
    erase = d > 0 ? smoothstep((time - endSustain) / d) : 1;
    alpha = 1 - erase;
    const length = composition.length_px ?? composition.range_hex * composition.pixels_per_hex;
    driftPx = transition.drift_fraction * length * erase;
  }
  // The terminal sample is invisible even if dissipation has zero duration.
  if (time === duration) { alpha = 0; erase = 1; }
  const boundaries = [0, c, c + r, endSustain, duration];
  let segment = 0;
  // At repeated boundaries choose the last value, as design/23 §5.1 requires.
  while (segment < 4 && boundaries[segment + 1] <= time) segment++;
  const brightness = segment === 4 ? transition.brightness[4]
    : transition.brightness[segment] + (transition.brightness[segment + 1]
      - transition.brightness[segment]) * (time - boundaries[segment])
      / (boundaries[segment + 1] - boundaries[segment]);
  const config = transition.directional_mask;
  const template = composition.template;
  const extra = template ? sampleTemplateEnvelope(template.mode, phase, template.params) : {};
  return {time, duration, phase, frameIndex, nextFrameIndex, mix, alpha, scale,
    driftPx, brightness, stage, mask: {enabled: config?.enabled ?? false,
      softness: config?.softness ?? 0.08, reveal, erase}, ...extra};
}

// Templates only change presentation envelopes; they never calculate hit range.
function sampleTemplateEnvelope(mode, phase, params = {}) {
  if (!Number.isFinite(phase)) throw new Error('Template phase must be finite');
  phase = clamp(phase);
  if (mode === 'qi_projection') return {};
  const attack = 0.18;
  const envelope = phase < attack ? smoothstep(phase / attack)
    : 1 - smoothstep((phase - attack) / (1 - attack));
  if (mode === 'plain_strike') return {alpha: envelope, brightness: 1,
    scale: 0.85 + 0.15 * smoothstep(phase / attack), driftPx: 0,
    stage: phase < attack ? '出招' : '收势', mask: {enabled: false}};
  if (mode !== 'afterimage') throw new Error(`Unknown template: ${mode}`);
  const count = params.copies ?? 4, spacing = params.spacing_px ?? 28;
  const stretch = params.stretch ?? 0.04;
  if (!Number.isInteger(count) || count < 3 || count > 5)
    throw new Error('Afterimage copies must be an integer from 3 to 5');
  if (!Number.isFinite(spacing) || spacing <= 0 || !Number.isFinite(stretch)
      || stretch < 0 || stretch > 0.1) throw new Error('Invalid afterimage geometry');
  return {alpha: 0, brightness: 1, driftPx: 0, stage: '残影',
    ghosts: Array.from({length: count}, (_, index) => ({
      alpha: envelope * 0.44 * (1 - index / count * 0.65),
      offsetPx: (index + 1) * spacing * (1 + 0.25 * smoothstep((phase - attack) / (1 - attack))),
      stretch: 1 + (index + 1) * stretch * envelope
    }))};
}

// Reference mask math for tests/adapters. q is distance from root / reference length.
function directionalMaskAt(q, mask) {
  if (!mask.enabled) return 1;
  const edge = front => smoothstep((q - front + mask.softness / 2) / mask.softness);
  const reveal = mask.reveal <= 0 ? 0 : mask.reveal >= 1 ? 1 : 1 - edge(mask.reveal);
  const erase = mask.erase <= 0 ? 1 : mask.erase >= 1 ? 0 : edge(mask.erase);
  return reveal * erase;
}

// Convert elapsed playback seconds to a clamped sample and an explicit loop gap.
function playbackTime(composition, seconds) {
  if (!Number.isFinite(seconds)) throw new Error('Elapsed time must be finite');
  const duration = durationOf(composition), elapsed = Math.max(0, seconds);
  if (!composition.output.loop) return {time: Math.min(elapsed, duration),
    inGap: false, ended: elapsed >= duration, cycleTime: Math.min(elapsed, duration)};
  const period = duration + composition.output.loop_gap_s;
  const cycleTime = elapsed % period;
  return {time: Math.min(cycleTime, duration), inGap: cycleTime >= duration,
    ended: false, cycleTime};
}

const vertexShader = `
varying vec2 localPx;
void main() {
  localPx = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;

// SRGBColorSpace textures decode each texel in hardware. Premultiply BEFORE
// bilinear sampling and temporal interpolation, including transparent borders.
const samplingShader = `
vec4 fetchPremultiplied(sampler2D tex, ivec2 p) {
  ivec2 size = textureSize(tex, 0);
  if (any(lessThan(p, ivec2(0))) || any(greaterThanEqual(p, size))) return vec4(0.0);
  vec4 c = texelFetch(tex, p, 0);
  return vec4(c.rgb * c.a, c.a);
}
vec4 samplePremultiplied(sampler2D tex, vec2 pixel, vec2 originalSize) {
  vec2 p = pixel / originalSize * vec2(textureSize(tex, 0)) - 0.5;
  ivec2 base = ivec2(floor(p)); vec2 f = fract(p);
  return mix(mix(fetchPremultiplied(tex, base),
                 fetchPremultiplied(tex, base + ivec2(1, 0)), f.x),
             mix(fetchPremultiplied(tex, base + ivec2(0, 1)),
                 fetchPremultiplied(tex, base + ivec2(1, 1)), f.x), f.y);
}`;

const effectFragment = `
varying vec2 localPx;
uniform sampler2D frameA, frameB;
uniform vec2 sizePx, anchorA, anchorB, sourceDirection;
uniform float frameMix, envelope, brightness, referenceLength;
uniform float maskEnabled, maskSoftness, reveal, erase;
uniform vec3 tint;
uniform float tintEnabled;
out vec4 outColor;
${samplingShader}
void main() {
  vec2 source = vec2(sourceDirection.x * localPx.x - sourceDirection.y * localPx.y,
                     sourceDirection.y * localPx.x + sourceDirection.x * localPx.y);
  vec4 p = mix(samplePremultiplied(frameA, anchorA + source, sizePx),
               samplePremultiplied(frameB, anchorB + source, sizePx), frameMix);
  float mask = 1.0;
  if (maskEnabled > 0.5) {
    float q = localPx.x / referenceLength;
    float show = reveal <= 0.0 ? 0.0 : reveal >= 1.0 ? 1.0
      : 1.0 - smoothstep(reveal - maskSoftness * 0.5, reveal + maskSoftness * 0.5, q);
    float hide = erase <= 0.0 ? 1.0 : erase >= 1.0 ? 0.0
      : smoothstep(erase - maskSoftness * 0.5, erase + maskSoftness * 0.5, q);
    mask = show * hide;
  }
  // Clamp the gained straight color before re-premultiplication (§4.3).
  p.rgb = min(p.rgb * brightness, vec3(p.a));
  if (tintEnabled > 0.5) {
    // Neutral source carries coverage in alpha; gray must not darken the palette.
    p.rgb = tint * p.a;
  }
  outColor = p * (envelope * mask);
}`;

const emitterFragment = `
varying vec2 localPx;
uniform sampler2D plate;
uniform vec2 sizePx;
uniform float opacity;
out vec4 outColor;
${samplingShader}
void main() { outColor = samplePremultiplied(plate, localPx, sizePx) * opacity; }`;

// Only this final pass encodes to sRGB; all layer blending happens in linear RGB.
const displayFragment = `
varying vec2 localPx;
uniform sampler2D rendered;
out vec4 outColor;
void main() {
  vec3 c = clamp(texture(rendered, localPx).rgb, 0.0, 1.0);
  vec3 low = c * 12.92;
  vec3 high = 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055;
  outColor = vec4(mix(low, high, step(vec3(0.0031308), c)), 1.0);
}`;

function quad(THREE, points, uv = points) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points.flatMap(p => [...p, 0]), 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv.flat(), 2));
  geometry.setIndex([0, 1, 2, 2, 1, 3]);
  return geometry;
}

function textureFor(THREE, image) {
  const texture = new THREE.Texture(image);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.flipY = false; texture.premultiplyAlpha = false;
  texture.minFilter = texture.magFilter = THREE.NearestFilter;
  texture.generateMipmaps = false; texture.needsUpdate = true;
  return texture;
}

function blendFor(THREE, mode) {
  const blend = {transparent: true, premultipliedAlpha: true,
    blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
    blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
    blendEquationAlpha: THREE.AddEquation, blendSrcAlpha: THREE.OneFactor,
    blendDstAlpha: THREE.OneMinusSrcAlphaFactor};
  if (mode === 'lighter') blend.blendDst = THREE.OneFactor;
  // With opaque background, screen = Ps + Cb * (1-Ps), NOT 1-alpha.
  else if (mode === 'screen') blend.blendDst = THREE.OneMinusSrcColorFactor;
  else if (mode === 'multiply') blend.blendSrc = THREE.DstColorFactor;
  else if (mode !== 'normal') throw new Error(`Unsupported blend: ${mode}`);
  return blend;
}

function boundsFor(effect) {
  const [w, h] = effect.size_px, [dx, dy] = effect.direction;
  const points = effect.frames.flatMap(({anchor_px: [ax, ay]}) =>
    [[0, 0], [w, 0], [0, h], [w, h]].map(([x, y]) =>
      [dx * (x - ax) + dy * (y - ay), -dy * (x - ax) + dx * (y - ay)]));
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const l = Math.min(...xs), r = Math.max(...xs), t = Math.min(...ys), b = Math.max(...ys);
  return [[l, t], [r, t], [l, b], [r, b]];
}

/** Images must be decoded, straight-alpha, top-left oriented. For ImageBitmap use
 * imageOrientation:'none', premultiplyAlpha:'none'. Metadata stays in source px
 * even when demo images are resized. The caller owns and closes image objects.
 * onFrame(state) is assignable; duration and seek are seconds, excluding loop gap.
 */
function createVfxPlayer(THREE, {canvas, composition, emitterImage, effectFrames}) {
  const c = composition, mode = c.template?.mode;
  const effect = c.effect ?? {size_px: [1, 1], direction: [1, 0], blend: 'normal',
    reference_length_px: 1, root_width_px: 1,
    frames: [{phase: 0, anchor_px: [0, 0]}, {phase: 1, anchor_px: [0, 0]}]};
  const emitter = c.emitter ?? {size_px: [1, 1], emit_point_px: [0, 0],
    direction: [1, 0], emission_width_px: 1};
  if (!canvas || (!mode && (!c.effect || !c.emitter)) ||
      (c.effect && effectFrames.length !== effect.frames.length) ||
      (['qi_projection', 'plain_strike'].includes(mode) && !c.effect) ||
      (c.emitter && !emitterImage) || (mode === 'afterimage' && !emitterImage))
    throw new Error('Canvas, expanded metadata and all decoded images are required');
  if (mode && (!['qi_projection', 'afterimage', 'plain_strike'].includes(mode)
      || !/^#[0-9a-f]{6}$/i.test(c.template.color))) throw new Error('Invalid template mode/color');
  const duration = durationOf(c), [width, height] = c.canvas_px;
  const preview = c.output.preview_size_px ?? c.canvas_px;
  const renderer = new THREE.WebGLRenderer({canvas, alpha: false, antialias: false});
  renderer.setPixelRatio(1); renderer.setSize(preview[0], preview[1], false);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NoToneMapping;
  // Preserve linear compositing on WebGL2 devices without half-float attachments;
  // the 8-bit fallback has lower dark-tone precision and needs device QA.
  const targetType = renderer.extensions.has('EXT_color_buffer_float')
    ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const target = new THREE.WebGLRenderTarget(preview[0], preview[1], {
    type: targetType, colorSpace: THREE.LinearSRGBColorSpace,
    minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter,
    depthBuffer: false, stencilBuffer: false});
  const scene = new THREE.Scene(), displayScene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(0, width, 0, height, 0.1, 10);
  camera.position.z = 1;
  const textures = effectFrames.map(image => textureFor(THREE, image));
  const plate = emitterImage ? textureFor(THREE, emitterImage) : null;
  const value = v => ({value: v}), vector = xy => new THREE.Vector2(...xy);
  const decode = x => x <= 0.04045 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4;
  const color = c.template?.color ?? '#FFFFFF';
  const uniforms = {frameA: value(textures[0]), frameB: value(textures[0]),
    sizePx: value(vector(effect.size_px)), anchorA: value(vector(effect.frames[0].anchor_px)),
    anchorB: value(vector(effect.frames[0].anchor_px)), sourceDirection: value(vector(effect.direction)),
    frameMix: value(0), envelope: value(1), brightness: value(1),
    referenceLength: value(effect.reference_length_px), maskEnabled: value(0),
    maskSoftness: value(0.08), reveal: value(1), erase: value(0),
    tintEnabled: value(Number(mode === 'qi_projection')),
    tint: value(new THREE.Vector3(...[1, 3, 5].map(i => decode(parseInt(color.slice(i, i + 2), 16) / 255))))};
  const material = (fragmentShader, uniforms, mode) => new THREE.ShaderMaterial({
    glslVersion: THREE.GLSL3, vertexShader, fragmentShader, uniforms,
    side: THREE.DoubleSide, depthWrite: false, depthTest: false, toneMapped: false,
    ...blendFor(THREE, mode)});
  const effectMaterial = material(effectFragment, uniforms,
    mode === 'plain_strike' ? 'normal' : effect.blend);
  const emitterMaterial = material(emitterFragment,
    {plate: value(plate), sizePx: value(vector(emitter.size_px)), opacity: value(1)}, 'normal');
  const effectGeometry = quad(THREE, boundsFor(effect));
  const [ew, eh] = emitter.size_px, [ax, ay] = emitter.emit_point_px;
  const angle = c.angle_deg * Math.PI / 180, cos = Math.cos(angle), sin = Math.sin(angle);
  const psi = Math.atan2(emitter.direction[1], emitter.direction[0]);
  const ec = Math.cos(angle - psi), es = Math.sin(angle - psi);
  const corners = [[0, 0], [ew, 0], [0, eh], [ew, eh]];
  const emitterGeometry = quad(THREE, corners.map(([x, y]) => [
    c.emit_at_px[0] + c.emitter_scale * (ec * (x - ax) - es * (y - ay)),
    c.emit_at_px[1] + c.emitter_scale * (es * (x - ax) + ec * (y - ay))]), corners);
  const effectMesh = new THREE.Mesh(effectGeometry, effectMaterial);
  const emitterMesh = new THREE.Mesh(emitterGeometry, emitterMaterial);
  effectMesh.visible = Boolean(c.effect); emitterMesh.visible = Boolean(emitterImage);
  emitterMesh.renderOrder = 0; effectMesh.renderOrder = 1;
  effectMesh.matrixAutoUpdate = false; effectMesh.frustumCulled = false;
  scene.add(emitterMesh, effectMesh);
  const ghosts = mode === 'afterimage' ? Array.from({length: c.template.params.copies ?? 4}, (_, index) => {
    const ghostMaterial = material(emitterFragment,
      {plate: value(plate), sizePx: value(vector(emitter.size_px)), opacity: value(0)}, 'normal');
    const ghost = new THREE.Mesh(emitterGeometry, ghostMaterial);
    ghost.matrixAutoUpdate = false; ghost.frustumCulled = false;
    ghost.renderOrder = -1 - index;
    scene.add(ghost);
    return ghost;
  }) : [];
  const displayGeometry = quad(THREE, [[0, 0], [width, 0], [0, height], [width, height]],
    [[0, 1], [1, 1], [0, 0], [1, 0]]);
  const displayMaterial = new THREE.ShaderMaterial({glslVersion: THREE.GLSL3,
    vertexShader, fragmentShader: displayFragment, uniforms: {rendered: value(target.texture)},
    side: THREE.DoubleSide, depthWrite: false, depthTest: false,
    blending: THREE.NoBlending, toneMapped: false});
  displayScene.add(new THREE.Mesh(displayGeometry, displayMaterial));
  // Explicit decoding also works if a host has disabled global ColorManagement.
  const background = new THREE.Color(...[1, 3, 5].map(i => decode(parseInt(c.background.slice(i, i + 2), 16) / 255)));
  const length = c.length_px ?? c.range_hex * c.pixels_per_hex;
  const sx = length / effect.reference_length_px * c.scale[0];
  const sy = c.emitter_scale * emitter.emission_width_px / effect.root_width_px * c.scale[1];
  let playing = false, disposed = false, speed = 1, request = null, lastClock = 0;
  let cursor = (c.output.peak_phase ?? (c.rhythm.charge_s + c.rhythm.release_s) / duration) * duration;

  function render(time, inGap = false) {
    const state = sampleTimeline(c, time), k = state.scale;
    uniforms.frameA.value = textures[state.frameIndex];
    uniforms.frameB.value = textures[state.nextFrameIndex];
    uniforms.anchorA.value.fromArray(effect.frames[state.frameIndex].anchor_px);
    uniforms.anchorB.value.fromArray(effect.frames[state.nextFrameIndex].anchor_px);
    uniforms.frameMix.value = state.mix; uniforms.envelope.value = state.alpha;
    uniforms.brightness.value = state.brightness;
    uniforms.maskEnabled.value = Number(state.mask.enabled);
    uniforms.maskSoftness.value = state.mask.softness ?? 0.08;
    uniforms.reveal.value = state.mask.reveal ?? 1; uniforms.erase.value = state.mask.erase ?? 0;
    effectMesh.matrix.set(cos * sx * k, -sin * sy * k, 0, c.emit_at_px[0] + cos * state.driftPx,
      sin * sx * k, cos * sy * k, 0, c.emit_at_px[1] + sin * state.driftPx,
      0, 0, 1, 0, 0, 0, 0, 1);
    effectMesh.matrixWorldNeedsUpdate = true;
    ghosts.forEach((ghost, index) => {
      const pose = state.ghosts[index], stretch = pose.stretch - 1;
      const a = 1 + stretch * cos * cos, b = stretch * cos * sin;
      const d = 1 + stretch * sin * sin, [x, y] = c.emit_at_px;
      ghost.material.uniforms.opacity.value = pose.alpha;
      ghost.matrix.set(a, b, 0, x - a * x - b * y + cos * pose.offsetPx,
        b, d, 0, y - b * x - d * y + sin * pose.offsetPx,
        0, 0, 1, 0, 0, 0, 0, 1);
      ghost.matrixWorldNeedsUpdate = true;
    });
    renderer.setRenderTarget(target); renderer.setClearColor(background, 1);
    renderer.clear(); renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.render(displayScene, camera);
    api.onFrame?.({...state, playing, inGap});
  }

  function alive() { if (disposed) throw new Error('VFX player has been disposed'); }
  function advance(now) {
    if (playing) cursor += Math.max(0, now - lastClock) * speed / 1000;
    lastClock = now;
    const position = playbackTime(c, cursor);
    if (position.ended) playing = false;
    return position;
  }
  function tick(now) {
    request = null;
    if (!playing || disposed) return;
    const position = advance(now); render(position.time, position.inGap);
    if (playing && request === null) request = requestAnimationFrame(tick);
  }
  function cancel() { if (request !== null) cancelAnimationFrame(request); request = null; }

  const api = {
    duration,
    onFrame: null,
    play() {
      alive();
      if (playing) return api;
      if (!c.output.loop && cursor >= duration) cursor = 0;
      playing = true; lastClock = performance.now();
      const p = playbackTime(c, cursor); render(p.time, p.inGap);
      if (playing && request === null) request = requestAnimationFrame(tick);
      return api;
    },
    pause() {
      alive();
      if (!playing) return api;
      const p = advance(performance.now()); playing = false; cancel();
      render(p.time, p.inGap); return api;
    },
    seek(seconds) {
      alive();
      if (!Number.isFinite(seconds)) throw new Error('Seek time must be finite');
      cursor = Math.max(0, Math.min(duration, seconds)); lastClock = performance.now();
      // Render the precise endpoint even when loop=true and loop_gap_s=0.
      render(cursor, false); return api;
    },
    setSpeed(multiplier) {
      alive();
      if (!Number.isFinite(multiplier) || multiplier <= 0) throw new Error('Speed must be finite and positive');
      if (!playing) { speed = multiplier; return api; }
      const p = advance(performance.now()); speed = multiplier;
      render(p.time, p.inGap); return api;
    },
    dispose() {
      if (disposed) return;
      disposed = true; playing = false; cancel(); api.onFrame = null;
      [effectGeometry, emitterGeometry, displayGeometry, effectMaterial, emitterMaterial,
        displayMaterial, target, plate, ...textures, ...ghosts.map(g => g.material)]
        .filter(Boolean).forEach(resource => resource.dispose());
      renderer.dispose();
    }
  };
  render(cursor);
  return api;
}

const payload = JSON.parse(document.getElementById('vfx-data').textContent);
const status = document.getElementById('status');
const playButton = document.getElementById('play');
const pauseButton = document.getElementById('pause');
const reduced = document.getElementById('reduce');
const preference = matchMedia('(prefers-reduced-motion: reduce)');
reduced.checked = preference.matches;
const loadImage = uri => new Promise((resolve, reject) => {
  const image = new Image();
  image.onload = () => resolve(image);
  image.onerror = () => reject(new Error('内嵌图像无法解码'));
  image.src = uri;
});
try {
  const THREE = await import('three');
  const images = await Promise.all([payload.emitterImage, ...payload.effectFrames]
    .map(uri => uri ? loadImage(uri) : Promise.resolve(null)));
  const player = createVfxPlayer(THREE, {canvas:document.getElementById('vfx'),
    composition:payload.composition, emitterImage:images[0], effectFrames:images.slice(1)});
  const peak = payload.composition.output.peak_phase * player.duration;
  const showPeak = () => { player.pause(); player.seek(peak); };
  player.onFrame = state => {
    status.textContent = `${state.stage} · ${state.time.toFixed(3)} / ${player.duration.toFixed(3)} 秒`;
  };
  playButton.disabled = reduced.checked;
  pauseButton.disabled = false;
  let started = false;
  playButton.addEventListener('click', () => {
    if (reduced.checked) return;
    if (!started) { player.seek(0); started = true; }
    player.play();
  });
  pauseButton.addEventListener('click', () => player.pause());
  player.setSpeed(Number(document.getElementById('speed').value));
  document.getElementById('speed').addEventListener('change', event => player.setSpeed(Number(event.target.value)));
  const applyReduction = () => {
    playButton.disabled = reduced.checked;
    if (reduced.checked) { showPeak(); started = false; }
  };
  reduced.addEventListener('change', applyReduction);
  preference.addEventListener('change', event => { reduced.checked = event.matches; applyReduction(); });
  window.addEventListener('pagehide', event => {
    if (event.persisted) player.pause(); else player.dispose();
  });
  showPeak();
  document.getElementById('vfx').style.display = 'block';
  document.getElementById('peak').hidden = true;
} catch (error) {
  status.textContent = `预览加载失败：${error.message}`;
}
</script></body></html>
