  subject: 射雕 / 神雕·铁掌运气功·连臂归气·双带回环（原创扩展）
  prompt: 'Use case: stylized-concept

    Asset type: four-frame VFX raw sprite sheet, Chinese wuxia game tianshu.

    Primary request: 连臂归气 (linked arms, returning breath), an original defensive ultimate of 铁掌运气功 / Iron Palm internal
    cultivation. Only magical breath, no physical arms. Two broad cinnabar ink ribbons fold around each other into
    one compact interlocked protective cuff, returning toward a common palm-width source at the LEFT. Airy loops,
    open negative-space center, iron-gray inner brush accents. Warm yang internal energy, not a projectile or literal
    flame.

    Layout: square pure white RGB background; exactly 2 by 2 evenly spaced equal square cells. Four consistent animation
    keyframes, reading order. No drawn dividers or labels. At least 8 percent completely white safety margin on
    each side inside EACH cell.

    Geometry: the same broad softly translucent root at local normalized (0.23,0.52), 0.22 cell-height root width.
    Source feeds two overlapping rounded breath ribbons which unfold to the RIGHT and fold back, entirely before
    x=0.86. Keep root and overall cuff silhouette stable in all cells. Small and local, no long horizontal beam.

    Frames: gentle gathering linked arcs; clearly formed linked cuff; slightly denser held guard; softer thinning
    linked arcs. Final frame still visible. Keep both bands connected to the broad root throughout.

    Style: fine Chinese ink-wash VFX on digital pure white, semi-transparent feathered washes, vermilion #D9483B,
    darker rust red, very restrained charcoal. Lightness and negative space, no opaque outline, polished game sprite
    artwork.

    Constraints: pure #FFFFFF background without paper grain, gray wash, shadow or checkerboard. No pure-white painted
    highlights. No text, numbers, characters, symbols, hands, arms, people, weapons, metal rings, jewelry, armor,
    chains, dragons, animals, landscape, neon, lightning, explosions or detached projectiles. Entire form must fit
    its own cell.'
