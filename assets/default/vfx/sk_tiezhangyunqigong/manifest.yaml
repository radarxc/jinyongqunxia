  subject: 射雕 / 神雕·铁掌运气功·家族·圆转回气（原创扩展）
  prompt: 'Use case: stylized-concept

    Asset type: four-frame VFX raw sprite sheet for the Chinese wuxia game tianshu.

    Primary request: the shared family visual vocabulary of 铁掌运气功 (Iron Palm breath cultivation), an original fictional
    yang internal-defense practice. Depict a compact protective breath aura, like warm vermilion ink mist folded
    around a palm-width source, not an attacking projectile.

    Layout: square pure white RGB background, exactly 2 columns x 2 rows of equal square cells, four separate aligned
    animation keyframes in reading order. No visible grid lines. Each effect wholly inside its cell with at least
    8 percent completely white margin.

    In EVERY cell: broad softly translucent root at local normalized (0.23,0.52), root width about 0.22 of cell
    height; energy extends a short distance to the RIGHT, ending before x=0.86. Keep the same root, orientation,
    compact oval silhouette and camera across all four frames. Two or three low rounded folds of condensed breath
    curl back inward toward the root, with a small open center. No narrow beam or pointed thrust.

    Frames: gentle gathering; formed rounded protective aura; steady slightly fuller breath; soft fading residual
    wisps. Similar silhouettes for smooth crossfade, nonempty last frame.

    Style: refined Chinese ink-wash VFX, translucent washes, soft feathered edges and restrained dry-brush texture,
    warm cinnabar red #D9483B with rust-red midtones and very sparse dark iron-gray ink accents. Sparse, airy, strong
    negative space. No physical metal.

    Text: none.

    Constraints: strict flat #FFFFFF background, no off-white paper, shadows or background textures. No opaque white
    highlights inside effect. No hand, arm, person, weapon, landscape, mountain, dragon, animal, letters, numbers,
    captions, borders, checkerboard, neon lightning, fireballs, sparks, glossy 3D surfaces. This is self-buff breath,
    never a traveling missile.'
