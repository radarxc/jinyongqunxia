    in all four cells.

    Four keyframes: gathering faint but clearly visible; complete calm peak; same peak drifting gently; fading still
    visible fragments. Changes are modest for smooth crossfade. Frame 2 and frame 3 have the same overall silhouette.

    No humans, hands, fingers, sleeves, weapons, text, calligraphy, talismans, magic diagram, flowers, dragon, lotus,
    snowflakes, sparkles, hard shadows, paper grain, borders, checkerboard, off-white background, black background,
    full white internal highlights, neon sci-fi bloom.

    Primary request: the shared family aura and ordinary self-cooling Sanre move. Paint two to three soft cyan streams
    of rising cool breath, curling into a single airy open crescent near the hand. A compact, rounded, open flow
    with a broad diffuse contact root on the left; the right end gently rolls upward into thin vapor. A central
    hollow with white negative space. Quiet elegant exhalation; NO literal ice chunks, no fire, no halo disk, no
    solid shield. Keep the complete aura only within local x=90..675,y=90..422.'
