  prompt: |-
    Use case: stylized-concept
    用途：武侠游戏《天书录》default 风格包的物品基线参考，适合图鉴插画和图标裁切。仅生成一柄剑的一张方形插画，原创中国武侠器物造型。
    题材：倚天剑，既有内容 ID eq_yitianjian，倚天书界 ch04_yitian，元末元顺帝时期、项目主体年代约1336–1363。完整、出鞘、锋锐而古朴的中国单手直身双刃剑。符合中国传统剑的视觉语汇，具体装具是原创美术演绎，不宣称元代文物或原著逐字复原。
    核心形制：修长、轻捷的中国 jian，剑身笔直对称、双刃、清晰中央剑脊，狭长灰钢刃面，锐利尖端；剑柄单手长度，深墨色细密丝麻缠裹，纹理低调。护手非常短小、圆润、浅云头轮廓，古铜色，紧贴剑根，绝不是长横十字护手；小型扁圆盘式古铜剑首，中央无字浅圆纹，绝不是西方多面水晶或钻石型剑首。只有细浅的无字传统几何边饰，无龙头、无宝石、无兽翼、无夸张棱角。剑柄、护手、剑身与剑尖共用同一直轴，结构自然。
    质感与画风：精细武侠器物插画，清楚而轻细的铁线描外轮廓、薄层罩染，克制的手绘痕迹；冷灰钢、暗铜与墨色缠柄互相区分。金属表面很轻微的手工锻磨细纹，护手有少量暗旧氧化，锋刃完好；窄条留白形成寒光，不发光、不镜面眩光，不做商品摄影或塑料3D效果。
    构图与画幅：1:1 方形，目标1536x1536；固定小一些的主体，四周宽敞均匀留白。剑首位于画面宽度20%、高度80%的附近，剑尖位于宽度80%、高度20%的附近，整剑只占画面对角线约60–65%；护手与全部部件都位于中央76%区域内，四边至少12%安全边距。剑柄在左下、剑尖指向右上；轻微三分之四俯视，近正面展示刃面，避免强透视缩短。不可让剑尖或剑首接近画框。只画这柄完整的剑，无鞘、无剑穗、无第二件道具。
    光线与背景：左上45度柔光，暖灰近象牙色纯色背景，与旧纸书册图鉴相容；无地面投影、无背景纸纹、无场景、无地平线。物体自己的明暗塑造体积。
    文字：完全无字，不刻剑名。
    排除项：不要任何文字、汉字、伪字、书法、经文、标题、数字、印章、签名、logo、文字水印；不添加现代元素、塑料、拉链、订书钉、现代印刷装帧、摄影器材；不要人物、手、真人演员脸或演员肖像；不使用在世或近现代画师姓名，不仿具体影视剧、漫画、游戏的独创造型，不复制受版权保护的具体画作或剧照；不要日韩动漫、欧美奇幻、赛博朋克、蒸汽朋克、欧式板甲、日本刀、夸张宝石；不要霓虹、魔法阵、光晕、bloom、镜面眩光、满屏金光；不要血腥、裸露、复杂布景、道具堆叠、UI、品阶边框、拼贴、多视图、裁断主体、透视畸变、重投影；不要去除或伪造工具自身的溯源标识。
    额外排除：欧式长剑、十字军剑、长横护手、外张尖角护手、宽大巨剑、重剑、屠龙刀、弯刀、多面球形剑首、钻石形剑首、魔幻剑柄、满幅贴边、裁断尖端。
