  file: ref_eq_yitianjian__ch04_base01.png
  category: item
  style: default
  subject: "倚天剑（完整出鞘单手直身双刃剑）；倚天书界 ch04_yitian，元末·元顺帝，项目主体年代约1336–1363"
  prompt: |-
    Use case: stylized-concept
    用途：default 风格包的二维武侠物品图鉴插画，单独一柄完整名剑，可供后续图标裁切。
    题材：倚天剑，eq_yitianjian，ch04_yitian，元末，项目主体年代约1336–1363。出鞘完整的中国单手直身双刃剑，天下名剑的华贵、锋锐、端正与罕见工艺。具体剑装、纹样、比例与配色为原创美术演绎，不宣称文物或原著外观复原。
    输入图1仅为画风参考：沿用其中清楚纤细的深灰墨线、薄层透明罩染、克制手绘笔触、低饱和冷暖关系，以及浅暖灰近象牙底色；不要画参考图中的书册或把书册的纹理复制到钢刃上。生成独立新剑图。
    核心形制：单手长度的墨青细丝缠柄，柄、剑首、护手、剑根、剑脊、剑尖同一直轴。剑身修长而挺拔，笔直双刃，两侧对称，根部略宽后平顺收束，后段汇成精锐长尖；清楚连续的中央剑脊、平直磨削面与两侧完整刃口，没有波浪刃文，没有蛇曲或火焰轮廓。
    画法：精细二维线描与薄彩，轮廓清楚纤细，金属明暗为少量平整透明罩染，墨青握柄与冷青灰钢面、浅旧金属装具互相区分。钢刃锋锐完好，温润金属装具只有极少旧色，不做锈蚀破损。
    冷光：左上柔光只作用于物体自身，钢面用冷蓝灰薄染和一条连续纤窄银白刃线表达寒光，少量直线高光增强锋芒；没有自发光、蓝色光晕、魔法、火焰或粒子。
    构图：1:1方形，目标1536x1536。柄在左下、尖向右上，三分之四轻俯视而近正面展示剑身，避免透视缩短。将完整器物明显缩小：整个剑的包围框宽高均不得超过画布64%，所有剑身、护手、柄与剑首都必须落在横纵各18%至82%的中央区域内。剑首中心在宽度24%高度76%附近，剑尖在宽度76%高度24%附近。画幅四边留白目标18%，剑尖和剑首都远离边框；主体完整，不裁剑尖或剑首。无鞘、无剑穗、无第二件物品。
    背景：匹配输入图1的浅暖灰近象牙底色，目标RGB(230,225,216)。均匀浅底，无地面、无桌面、无接触投影、无落地影、无明显纸纹或渐变。
    文字：完全无字，不刻剑名，不画标题、文字、印章或标志。
    原创设计方案D：护手为一对收拢的对称云龙卷钩，短而向剑身上收的云肩构成端正的山字式剪影，造型用流畅的云线抽象表达，不画具象兽头或翅膀。护手总宽约剑根的2.7倍，中央一枚小型扁平哑光墨青椭圆素面饰片，不是鼓起的宝石，无亮斑，银灰装具上的浅旧金细嵌线构成连续无字回纹，少量镂空；剑根用短而尖收的银灰剑格与护手自然相接。剑首为扁平的三瓣如意叶形，银灰底上描浅旧金云纹，与护手形成呼应。墨青细丝缠柄两端加极窄旧金属箍。配色以冷银、墨青为主，浅旧金点缀只占装具少量面积；华贵来自清楚独特的中国云形剪影、镂空和精工细节，保持修长轻捷的实战比例。
    排除项：文字、汉字、伪字、经文、书法、标题、数字、印章、签名、logo、文字水印；人物、手、演员肖像；任何具体影视、漫画或游戏的武器设计复刻、截图或海报构图、受保护画作复制、画师姓名；商品摄影、照片级写实、3D渲染、塑料感、粗厚线条、厚重油画、过度细碎纹理；日本刀、单刃弯刀、波浪刃文、hamon、波纹钢、大马士革旋涡纹、火焰刃、锯齿刃、开刃缺口、断尖、弯曲剑身；长横十字护手、欧洲巨剑、玄铁重剑、屠龙刀、机械零件、兽翼、骷髅、巨大宝石、水晶剑首；霓虹、光晕、bloom、魔法阵、闪电、粒子、满屏金光、镜面眩光；现代物品、血腥、裸露、复杂布景、道具堆叠、UI、品阶框、拼贴、多视图、满幅贴边、主体裁断、透视畸变、轴线错接、投影、地面、桌面、背景底纹或渐变。不要去除或伪造工具自身的溯源标识。
