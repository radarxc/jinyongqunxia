  subject: "《九阴真经》秘籍（上卷单册代表）；射雕书界 ch02_shediao，南宋宁宗—理宗，项目主体年代约1217–1227（精确年表待考）"
  prompt: |-
    Use case: stylized-concept
    用途：武侠游戏《天书录》default物品基线，精细二维手绘器物图鉴插画。仅用文字生成独立新图，不使用任何参考图片。
    题材：《九阴真经》上卷单册 it_miji_jiuyin_shang；射雕书界 ch02_shediao；南宋宁宗—理宗，项目主体年代约1217–1227（精确年表待考）。书名仅作为题材说明，图中不写任何字。按任务要求使用线装外观，形制与配色为原创武侠演绎，不宣称宋代实物或原著外观复原。
    画法第一优先：清楚纤细的深灰墨线外轮廓，薄层透明罩染，克制可辨的手绘笔触。像精绘中国武侠直剑图鉴的同系列书册插画：锐利纤细的边线，少量平缓明暗层次，整体安静古朴，低饱和色。必须能看出线描和彩绘；不要照片微纹理，不要三维材质球效果。
    一册合拢的中式薄本古籍，柔软的墨青纸书衣，纸衣仅一张厚纸的厚度，略有柔软弯曲。封面用均匀淡墨青罩染，局部淡笔触即可，保留大面积安静净色；没有皮革颗粒、褶皱网纹、龟裂、裂缝、大片磨白。只有两个角略微翘起，边缘极少量细毛损。下侧米黄页口用有轻重变化的纤细平行墨线表示，页面薄而轻，不画成厚木块。
    右侧装订边有四个小针孔，一根纤细米白棉线从孔穿入，沿四孔连贯缝合，每一孔位横向绕过右侧书脊包住纸页。用细而明确的线描表示细线，宽度最多只比页口墨线稍宽，不用麻绳，不画三股粗绳纹理，无粗结或线团。让孔、缝线、书脊连接一目了然。
    封面左上方一枚窄长浅米色纸题签，完全空白、内部平整，无边框、无文字、无伪字、无印章、无花纹字。封面其余部分也完全无字。
    构图：1:1方形，目标1536x1536；单册居中、三分之四轻俯视，上短边轻微向右下倾斜15度，完整展示封面、下侧页口、右侧装订边。主体较小，包围框仅占中央64%画幅，四周留白目标18%，验收所有书角与订线到画边至少10%，绝不裁角。
    光线：左上柔和明暗只作用于书册自身。背景必须为平整纯色RGB(233,229,219)浅暖灰近象牙色，无颗粒、无纸纹、无底纹、无渐变、无地面、无桌面、无接触投影、无落地影、无暗色光晕。画成独立图谱插画而非摆在桌面上的实物。
    排除项：不要文字、汉字、伪字、经文、书法、标题、数字、印章、签名、logo、文字水印、花纹字；不要摄影感、商品摄影、照片级写实、3D渲染、塑料质感、皮革、硬壳、龟裂、开裂纹、大片脱皮、过度破损、粗绳、麻绳、松散线头；不要接触投影、落地影、环境遮蔽光晕、地面、桌面、底纹、背景纸纹、渐变背景、场景；不要人物、手、真人演员脸或演员肖像；不要现代元素、订书钉、金属扣、拉链、现代印刷装帧、西式书脊、卷轴、第二册、其他道具；不要在世或近现代画师的风格名，不仿具体影视剧、漫画、游戏造型，不复制受保护画作或剧照；不要魔法光效、霓虹、宝石、UI、品阶框、拼贴、多视图、透视畸变、主体裁断或满幅贴边；不要去除或伪造工具自身的溯源标识。
