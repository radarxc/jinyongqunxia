- id: ref_sect_shaolin__ch01_base01
  file: ref_sect_shaolin__ch01_base01.png
  category: building
  style: default
  subject: |-
    北宋·嵩山少林寺山门与大雄宝殿；天龙八部 ch01_tianlong，约1093–1094，年代意象复原（原创扩展）
  prompt: |-
    Use case: historical-scene
    Asset type: 《金庸群侠传·天书录》default 风格包的建筑类基线参考候选，非运行时素材。
    题材与时代：天龙八部书界 ch01_tianlong，北宋哲宗约1093—1094年，河南登封嵩山少室山麓少林寺的山门与大雄宝殿，同一张完整环境图。呈现历史建筑概念复原（原创扩展），不是现存少林寺照片，也不声称是经过测绘的1093年原貌。
    构图：横向3:2画幅，目标1536×1024。单幅画面，不分栏，不做图册。从寺前东南侧略高的土坡向西北观看，约正常建筑摄影35mm镜头，校正垂直透视。前景左侧为较小三间木构山门，后方偏右较高石台上为五间主佛殿；两者沿一条南北院落轴线布置，斜向观察使大殿的完整正面、侧面、柱网和檐下斗拱清晰可见，山门不能遮住大殿。山门与大殿之间保留真实尺度的石铺庭院与树木，作为基线适度简化院落，绝不是两座建筑并排的布景。画面主要面积由建筑占据，所有屋脊与檐角完整入画，后景少室山低缓的岩山林坡，薄雾仅限远山。
    形制：北宋中原佛寺的大木作语汇，宽阔稳重、舒展平缓的单檐歇山屋顶；檐出深远而非夸张尖翘，山门尺度较小，佛殿尺度较大；主殿柱头硕大的承重铺作层层挑出，柱间补间铺作相对疏朗，每组栱、斗、昂有明确承托关系，不能是密密麻麻装饰碎块。粗壮木柱落在石础上，阑额、梁架与椽头清楚，屋面有整齐连续的灰色筒板瓦，脊端朴素宋式鸱吻，比例克制。木柱沉稳暗朱，梁枋少量低饱和赭、土红、石绿几何和卷草彩绘；灰瓦、自然木纹与石台质感为主，不把宋建筑画成全部裸木，也不涂成清宫满铺金碧。此处三间、五间、单檐与院落关系均为概念设计选择。
    光与材质：写实古风，高质量历史环境视觉开发，具有建筑摄影的空间可信度与细节。晴朗秋日上午左上侧柔和日光，屋檐下保留可读的环境反射光，真实接触阴影；木纹、旧漆轻微磨损、瓦片搭接、石阶凿痕、土与苔痕细腻可信，建筑仍在正常使用和维护，不能像荒废遗址。自然克制的灰瓦、暗朱木构、绿树与暖灰石材，真实色彩，不加水墨晕染、纸纹、描边或游戏UI。画面无人。匾额位置不悬挂文字牌匾，建筑细节自然完整。
    输出：一张细节清晰的PNG风格基线图，不带边框和题名。

    排除项：不要文字、汉字、伪字、题名、牌匾字、书法、签名、品牌标识、生成的可见水印、图例、边框、拼图或UI；不要现代建筑、混凝土、电线、电灯、监控、消防器材、旅游标牌、栏杆隔离带、车辆、游客；不要任何人物或真人演员脸，不要影视剧版造型，不要受版权保护画作或剧照的复制构图，不要在世或20世纪以后画师姓名风格；不要清式黄色琉璃大屋顶、清式密集小斗拱、龙纹和玺彩画、康熙匾额、雍正山门外貌；不要把1125年初祖庵当作1093年的大雄宝殿；不要日式鸟居、日式城堡、仙侠悬浮宫殿、欧式奇幻、赛博朋克；不要夸张反卷飞檐、额外重檐、无支撑屋顶、悬浮斗拱、错位柱网、熔化木构、断裂重复瓦片；不要水墨画、纸纹、卡通、塑料渲染、过度HDR、镜头光晕、浓雾遮挡结构；不要血腥、裸露。不要主动添加可见水印，保留工具原生溯源信息。
