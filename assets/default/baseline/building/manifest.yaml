- id: ref_city_beijing__ch08_jiaolou_base01
  file: ref_city_beijing__ch08_jiaolou_base01.png
  category: building
  style: default
  subject: |-
    清初·北京紫禁城角楼、城墙与护城河；鹿鼎记 ch08_luding，康熙约1669–1690，清式官式建筑意象（原创扩展）
  prompt: |-
    Use case: historical-scene
    Asset type: 《金庸群侠传·天书录》default 风格包的建筑类基线参考候选，非运行时素材。
    题材与时代：鹿鼎记书界 ch08_luding，清初康熙朝约1669—1690年，北京紫禁城的一座城隅角楼、相接的城墙与护城河。历史建筑环境概念图，表现明代创立、清代沿用修缮的官式建筑，不声称角楼始建于清代，也不声称复原了康熙某一年每一处彩画。无剧情人物。
    构图：横向3:2画幅，目标1536×1024。单幅写实建筑全景，不分栏。从护城河外岸稍高的岸地，以35mm建筑摄影式三分之四视角望向城隅。角楼为唯一主体，处于画面中央偏右，完整显示上、中、下檐与墙顶基座，屋顶最高点与两侧屋角均有留边。前景约四分之一为平静水面与自然倒影；水面之后是条石垒砌、垂直陡直的驳岸，岸上完全没有栏杆。驳岸后只留简洁的素土或砖地窄带，不种成排树木。其后是约10米高、厚重的城砖包砌朱红/赭红城墙转角：高大连续的实心墙身从灰石墙脚升到墙顶，两段城墙自转角向左右退入景深，不是低矮院墙。墙顶外沿为连续的雉堞垛口，约0.8–0.9米高，一垛一口规则排列，沿两段墙和转角保持连贯；清楚展示墙身高度与顶部垛口的尺度差，内侧为较矮宇墙。角楼坐在城隅墙顶上，须弥座及周边石栏只在墙顶平台、位于外沿垛口墙之后；从水面向上依次可读驳岸、10米城墙、墙顶垛口、后方角楼须弥座石栏及楼身。角楼整体明显高出墙顶，不能落到河岸上，不设置外凸于红城墙的灰色石砌墩台。楼身足够大，檐下斗拱、梁枋彩画、门窗和瓦垄清晰可读，垂线保持垂直，不用夸张鱼眼、不用俯瞰地图视角。
    形制：准确把握北京紫禁城角楼的紧凑复合轮廓，而不是一座泛化的三层宝塔。中央方亭、四面抱厦，十字形组合平面；三层屋檐组成互相衔接的复合歇山屋顶，上部纵横交叉歇山脊、交汇处小型铜鎏金宝顶，中层四面歇山抱厦，下层腰檐连续。黄琉璃筒板瓦有规律搭接，屋脊装饰尺度克制。清式斗拱相对柱身较小，构件排列规整紧密，明确承接檐椽；朱红柱、梁枋上的低饱和蓝绿旋纹彩画与局部点金，参照故宫博物院文字资料所述龙锦方心墨线大点金旋纹彩画的结构语汇，不笼统画成满金龙和玺；三交六椀菱花风格的木格扇门窗；楼下浅色石质须弥座与一圈石栏均设于城隅墙顶、在外沿雉堞垛口之后；石栏不延伸到驳岸。沉稳厚实、高约10米的朱红/赭红城砖墙体承托角楼，墙脚灰石与垂直条石驳岸能读出尺度。复合屋顶各翼与转角接合可信，不叠成逐层缩小的独立方形亭子。
    光与材质：写实古风，建筑摄影般可信的清晰空间、透视与自然光影。晴朗秋日上午左上侧柔光，黄釉瓦高光小而自然，暗部有环境光，朱漆轻度旧化且仍被维护，瓦缝、木材、漆面、石材和灰缝可辨；朱红、金黄色、少量蓝绿彩画与浅蓝天构成克制的宫廷色彩，富丽而不刺眼。远处无山峰、无现代北京天际线。避免修旧如新的塑料感，也避免把在用皇宫画成废墟。
    输出：一张清晰PNG基线图，无人、无文字、无牌匾、无边框。

    排除项：不要文字、汉字、伪字、题名、匾额字、书法、签名、品牌标识、生成的可见水印、图例、边框、拼图或UI；不要现代建筑、天线、电线、电灯、监控、消防器材、扩音器、游船、车辆、游客、旅游护栏、现代道路、现代城市天际线；不要任何人物或真人演员脸，不要影视剧版造型，不要受版权保护的照片、画作、剧照作为复制源，不要在世或20世纪以后画师姓名风格；不要把角楼画成塔、天坛、天安门城楼或日式天守阁，不要日式鸟居，不要仙侠悬浮建筑、欧式奇幻、赛博朋克；不要把城墙画成灰瓦墙帽的院墙，不要缺少雉堞，不要在护城河岸上加汉白玉栏杆，不要在河岸与城墙之间画成排树木，不要外凸石砌墩台；不要宋式硕大疏朗斗拱，不要全部灰瓦，不要过度金色龙纹，不要皇家屋脊走兽胡乱堆叠，不要不合理的第四第五层檐；不要悬浮屋顶、熔化斗拱、错位柱网、断裂屋脊、结构穿插、杂乱瓦片、无支撑楼基；不要水墨画、纸纹、卡通、塑料渲染、过度HDR、镜头光晕、重雾、夕阳剪影；不要血腥、裸露。不要主动添加可见水印，保留工具原生溯源信息。
