- id: ref_npc_xiaolongnv__ch03_base01
  file: ref_npc_xiaolongnv__ch03_base01.png
  category: character/female
  style: default
  subject: 小龙女（ch03_shendiao）
  prompt: '生成一张 2:3 竖幅全身人物立绘：单人、单一视角、完整全身——头顶、双手、双脚和手中器物的两端都在画面内，四周留出自然空白；人物站姿自然，身体基本朝向正面，头部端正（不歪头、不仰不俯），镜头平视。

    【画风】写实手绘古风人物插画，与本项目写实武侠角色立绘同一画风，像功力深厚的画师用细腻笔触画出的真实美人。手绘插画质感，不是 CG 渲染：不要过度光滑的皮肤、完美对称的五官、塑料高光、过度锐利的发丝；保留自然的笔触和细微不完美。肌肤细腻自然，看得见极细的肤理和自然的左右不对称，不磨皮、不油亮、不打粉；头发是一缕缕自然的发丝和少量碎发；布料看得出经纬纹理、厚薄和自然垂坠的褶皱，干净完整；整体设色低饱和、雅致；柔和的自然光从左上方照来，明暗过渡自然，不打舞台光、轮廓光或美颜柔光。不是照片，不是三维渲染，不是动漫或游戏
    CG，也不是油画（没有厚涂笔触和画布纹理）。

    【背景】不透明的暖浅灰色纸底，只在远处有极淡的水墨远山和薄雾，大面积留白；人物与背景明暗分明、轮廓边缘干净完整（后续要自动抠图），水墨和纸纹只在背景里，不侵入人物和衣服；脚下只有很淡的一点接触阴影。

    【人物】小龙女，《神雕侠侣》古墓派掌门，杨过的师父与妻子；在绝情谷得到淑女剑之后、十六年分离之前。清冷出尘、心思单纯，对杨过一往情深。

    【年龄与体态】二十多岁的成年女子，身形修长轻盈。成年女性的五官骨相与身体比例（约 7 头身），衣着完整端庄、不透明、不暴露、不性感化。

    【经典造型】以九十年代中期经典港剧里那位白衣胜雪的小龙女为蓝本（见剧照）：清丽的鹅蛋脸、清澈而清冷的眼睛、素净的唇色；乌黑长发大半披在背后、头顶挽一个小髻系白色丝带；一身素白长衣长裙；肌肤胜雪、清冷出尘，美得不食人间烟火。

    【面容】原著写她除了一头黑发之外全身雪白，面容秀美绝俗，只是肌肤少了一层血色、显得苍白；清丽秀雅，神色冰冷淡漠。具体为：清丽的长鹅蛋脸、下颌线柔和，眉毛细长平直、颜色偏淡，眼睛清澈而冷、眼神淡漠出尘，鼻梁细直，唇色极淡，肌肤苍白如雪、几乎没有血色（久居古墓），素面无妆。清丽绝俗的绝美女子。

    【发式】乌黑长发大部分披在背后，头顶挽一个小髻，用白色丝带束住。

    【服饰】一身素白的长衣长裙：多层轻柔但不透明的白绢，交领右衽，腰束白色丝带，白色软鞋。

    【道具】右手握一柄长剑（淑女剑），完整入素白剑鞘，剑尖朝下。

    【姿态与神情】静静站立，像雪中的一枝白梅；神情清冷淡漠，眼神却安静坚定。

    【不要】画面里不要任何文字、题款、印章、签名、水印、边框、分格或多视图；不要第二个人；不要幼态（童颜、娃娃脸、婴儿肥、儿童或少年身材、大头小身）；不要塑料感皮肤、磨皮美颜、网红脸（尖下巴大眼高鼻的模板脸）、过度对称、浓妆、偶像式打光、蜡像感；不要照片质感、三维渲染或动漫大眼；不要歪头、斜镜头；不要多指、缺指（设定的伤残除外）、手与器物粘连或悬空；汉式交领必须右衽（穿着者的左襟压在右襟上），不要左衽（设定为少数民族服制的除外），不要水平镜像；不要现代物品、发光特效、法阵或能量光。不要红润气色或浓妆；不要仙女飘带、发光仙气；不要彩色衣裙。

    【参考图】随提示词上传的参考图共 3 张，按顺序：第 1 张是这个角色经典影视造型的剧照：借鉴其发型、服饰、配色、标志道具、气质和面部特征，让人一眼认出是这个角色；但必须重新绘制成本项目的画风，不要照片质感，不要照搬剧照的构图、光影、背景和姿势，也不要做成照片修图；剧照与上文文字有出入时，以上文文字为准。最后两张是本项目的立绘画风基线：画风、用色、光线、质感和暖浅灰纸底加淡水墨的背景以它们为准——精细写实的数字手绘插画，不是油画，不要厚涂笔触和画布纹理；基线图里人物的长相、年龄、发型、服饰和姿势一律不取。'
