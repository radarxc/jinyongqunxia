<script>
"use strict";
const data = JSON.parse(document.getElementById("vfx-data").textContent);
const canvas = document.getElementById("canvas");
const context = canvas.getContext("2d");
const play = document.getElementById("play"), pause = document.getElementById("pause");
const reduce = document.getElementById("reduce"), speed = document.getElementById("speed");
const status = document.getElementById("status");
canvas.width = data.size[0]; canvas.height = data.size[1];
const preference = matchMedia("(prefers-reduced-motion: reduce)");
reduce.checked = preference.matches;
let frames = [], peak = null, running = false, elapsed = 0, previous = null;
let lastDrawn = null;
function decode(uri) {
  return new Promise((resolve, reject) => {
    const image = new Image(); image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("内嵌 WebP 解码失败")); image.src = uri;
  });
}
function draw(image) {
  if (image && image !== lastDrawn) {
    context.clearRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0); lastDrawn = image;
  }
}
function staticFrame() {
  running = false; previous = null; elapsed = 0; draw(peak);
  status.textContent = "峰值静帧";
}
function tick(now) {
  if (running && !reduce.checked) {
    if (previous !== null) elapsed += (now - previous) / 1000 * Number(speed.value);
    previous = now;
    const period = data.duration + data.gap;
    if (data.loop && elapsed >= period) elapsed %= period;
    if (!data.loop && elapsed >= data.duration) {
      elapsed = data.duration; running = false; previous = null;
    }
    let index = data.times.length - 1;
    while (index > 0 && data.times[index] > elapsed) index--;
    draw(frames[index]);
    status.textContent = `${Math.min(elapsed, data.duration).toFixed(2)} / ${data.duration.toFixed(2)} 秒`;
  }
  requestAnimationFrame(tick);
}
play.addEventListener("click", () => {
  if (reduce.checked) { staticFrame(); return; }
  if (elapsed >= data.duration) elapsed = 0;
  running = true; previous = null;
});
pause.addEventListener("click", () => { running = false; previous = null; });
reduce.addEventListener("change", staticFrame);
preference.addEventListener("change", event => { reduce.checked = event.matches; staticFrame(); });
document.addEventListener("visibilitychange", () => { previous = null; });
Promise.all([...data.frames, data.peak].map(decode)).then(images => {
  peak = images.pop(); frames = images; play.disabled = false; pause.disabled = false;
  staticFrame(); requestAnimationFrame(tick);
}).catch(error => { status.textContent = error.message; });
</script>
