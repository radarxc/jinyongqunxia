  prompt: |-
    【效果原图实际请求】
    Use case: stylized-concept
    Make a technical six-sprite animation contact sheet on a totally flat pure WHITE #FFFFFF background. Landscape 1430x1100, two columns by three rows, six golden Chinese qi dragons only. No hand, text or grid.
    CRITICAL COMPOSITION: Lots of white space. Each entire dragon is SMALL within its own cell: only 70% of the cell width and 55% of the cell height. At least 80px white padding all around every sprite. The space between two neighboring dragon silhouettes must be at least160px. Do not enlarge to fill the cells. Six identical invisible cells, left to right top to bottom. No particles, wisps or splashes outside this small silhouette.
    Within each cell a broad vertically OPEN left edge, like a 100px-high translucent gold curtain, is the fixed root of whole-palm force. It is not a thin tail, not a curled closed tail, not a nozzle. From this wide opening a continuous majestic golden S-curved airy dragon body flows RIGHT to a powerful, recognizable Chinese dragon head; keep small fine horns and whiskers within the padded area. The same design and viewpoint in all frames, same fixed broad root and head position. One dragon per cell, no legs necessary, no solid scales.
    Golden ink-painting spirit: warm ochre-gold and pale gold, semi-transparent airy body, dry-brush gaps inside the silhouette, head slightly more defined. No opaque animal, no metallic statue. Understated internal detail, great force in the poised forward thrust. Retained highlights are gold, never white paint. Empty holes show the white field.
    Six phases change density much more than shape: faint gathering, forming, release, peak, waning, lingering. Keep all six silhouettes the same size and identity. Broad root is clearly visible throughout.
    Every pixel outside the six foreground silhouettes must be solid RGB255,255,255 white without any shading or texture. This is a cutout source, not a paper illustration.
    Avoid text, numbers, labels, watermark, borders, divider lines, hands, arms, people, clothing, scenery, background gradients, paper texture, shadows, checkerboard, grey wash, white paint, thin root, closed tail spiral, random particles beyond silhouette, overlarge dragons, clipped details, metal, solid full-body scales, western wings, neon, flames, lightning or smoke.

    【发出方实际请求】
    Use case: precise-object-edit.
    Edit this emitter plate. Preserve exactly one adult five-finger hand, warm natural skin, grey-brown plain Song-style hemp sleeve, pose and native transparent background. Improve TWO compositing requirements:
    1) Rotate the open palm plane about its upright axis about 35 degrees so its outward normal points diagonally toward the screen RIGHT while still showing palm lines and palm pads clearly. In screen projection the emission direction is horizontal right [1,0]. The hand should read as actively pushing to the right rather than presenting a flat palm directly at the viewer. Keep thumb plus four fingers individually readable and natural.
    2) Reframe the complete isolated hand, wrist and SHORT sleeve smaller, centered with 100 pixels transparent clearance at every canvas edge on a square image. No part of sleeve, wrist, palm or finger may touch the canvas border. The cuff and sleeve end must both lie fully inside frame. Do not crop the sleeve on the left.
    Keep the whole active palm wide and visible. No effect is drawn. No arrows or coordinate marks. This is only a pose demonstration, not a claim about original text handedness. Refine any coloured silhouette fringe into clean native-alpha edges; preserve skin and fabric colour.
    Avoid: missing or extra fingers, fused fingers, abnormal joints, detached wrist, long nails, modern sleeve, weapon, dragon, gold glow, energy, smoke, magic, ground shadow, text, numbers, logo, border, checkerboard artwork, white or paper background.
