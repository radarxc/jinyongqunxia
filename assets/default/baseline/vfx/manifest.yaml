  prompt: |-
    Use case: stylized-concept
    用途：为《金庸群侠传·天书录》默认风格包生成一张招式基线概念位图，供作者审定水墨特效风格。纯画面无文字。此图是特效意象，不是现实武术教学图。
    题材：降龙十八掌·亢龙有悔。书界 ch02_shediao《射雕英雄传》，游戏推定南宋 1217–1227。只画一名不具名成年汉族武者的一只完整手掌、手腕与前臂袖口，不出现脸或身体，袖口是朴素宋式窄袖麻布、灰褐薄染，没有甲胄、饰物或宫廷龙纹；这是原创示范造型，不指认郭靖或洪七公。
    构图与视角：横幅 1536×1024（3:2）。近距离侧前方视角，前臂从左下进入，只画一只完整、解剖自然的成年人的手；手掌约 45° 朝向观者和画面右方，观者明确看见掌面、掌纹和指腹，不能画成露指甲的手背。掌心居画面左侧约四分之一处，适当放大手部以便检查结构。拇指向画面左侧舒展；食指、中指、无名指、小指依序在上方自然扇形分开，中指最长、小指较短；拇指加四指共五个指头全部清晰可数，五个指尖与五根手指从根部到指腹各有完整轮廓，指间留出明确纸白间隙，互不重叠、互不融合、没有第六指、不截断、不被墨团遮挡。特别保留外侧小指的完整独立轮廓。掌心中央劳宫区域及其周围掌纹清楚可见，不能用大块黑墨遮住。刚猛掌劲从掌心中央一个小而清楚的起点连续透出，先是一缕半透明窄墨流，越过手部净空后在右侧扩展成墨色龙形气劲，不能从手腕、手背、指端或掌外悬空处起势。手部构图变体：将五个指尖之间的留白再拉开少许，手掌略抬高；掌面尽量展开，拇指与小指分别形成两侧独立轮廓，中央掌纹与墨流接点保持清爽。
    龙形布局：单条中国龙形气劲在画面中右部向右冲出，龙头在右中部，主要气劲与轮廓完整留在画内。龙的身形回卷一弯，既有向前爆发又有回收的余势。龙首仍较实、躯干透底，龙身与手指保持分离，虚实交错；单一视觉焦点。上下与右缘留大量安静空白，整体至少约四成留白。
    水墨处理：虚实相生，墨色龙形是掌劲的原创视觉隐喻，不是实体生物。只用深浅墨与极淡暖灰，龙首只在眉骨、吻部、须与双角处用少量干笔抓形，身体由湿墨晕染、透明叠化的薄烟、水渍边缘和大片断开的飞白组成。能透过龙身看到背后淡纸色，浓墨只占少量骨架和发力起点。龙腹和尾部主动消融为纸白，不画完整鳞片、坚硬外壳或雕塑般龙身。粗劲主笔与轻柔墨雾同存，小范围沿发力方向飞溅，不能用烟雾遮掉手掌或发力起点。
    背景、光线、质感：浅暖白宣纸底，细微纸纤维，背景完全空旷，无城市或建筑。漫射环境光，左上轻微照明感，手掌略有真实结构但仍是手绘淡墨；不需要耀光，力量由墨迹速度和留白体现。画面完成度高、克制、空灵，适合作为持续复用的水墨特效审美参考。
    透明性：本图保留浅纸底，不要求文件 alpha 透明；气劲的半透明感在画面内部以透底和透明层次表达。
    排除项：不要文字、汉字、书法、题签、印章、签名、水印、标志、边框、分镜格；不要现代元素、现代服饰、清代马蹄袖、明代网巾、日式服饰、欧式奇幻甲胄；不要真人演员脸、影视剧版造型、任何在世或近现代画师风格名、已有插画或剧照复刻；不要霓虹、激光、蓝色电弧、火焰、满屏金光、游戏 HUD、科幻法阵、塑料 3D 材质、动漫大眼、血腥、裸露；不要多指、缺指、融合手指、断腕或不自然关节。另不要西方带翼龙、实体龙宠物、金色龙、掌心以外的发射点、血管解剖标线或穴位标签。另不要手背朝观者、用指甲代替指腹、透视藏起小指、拇指加三指的四指手、重叠或墨团遮挡手指、黑色墨球盖住掌心。
