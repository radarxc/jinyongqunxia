  subject: "降龙十八掌·亢龙有悔；ch02_shediao；南宋 1217–1227（游戏推定，待考）；全掌宽面透出金色龙形气劲，水墨虚实、透明回旋。"
  prompt: |-
    Use case: stylized-concept
    用途：原创武侠掌法的审美基线概念图；横幅 1536×1024，单张完整画面，无文字。
    场景：浅暖白纸本留白，金色设色与水墨虚实结合，背景空旷。主体是一只成年武者完整右手与朴素宋式灰褐麻布袖口，前臂从左下进入，不出现脸或身体。手掌占画面足够大小，约画幅高度的四成，三分之四侧前视角明确露出掌面和指腹。恰好五指，拇指加四个独立分开的手指，五个指尖和指节结构自然，掌纹可辨。
    动作与发力：金色掌劲同时从整个掌面——掌根、大小鱼际、四指根部下方的宽面——向右透出、化出。手掌前缘形成与掌面等宽的半透明金色气幕，整体向外推出，绝不是中央一点喷出的流束。整掌透光仍能看见掌纹；手指外轮廓不要被金光盖住。离掌后宽阔气幕汇成一条气势磅礴的中国龙形，远处龙首巨大，前冲与回旋同时存在，龙身占中右区域大尺度 S 弯，画面有强烈纵深和力量感。龙的根部宽阔、与掌面整体呼应，不收成细尾巴。
    风格：龙形为内劲的原创视觉隐喻，不是真实动物；金色为绝对主色，淡金、暖金、赭金相叠。龙首眉骨、须角少量较实，龙腹、身侧、尾迹大面积透明，金色淡染、墨色极少骨架、干笔飞白与湿边消散交错，可以透见纸底。龙头不要画成金属雕塑；鳞片只暗示少量笔势，不要整身硬壳。身体和龙首至少留一圈明确边距，最长龙角与须完整在画内。主龙头位于右上但不贴画缘，回旋与飞白占中下部，留出安静空白约三成。
    照明：金色内光增强力量但不过曝，半透明气幕中掌纹仍可辨，暖白纸底和灰褐布袖衬金色。手部真实结构、淡设色手绘；画面庄严、开阔、刚猛而轻透。
    透明性：保留纸底，不要求文件 alpha；透明来自画内透底层次。
    排除项：不要文字、汉字、题签、书法、印章、签名、水印、标志、边框、分镜格；不要人脸、演员肖像、已有影视或游戏造型、画师风格名、现成作品构图；不要现代物品、现代服装、甲胄、清式马蹄袖、日式服饰；不要多指、缺指、融合指、异常关节、断腕、长指甲、手背替代掌面；不要从掌心一点或腕部喷射的窄管、喷墨口、黑墨球、细尾巴接在掌心；不要实体金属龙、完整硬鳞甲、金属雕塑、带翼西方龙、火焰、霓虹激光、法阵、血腥、裸露；不要过曝遮住掌纹，不要裁掉龙角、龙须、手指。
