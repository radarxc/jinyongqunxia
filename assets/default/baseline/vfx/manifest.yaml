  subject: "六脉神剑；ch01_tianlong；1093–1094（游戏推定，待考），北宋同期大理国；离指成形的六路半透明凝缩气剑，近无色刃体与淡青赤刃缘，全画面非水墨。"
  prompt: |-
    Use case: precise-object-edit
    编辑目标：输入图是本项目自己生成的六路气剑候选，只编辑气刃位置和长度，保留现有两只手的形状、五指数量与真实结构、皮肤、飘动灰白袖口、冷灰石庭背景、自然光、1536×1024横幅。绝对保持全画面清晰非水墨风格。
    必须做出的变化：把六枚气刃全部向右移动，并缩短它们左侧的拖尾，建立宽阔离指空隙。左边所有手指的最右端大约在 x=580；所有气刃、微光、尾迹、折射波纹的最左端必须在 x=760 右侧，整个 x=590 至 x=750 的垂直带只能看见干净石庭背景，任何一枚气剑的尾尖、发光丝线或气流都不能进入这条净空带。即使最下面的小指红气刃也必须遵守。六枚长度缩短后全部尖端保留在 x=1450 左侧，画面右边留出边距。六枚气刃依旧沿原有六个指端朝右射出的各自方向分开，不能交叉或合并。不要在指端添加光点或长指甲。
    气剑质感：高密度凝缩内力的半透明空气刃，近无色薄刃面、锐利细缘与尖锋、轻微空气折射/一两道震荡纹，向前飞行而非固定在手上。长短略错落、轻微优雅弧度，前端凝实而后端渐隐；绝不是画笔拖曳的痕迹或烟带。去掉多余细丝，以干净清楚的六枚主刃为主。
    保持色彩：上方手的五枚从上至下，极淡刃缘依次青、赤、青、赤、青；下方小指第六枚为极淡赤。青参考 #2A9D8F，赤参考 #C44536，刃面近无色，背景透过其间。仅为原创经脉识别色，不声称原著规定固定色。上手的指别从上到下为小指、无名指、中指、食指、拇指，各有独立方向；下手小指发第六道。
    排除项：不要水墨笔触、墨迹、湿墨晕染、飞白、宣纸纹理、泼墨、画笔拖痕；手、衣袖、背景和气剑均不能出现这些质感；不要文字、书法、题签、印章、签名、水印、标志、边框、分镜；不要演员脸、人脸、已有影视游戏造型、画师姓名、现成作品构图；不要现代物品或现代服饰、甲胄、马蹄袖、日式服装；不要长指甲、指甲延伸、气刃接在手指上、贯穿指甲的光束；不要多指、缺指、融合指、异常指节、断腕；不要实体金属剑、剑柄、护手、玻璃实体剑、冰晶、火焰、雷电、霓虹、机械平行激光、能量球、法阵、血腥、裸露；不要第七道主气刃，不要浓烟遮挡手部与指端间隙。
