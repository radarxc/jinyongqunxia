  subject: "六脉神剑；ch01_tianlong《天龙八部》；1093–1094（游戏推定，待考），北宋同期大理国；六道指端无形剑气的淡墨留白总览。"
  prompt: |-
    Use case: stylized-concept
    用途：为《金庸群侠传·天书录》默认风格包生成一张六脉神剑的水墨特效基线概念位图，纯画面无文字，供审定美术风格。
    题材与年代：六脉神剑 sk_liumai，《天龙八部》ch01_tianlong，游戏推定 1093–1094，北宋同期的大理国。画的是不具名段氏习武者的手部示范，不画段誉肖像或任何名人面孔。画面只出现同一位成年人的两只手、手腕与少量朴素浅灰白布袖，衣料与窄袖结构符合宋代同期武侠化服装，装饰极少，不出现建筑、头饰或具体城市景观。
    核心视觉：六道“无形”剑气从六个指端射出。解剖准确的右手五指自然舒展，五个指端各发一股；另一只左手位于其下方，只伸出小指发出第六股，其余四指自然收拢。两只手均正常五指，掌心不发射，腕部不发射。两腕从画面左下边缘进入，双手轮廓彼此独立，全部发射指端清晰可数、不被墨雾遮挡。这是六路并列的原创视觉总览，而非复刻原著某一帧或规定实战手势。
    构图：横幅 1536×1024（3:2），略俯视的近景三分之四视角。双手集中在画面左侧约四分之一的区域，六股剑气向右前方轻微扇形展开，上下错开、互不交叉；每一道都有独立指端起点与独立远端收梢，正好六道，不能藏进同一束。气劲贯穿中部至右侧，末端都在画内消失。六股之间必须保留宽阔空白，总体一半以上纸白，形态轻、薄、长，空白比墨线更重要。
    水墨技法：淡墨与留白表现“无形”。每道剑气是一条极窄而不连续的纸白空气裂隙，两侧只用若隐若现的浅灰干笔、微小断线与湿墨晕开来暗示边界；绝不画白色发光条或有实体刃面的剑。起点略实，中段逐步透明消隐，远端只有数笔飞白与极淡扩散墨雾。半透明层叠使纸底可见，墨分浓淡但整体比掌法更轻。速度感来自尖细收锋、线条疏密与断续，不来自电光。少量墨粒仅贴随六道主路径，不能形成第七道剑气。手部为真实结构的淡墨手绘，手纹极克制，腕袖有干笔布纹，绝不喧宾夺主。
    背景与光线：与淡暖宣纸上的水墨概念画一致，柔和漫射光、左上微亮，浅暖白纸底、极轻纸纹，没有地面投影、场景布置或 UI。灰度层次精致，意境空灵、寂静而凌厉。
    透明性：本图保留浅纸底，不要求文件 alpha 透明；“透明”指剑气以透底、断线和留白形成的视觉层次。
    排除项：不要文字、汉字、书法、题签、印章、签名、水印、标志、边框、分镜格；不要现代元素、现代服饰、清代马蹄袖、明代网巾、日式服饰、欧式奇幻甲胄；不要真人演员脸、影视剧版造型、任何在世或近现代画师风格名、已有插画或剧照复刻；不要霓虹、激光、蓝色电弧、火焰、满屏金光、游戏 HUD、科幻法阵、塑料 3D 材质、动漫大眼、血腥、裸露；不要多指、缺指、融合手指、断腕或不自然关节。另不要实体金属剑、持剑、六指手、把六股都从一根手指出发、掌心能量球、机械平行激光、彩色光束、任何招名或穴位标签。
