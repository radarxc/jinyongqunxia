  notes: "按作者第 1 轮审批意见返修。作者意见原文：「降龙十八掌应该是金色，龙应该从整个掌面透出，而不是从掌心（现在看起来像在喷墨不好）。要气势磅礴」。本轮共 3 张候选（含续作前 1 张），选第 2 张；全部 view_image 复核。金色为主，整掌宽面透出金色气幕，大尺度回旋龙身、龙首略实，躯干透明、飞白消散；五指独立可数、掌纹可见。最上龙角距顶边很近，外层笔势出画，作为裁切余量局限保留，主龙首与手掌完整。AI 生成原创视觉表现；金龙、光色与手势是（原创扩展），不复原原著动作，不将亢龙改为绝招。年代引用 design/02 §1.3.2 / chapters/02 §1，为游戏推定（待考）；普通招与外放归 catalog/skills-wujue / design/05、21。PNG 原图逐字节复制，RGB，无 alpha；透底只是画内观感。新增自包含 HTML 已做语法与隔离运行检查，浏览器视觉与真机性能（待实测）。created 实测原图文件创建时间并转 UTC。model/effort 沿 assets/README 的指定执行配置登记，工具未披露独立图像后端型号。无外部参考输入；仅为 candidate，待作者审批。"

