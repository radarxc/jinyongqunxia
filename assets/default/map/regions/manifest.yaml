  subject: 巴蜀区域局部图（rg_bashu）：跨书界共用的水墨区域底图，覆盖经 102.75–109.71E、纬 29.31–32.12N；北上南下、西左东右，图上无字。
  prompt: '为《金庸群侠传·天书录》默认风格包制作一幅古风水墨地图。

    题材：巴蜀区域局部图（rg_bashu），覆盖经度 102.75–109.71E、纬度 29.31–32.12N。书界：跨书界共用的地理底图，不写任何一代的城名。年代：山川地貌为主，建筑只用克制的城垣、缓坡瓦顶、木构屋舍、素朴佛塔等识别轮廓，不复刻明清城楼或现代景区。

    参考图：assets/default/baseline/map/ref_map_jianghu__ch01_base01.png（画风）、assets/default/baseline/map/ref_map_dali__ch01_base01.png（局部图构图）；只继承已审定参考的水墨层次、纸本质感、留白和地图符号语言，不沿用其地名与方位。

    地理依据：docs/design/map/regions.yaml（rg_bashu）、cities.yaml、sects.yaml、routes.yaml。必须保持的相对位置与方向：成都在西部；重庆在南部；都江堰（灌县）在西部；奉节在东部；乐山在西南；巴中在北部；达州在东北；阆中在北部。

    主要地标：峨眉派（峨眉山金顶一带）、青城派（青城山）、蜀中唐门（蜀中唐家堡支线锚点）、长江。相邻区域（画面边缘延伸方向）：秦巴汉水、荆襄、湖湘、大理苍山、云滇黔中、青藏。

    构图：北上南下、西左东右，近俯视山水地图，横向 3:2，目标 1536×1024；主要城市用细小墨笔的城垣 / 屋舍符号标位，门派驻地用素朴殿宇或山门符号，重点地标清楚而不铺满画面。

    山脉用浓淡墨和干笔皴擦，河流与湖面以留白和淡墨线表现，道路用细虚墨线。温暖纸白、细微宣纸纤维，柔和均匀纸面光，疏朗云雾；纸纹不盖住河道、城墙或佛塔。

    在水面、云雾、平缓地带保留疏朗空隙供运行时叠加标签，纸白合计目标至少 35%。地图默认无人物，不生成任何文字、题字、印文或方位字。

    此图为山水地图美术示意，不作精确历史疆域图或建筑复原图；山峰和地标可为识别适度夸张，但不水平翻转、不为了构图倒置东西关系。

    排除项：不要文字、汉字、字母、数字、伪字、书法、题跋、印文、签名或装饰水印；不要现代城市天际线、公路、铁路、汽车、电线、现代桥梁、景区设施、卫星底图、经纬网、现代国界省界；不要跨时代城楼宫殿、日式鸟居、欧美城堡或奇幻铠甲；不要摄影写实、3D 塑料材质、赛博朋克、霓虹、动漫大眼人物；不要人物、商旅、演员面孔；不要把地图翻转或颠倒东西南北。

    补充要求（务必遵守）：本条消息附带两张参考图——第一张 ref_map_jianghu__ch01_base01.png 是画风参考，第二张 ref_map_dali__ch01_base01.png 是局部图构图参考；只学习它们的水墨层次、纸本质感、留白和地图符号语言，不照搬其中的山水布局、湖岸形状、塔和城池，画面内容按上面的地理要点重新布局。画面上绝对不要出现任何文字：不写城名、方位字、题跋、印章、签名、数字或字母。方位固定为北上南下、西左东右，不得镜像或旋转。输出一张横幅 3:2 的地图（宽:高 = 3:2，宽大于高），不加画框、卷轴或边框。

    画风要求（作者 10-03 已选定的画法）：与第一张参考图（江湖总图）同一种画法与设色——满幅水墨山水铺满整幅画面（不留大片空白纸边），远近山峦浓淡层次分明、云雾穿插，留白主要来自云雾和水面；城池、寺院和塔只画成很小的图标点缀、不放大成主体，塔楼数量克制（每处寺院至多一座塔）；河流与湖海水面用淡蓝色轻染；湖泊轮廓和河道走向尽量贴近真实地理，深谷大河的走向要看得出来。'
