    山脉用浓淡墨和干笔皴擦，河流与湖面以留白和淡墨线表现，道路用细虚墨线。温暖纸白、细微宣纸纤维，柔和均匀纸面光，疏朗云雾；纸纹不盖住河道、城墙或佛塔。

    在水面、云雾、平缓地带保留疏朗空隙供运行时叠加标签，纸白合计目标至少 35%。地图默认无人物，不生成任何文字、题字、印文或方位字。

    此图为山水地图美术示意，不作精确历史疆域图或建筑复原图；山峰和地标可为识别适度夸张，但不水平翻转、不为了构图倒置东西关系。

    排除项：不要文字、汉字、字母、数字、伪字、书法、题跋、印文、签名或装饰水印；不要现代城市天际线、公路、铁路、汽车、电线、现代桥梁、景区设施、卫星底图、经纬网、现代国界省界；不要跨时代城楼宫殿、日式鸟居、欧美城堡或奇幻铠甲；不要摄影写实、3D 塑料材质、赛博朋克、霓虹、动漫大眼人物；不要人物、商旅、演员面孔；不要把地图翻转或颠倒东西南北。

    补充要求（务必遵守）：本条消息附带两张参考图——第一张是作者已审的江湖总图（ref_map_jianghu__ch01_base01.png）中部的一小块裁图，只用来看笔墨、设色、云雾和城池小图标的画法；第二张 ref_map_dali__ch01_base01.png 是局部图构图参考。这不是改图任务：请按本区域的地理要点重新起稿，画一张全新的地图，不要把参考图放大、延展、拼接或在参考图上修改，也不要沿用参考图里的山水布局、湖岸形状、塔和城池位置。画面上绝对不要出现任何文字：不写城名、方位字、题跋、印章、签名、数字或字母。方位固定为北上南下、西左东右，不得镜像或旋转。输出一张横幅 3:2 的地图（宽:高 = 3:2，宽大于高），不加画框、卷轴或边框。

    画风要求（作者 10-03 已选定的画法）：与第一张参考图（江湖总图）同一种画法与设色——满幅水墨山水铺满整幅画面（不留大片空白纸边），远近山峦浓淡层次分明、云雾穿插，留白主要来自云雾和水面；城池、寺院和塔只画成很小的图标点缀、不放大成主体，塔楼数量克制（每处寺院至多一座塔）；河流与湖海水面用淡蓝色轻染；湖泊轮廓和河道走向尽量贴近真实地理，深谷大河的走向要看得出来。笔墨要求：山峦像第一张参考图那样画成一座座立体的写意山峰，浓淡墨皴擦、山腰山脚有云雾缭绕，平地有点点树丛与田畴；不要画成密集排线、等高线式山脊或版画排线；海岸线和河岸用淡墨细线带出，不要粗黑描边；整体是设色淡雅的水墨山水画，而不是线描地图。地理提示：福建东面和南面临海（台湾海峡），海岸线曲折、港湾与近海小岛多；西北是武夷山脉，内陆多山少平原。再次提醒：第一张参考裁图里的那条蜿蜒大河、成片平原和城池都不属于本区域，画面构图不得与它相似。'
