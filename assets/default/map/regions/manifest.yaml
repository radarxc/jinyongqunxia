  prompt: '为《金庸群侠传·天书录》默认风格包制作一幅古风水墨地图。

    题材：巴蜀区域局部图（rg_bashu），覆盖经度 102.75–109.71E、纬度 29.31–32.12N。书界：跨书界共用的地理底图，不写任何一代的城名。年代：山川地貌为主，建筑只用克制的城垣、缓坡瓦顶、木构屋舍、素朴佛塔等识别轮廓，不复刻明清城楼或现代景区。

    参考图：assets/default/baseline/map/ref_map_jianghu__ch01_base01.png（画风）、assets/default/baseline/map/ref_map_dali__ch01_base01.png（局部图构图）；只继承已审定参考的水墨层次、纸本质感、留白和地图符号语言，不沿用其地名与方位。

    地理依据：docs/design/map/regions.yaml（rg_bashu）、cities.yaml、sects.yaml、routes.yaml。必须保持的相对位置与方向：成都在西部；重庆在南部；都江堰（灌县）在西部；奉节在东部；乐山在西南；巴中在北部；达州在东北；阆中在北部。

    主要地标：峨眉派（峨眉山金顶一带）、青城派（青城山）、蜀中唐门（蜀中唐家堡支线锚点）、长江。相邻区域（画面边缘延伸方向）：秦巴汉水、荆襄、湖湘、大理苍山、云滇黔中、青藏。

    构图：北上南下、西左东右，近俯视山水地图，横向 3:2，目标 1536×1024；主要城市用细小墨笔的城垣 / 屋舍符号标位，门派驻地用素朴殿宇或山门符号，重点地标清楚而不铺满画面。

    山脉用浓淡墨和干笔皴擦，河流与湖面以留白和淡墨线表现，道路用细虚墨线。温暖纸白、细微宣纸纤维，柔和均匀纸面光，疏朗云雾；纸纹不盖住河道、城墙或佛塔。

    在水面、云雾、平缓地带保留疏朗空隙供运行时叠加标签，纸白合计目标至少 35%。地图默认无人物，不生成任何文字、题字、印文或方位字。

    此图为山水地图美术示意，不作精确历史疆域图或建筑复原图；山峰和地标可为识别适度夸张，但不水平翻转、不为了构图倒置东西关系。

    排除项：不要文字、汉字、字母、数字、伪字、书法、题跋、印文、签名或装饰水印；不要现代城市天际线、公路、铁路、汽车、电线、现代桥梁、景区设施、卫星底图、经纬网、现代国界省界；不要跨时代城楼宫殿、日式鸟居、欧美城堡或奇幻铠甲；不要摄影写实、3D 塑料材质、赛博朋克、霓虹、动漫大眼人物；不要人物、商旅、演员面孔；不要把地图翻转或颠倒东西南北。

    补充要求（务必遵守；作者 AR-52：大地图一律以实际地图地势为基础，不要偏离）：本条消息实际附带两张参考图，以此为准——第一张是本区域的真实地势底图（Natural Earth 真实晕渲地形，按 Albers 等积投影裁出：明暗起伏就是真实的山地、高原、峡谷、盆地与平原，浅蓝为海，深色细线为海岸线，蓝线为主要河流的大致位置，深色小方块为城池位置）；第二张是作者已审江湖总图里四小块画风样张的拼图，只用来看笔墨、设色与城池图标的画法。请把第一张底图当作要重新上色的地图草稿：取景范围、比例、方位、海陆分布、海岸线形状、河道走向和山地平原的分布都与底图完全一致——底图起伏强烈处画成山峦，平滑处画成平原盆地，河流沿底图河谷走；不得挪动、增删底图上的河流与山脉，不得把陆地画成水面或海；底图没画出的湖泊与较小河流，按后文的地理提示补画在陆地上的正确位置。在这个骨架上用作者选定的水墨山水画法画出山峦、云雾、河湖与平原，城池在小方块处画成很小的城垣图标，寺院按地理要点画成很小的殿宇图标。画面上绝对不要出现任何文字：不写城名、方位字、题跋、印章、签名、数字或字母。方位固定为北上南下、西左东右，不得镜像或旋转。输出一张横幅 3:2 的地图（与底图同样的宽高比），不加画框、卷轴或边框。

    画风要求（作者 10-03 选定的画法）：与第二张参考图（江湖总图样张）同一种画法与设色——满幅水墨山水，远近山峦浓淡层次分明、云雾穿插，留白主要来自云雾和水面；城池、寺院和塔只画成很小的图标点缀，塔楼数量克制（每处寺院至多一座塔）；河流与湖海水面用淡蓝色轻染。笔墨要求：山峦画成一座座立体的写意山峰，浓淡墨皴擦、山腰山脚有云雾缭绕，平地有点点树丛与田畴；不要画成密集排线、等高线式山脊或版画排线；海岸线和河岸用淡墨细线带出，不要粗黑描边；整体是设色淡雅的水墨山水画，而不是线描地图。底图未画出的湖泊与较小河流按此补画——地理提示：西部是川西高山（可有雪峰），中部是四周环山的四川盆地，成都平原在盆地西部，长江自西南向东流经重庆后进入东部峡谷。第二张样张里的山形、河道、海岸和城池都不属于本区域；新图是一整幅完整的地图，不要分格、不要拼贴，构图只跟第一张底图走。文字禁令：城池、山、河旁边一律不加任何标签，不写英文、拼音或中文地名，整幅画面零文字。边界禁令：陆地上不要画任何境界线、省界、州界或分区线；细线只用于河流（带淡蓝色）和道路（细虚线）。水面禁令：底图上没有水的地方（米色或灰褐色起伏处）一律不要凭空画湖、海或大片水面；只有底图上的浅蓝海面、蓝色河线，以及地理提示点名的湖泊才画水。'
