    补充要求（务必遵守；作者 AR-52：大地图以实际地图地势为基础，不要偏离）：本条消息实际附带两张参考图，以此为准——第一张是本区域的真实地势底图（Natural Earth 真实晕渲地形与真实水系，按 Albers 等积投影裁出：明暗起伏是真实的山地、峡谷、盆地与平原，浅蓝为海和湖泊，深色细线为海岸线与湖岸，蓝线为真实河道（线越粗河越大），深色小方块为城池位置）；第二张是作者已审江湖总图里四小块画风样张的拼图，只看笔墨、设色与图标画法，不看其中的山水布局。请把第一张底图当作构图骨架：取景范围、比例、方位、海陆分布、海岸线、河道、湖泊与主要山脉走向都按底图，城池小图标放在小方块处；允许用笔墨概括细碎起伏，但不许挪动或增删主要山河湖泊，不得把陆地画成水面。画面上绝对不要出现任何文字：不写城名、方位字、题跋、印章、签名、数字或字母。方位北上南下、西左东右，不得镜像或旋转。输出横幅 3:2（与底图同宽高比），不加画框、卷轴或边框。

