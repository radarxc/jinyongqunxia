- id: map_region_hedong_jinzhong__base
  file: rg_hedong_jinzhong.png
  category: map
  style: default
  subject: 河东与晋中区域局部图（rg_hedong_jinzhong）：跨书界共用的水墨区域底图，覆盖经 110.75–113.55E、纬 34.78–40.34N；北上南下、西左东右，图上无字。
  prompt: '为《金庸群侠传·天书录》默认风格包制作一幅古风水墨地图。

    题材：河东与晋中区域局部图（rg_hedong_jinzhong），覆盖经度 110.75–113.55E、纬度 34.78–40.34N。书界：跨书界共用的地理底图，不写任何一代的城名。年代：山川地貌为主，建筑只用克制的城垣、缓坡瓦顶、木构屋舍、素朴佛塔等识别轮廓，不复刻明清城楼或现代景区。

    参考图：assets/default/baseline/map/ref_map_jianghu__ch01_base01.png（画风）、assets/default/baseline/map/ref_map_dali__ch01_base01.png（局部图构图）；只继承已审定参考的水墨层次、纸本质感、留白和地图符号语言，不沿用其地名与方位。

    地理依据：docs/design/map/regions.yaml（rg_hedong_jinzhong）、cities.yaml、sects.yaml、routes.yaml。必须保持的相对位置与方向：大同在东北；长治在东南；临汾在西南；朔州在北部；太原在中部；运城在西南；晋城在东南；平遥在中部。

    主要地标：恒山派（北岳恒山见性峰一带）、秦家寨（云州秦家寨锚点）、威信镖局（晋中—京城镖路总局锚点）、日月神教（河北黑木崖小说锚点（待考））、太行山脉、黄河。相邻区域（画面边缘延伸方向）：燕京与直隶、中原、关中陕北、漠南。

    构图：北上南下、西左东右，近俯视山水地图，横向 3:2，目标 1536×1024；主要城市用细小墨笔的城垣 / 屋舍符号标位，门派驻地用素朴殿宇或山门符号，重点地标清楚而不铺满画面。

    山脉用浓淡墨和干笔皴擦，河流与湖面以留白和淡墨线表现，道路用细虚墨线。温暖纸白、细微宣纸纤维，柔和均匀纸面光，疏朗云雾；纸纹不盖住河道、城墙或佛塔。

    在水面、云雾、平缓地带保留疏朗空隙供运行时叠加标签，纸白合计目标至少 35%。地图默认无人物，不生成任何文字、题字、印文或方位字。

    此图为山水地图美术示意，不作精确历史疆域图或建筑复原图；山峰和地标可为识别适度夸张，但不水平翻转、不为了构图倒置东西关系。

    排除项：不要文字、汉字、字母、数字、伪字、书法、题跋、印文、签名或装饰水印；不要现代城市天际线、公路、铁路、汽车、电线、现代桥梁、景区设施、卫星底图、经纬网、现代国界省界；不要跨时代城楼宫殿、日式鸟居、欧美城堡或奇幻铠甲；不要摄影写实、3D 塑料材质、赛博朋克、霓虹、动漫大眼人物；不要人物、商旅、演员面孔；不要把地图翻转或颠倒东西南北。

    补充要求（务必遵守；作者 AR-52：大地图以实际地图地势为基础，不要偏离）：本条消息实际附带两张参考图，以此为准——第一张是本区域的真实地势底图（Natural Earth 真实晕渲地形与真实水系，按 Albers 等积投影裁出：明暗起伏是真实的山地、峡谷、盆地与平原，浅蓝为海和湖泊，深色细线为海岸线与湖岸，蓝线为真实河道（线越粗河越大），褐色小城垣符号为城池位置；晕渲已做模糊，只表示山体大势）；第二张是作者已审江湖总图里四小块画风样张的拼图，只看笔墨、设色与图标画法，不看其中的山水布局。请把第一张底图当作构图骨架：取景范围、比例、方位、海陆分布、海岸线、河道、湖泊与主要山脉走向都按底图，城池小图标放在小城垣符号处；允许用笔墨概括细碎起伏，但不许挪动或增删主要山河湖泊，不得把陆地画成水面。画面上绝对不要出现任何文字：不写城名、方位字、题跋、印章、签名、数字或字母。方位北上南下、西左东右，不得镜像或旋转。输出横幅 3:2（与底图同宽高比），不加画框、卷轴或边框。

    画法要求（作者选定 C 版的写意画法）：山体画成一座座立体的写意山峰（像第二张样张里的山），主山脊浓墨、远山淡墨带过，山腰山脚云雾缭绕；平地、盆地与云雾多留白，整体疏朗，是淡设色的水墨山水；水面淡蓝轻染；城池、寺院、塔只画很小的图标，塔楼数量克制；不要照描底图晕渲的细碎沟壑纹理，不要画成「晕渲地形图上墨」的效果，也不要画成线描地图。地理提示只帮助理解底图，水面一律以底图为准——地理提示：西边黄河自北向南穿过峡谷，东边太行山南北纵列，中部汾河谷地自北向南，北部是五台山、恒山一带山地。画面东半部是华北平原陆地，只有右上角一小块浅蓝是渤海湾；平原上只画田畴、村落与细河，不画海水。水面要求：海和湖只出现在底图浅蓝处（海面约占画面 1%），海岸线、湖岸照底图；底图上米黄色的地方全是陆地（包括大片平原），不得画成海、湖或大片水色；陆地上除底图蓝色河线外，不得凭空画湖或大片水面。第二张样张里的山形、河道、海岸和城池都不属于本区域；新图是一整幅完整的地图，不要分格、不要拼贴。文字禁令：城池、山、河旁边一律不加任何标签，不写英文、拼音或中文地名。边界禁令：陆地上不要画任何境界线、省界或分区线；细线只用于河流（淡蓝）和道路（细虚线）。画面是山水画不是地形图：把底图的起伏归纳成一组组有明确轮廓的写意山峰与丘陵（像第二张样张里的山，浓淡墨皴擦、留白云雾），平原、河谷和盆地大片留白，不要在整幅画面铺满细碎的晕渲纹理或沟壑笔触。设色淡雅：以墨色为主，山脚与平原薄染淡赭石，部分山腰薄染淡青绿，水面淡蓝；只借第二张样张的色调与笔法，山川河湖的位置与走向一律按第一张底图。对位要求：底图上每一条蓝色河线都画在同样的位置、同样的弯折（粗线画成大河，细线画成细河），每一片浅蓝湖面画在同样的位置、同样的形状和大小，海岸线照底图轮廓，高山深谷沿底图晕渲里的山脊与峡谷走向排布。底图上的褐色小城垣符号表示城池位置，成品里在同一位置画很小的城池屋舍图标，不要画成方块、方印、圆点或标签。零文字：城池旁边绝不写任何地名（中文、英文、拼音都不行），图上不出现任何汉字、字母或数字。上下左右位置自检：底图上靠近下边的河谷、平原和城池，成品里也要在同样靠下的位置，靠上的同理；不要为了构图把河谷、平原整体上移或下移，也不要把画面边缘的山脉放大去挤占河谷与平原。


    【同会话局部修补（main 10-03 批准：整张合格、只有一两处局部毛病可在同一会话改一次）】请在你刚生成的这张地图上只做一处局部修改：画面左下部（西南方、黄河以西的陕北黄土高原一带）那两个浅蓝色湖泊改成陆地——画成与周围一致的米黄色黄土坡地，可加几笔淡墨小丘，不留任何水面。除这两处外，画面其他所有内容（山峰、河道、城池小图标、道路、云雾、设色、构图、比例、尺寸）一律保持原样不变，不要新增任何湖泊、文字、方块或标记，不要裁切或改变取景。输出同样的横幅 3:2 整图。'
