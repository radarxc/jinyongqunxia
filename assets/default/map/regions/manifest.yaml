    画法要求（作者选定 C 版的写意画法）：山体画成一座座立体的写意山峰（像第二张样张里的山），主山脊浓墨、远山淡墨带过，山腰山脚云雾缭绕；平地、盆地与云雾多留白，整体疏朗，是淡设色的水墨山水；水面淡蓝轻染；城池、寺院、塔只画很小的图标，塔楼数量克制；不要照描底图晕渲的细碎沟壑纹理，不要画成「晕渲地形图上墨」的效果，也不要画成线描地图。地理提示只帮助理解底图，水面一律以底图为准——地理提示：北部是草原与荒漠，南缘是东西走向的阴山山脉与长城一线，东南接燕山，西南有黄河河套。水面要求：海和湖只出现在底图浅蓝处（海面约占画面 2%），海岸线、湖岸照底图；底图上米黄色的地方全是陆地（包括大片平原），不得画成海、湖或大片水色；陆地上除底图蓝色河线外，不得凭空画湖或大片水面。第二张样张里的山形、河道、海岸和城池都不属于本区域；新图是一整幅完整的地图，不要分格、不要拼贴。文字禁令：城池、山、河旁边一律不加任何标签，不写英文、拼音或中文地名。边界禁令：陆地上不要画任何境界线、省界或分区线；细线只用于河流（淡蓝）和道路（细虚线）。画面是山水画不是地形图：把底图的起伏归纳成一组组有明确轮廓的写意山峰与丘陵（像第二张样张里的山，浓淡墨皴擦、留白云雾），平原、河谷和盆地大片留白，不要在整幅画面铺满细碎的晕渲纹理或沟壑笔触。设色淡雅：以墨色为主，山脚与平原薄染淡赭石，部分山腰薄染淡青绿，水面淡蓝；只借第二张样张的色调与笔法，山川河湖的位置与走向一律按第一张底图。对位要求：底图上每一条蓝色河线都画在同样的位置、同样的弯折（粗线画成大河，细线画成细河），每一片浅蓝湖面画在同样的位置、同样的形状和大小，海岸线照底图轮廓，高山深谷沿底图晕渲里的山脊与峡谷走向排布。底图上的褐色小城垣符号表示城池位置，成品里在同一位置画很小的城池屋舍图标，不要画成方块、方印、圆点或标签。零文字：城池旁边绝不写任何地名（中文、英文、拼音都不行），图上不出现任何汉字、字母或数字。上下左右位置自检：底图上靠近下边的河谷、平原和城池，成品里也要在同样靠下的位置，靠上的同理；不要为了构图把河谷、平原整体上移或下移，也不要把画面边缘的山脉放大去挤占河谷与平原。


    【同会话局部修补（main 10-03 批准：整张合格、只有一两处局部毛病可在同一会话改一次）】请在你刚生成的这张地图上只做一处局部修改：画面正中偏右、紧贴大山脉西侧的那个较大的浅蓝色湖泊（下端有一个缺口、像倒放的勺子）改成陆地，画成与周围一致的米黄色草原坡地，不留任何水面；画面上部那个很小的湖保留不动。除这一处外，画面其他所有内容（山峰、河道、黄河河套、海岸、城池小图标、道路、云雾、设色、构图、比例、尺寸）一律保持原样不变，不要新增任何湖泊、文字、方块或标记，不要裁切或改变取景。输出同样的横幅 3:2 整图。'
