    summary: 内城（京城）：东西墙沿元大都、北墙洪武元年南缩、南墙永乐十七年南移；西北缺角；九门、四角楼；皇城：皇城红墙：天安门在南、地安门在北，西南角内凹，南出千步廊至大明门；紫禁城（宫城）：宫城东西 753 m、南北 961 m，四角楼，筒子河环绕；天地坛坛墙（1420）：永乐十八年仿南京大祀坛建天地坛；嘉靖九年（1530）始专祭天、建圜丘，本档 1523 年尚为天地合祀；axis_s：中轴：永定门—正阳门—大明门—承天门—午门—三大殿—玄武门—万岁山—北安门—鼓楼—钟楼；nanhai：永乐年间向南开拓中海、南海，三海合称西苑；yuhe：玉河（通惠河城内段）；奉天殿（三大殿之首）：三大殿居宫城中轴前部；用年代套件殿堂件代表，体量放大约 6 倍以便地图可辨；鼓楼：鼓楼在元中心阁旧址、钟楼在其北 100 m；套件无钟鼓楼件，借同年代城门楼件（砖台 + 楼阁）；妙应寺白塔（元至元十六年 1279）：元塔明清续存；明 / 清套件无覆钵塔，借元北方套件同型件；大祀殿（天地坛，方殿）：1420 年天地坛主殿为方形大祀殿；圆形大享殿 1545 年才建
