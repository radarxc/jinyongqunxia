    summary: 杭州府城（元末张士诚 1359 年重筑）：南界缩至万松岭（凤凰山与南宋故宫截在城外）、东界外扩至贴沙河；明代十门；yujie：中轴大街（南宋御街故道）；xihu：西湖在城西、湖在城外；qiantang：钱塘江在城东南，皇城「南达钱塘江边」；江面宽度示意；yanqiao：盐桥河（中河），城内主运河；雷峰塔（嘉靖年间焚余砖身）：西湖南岸夕照山；明嘉靖年间倭寇焚塔，木檐尽毁仅存赭色砖身；六和塔：钱塘江畔月轮山；距离向城压缩（真实在城西南约 3 km）
