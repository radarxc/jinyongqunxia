  subject: 北京·明北京（永乐迁都后、嘉靖筑外城前：内城方城 + 南郊天地坛，1523）：按年代布局小景（北上略俯斜水墨，透明底，AR-113）。标志：奉天殿（三大殿之首）、乾清宫（后三宫）、鼓楼、钟楼、妙应寺白塔（元至元十六年 1279）、太庙、社稷坛、山川坛 / 先农坛殿、大祀殿（天地坛，方殿）、广寒殿（琼华岛，1579 年倒塌前）
