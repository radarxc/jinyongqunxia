  footprint_grid: 11
  layout_basis:
    summary: 外城（罗城、新城）：外城周长 50 里 165 步（约 28 km），略呈不规则四边形；13 门与水门；内城（里城、旧城）：内城八门，规模与清代开封城相近；金南京宫城（1161 年重建于宋宫故址）：皇城东西约 1050 m、南北约 1090 m，居内城北部正中；yujie：御街：宣德门—州桥—朱雀门—南薰门；bianhe：汴河自西水门入城，贯内城，州桥（天汉桥）跨其上，出东水门；金代漕运已废，画作干涸故道；大相国寺：内城南部、汴河之南、御街之东（位置推定）；开宝寺塔（铁塔，1049）：八角十三层楼阁式琉璃砖塔；在内城东北（位置推定）；天清寺塔（繁塔）：城东南繁台上，六角楼阁式（元代尚存七层）
