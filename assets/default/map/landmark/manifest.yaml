  layout_basis:
    summary: 西安府城：洪武七至十一年以唐皇城西、南墙为基向东、北扩建；东墙 2683 m、西墙 2626 m、南墙 4194 m、北墙 4134 m；隆庆二年（1568）始包砖——本档 1523 年仍为夯土墙；秦王府萧墙：明秦王府在城东北隅（后为满城依托之旧基、今新城一带）；府城尺寸推定；钟楼（洪武十七年 1384，原址广济街口迎祥观）：万历十年（1582）才东迁至四街交会处；1523 年仍在西大街广济街口，与鼓楼对峙；大雁塔（大慈恩寺）：方形楼阁式砖塔；仓库套件无方形唐塔，用基线千寻塔方形砖塔件纵向压缩表现敦实轮廓（确定性变换）；城外位置按方位示意、距离压缩；小雁塔（荐福寺塔，707–709）：方形密檐砖塔，与千寻塔同型（唐式方形密檐），用基线件原比例；西安府学 · 碑林：府学与碑林在城内东南、近南城墙（推定位置）
