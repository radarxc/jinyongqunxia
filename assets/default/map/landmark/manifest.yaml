  subject: 北京·明北京（嘉靖三十二年筑外城后「凸」字形，1553–1644）：按年代布局小景（北上略俯斜水墨，透明底，AR-113）。标志：奉天殿（三大殿之首）、乾清宫（后三宫）、鼓楼、钟楼、妙应寺白塔（元至元十六年 1279）、太庙、社稷坛、山川坛 / 先农坛殿、大享殿（乾隆十六年改名祈年殿）、圜丘（嘉靖九年 1530）
