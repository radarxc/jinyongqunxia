  notes: AR-111 正式底图（替换 10-10 临时占位）。确定性合成，未调用任何出图模型：Natural Earth 10m 海陆 / 小岛 / 湖泊 / 河流 + ETOPO 2022 60″ 高程，在 CanvasProjection(4096, 3072, 144)（= 内容网格 CanvasProjection(512,384,18) ×8）上直接画；笔墨全部取自仓库现有水墨贴图（references 逐件列出）。命令 python3 tools/map/paint/compose_world.py --deliver；参数 tools/map/paint/config.json（sha256 1420b635441c4a6b0f7a423d1782d543b455a6b09c9fbd496daa574628dcb2c9），种子 20261011；tools/map/paint/compose.lock.json 记录输入、素材与输出哈希，--check 通过（输入哈希、10 个开放节点投影偏差 ≤0.53 网格单位、两次独立构建逐字节一致），--deliver 重跑与本文件逐字节一致。像素 = 网格 × 8（运行时按 naturalWidth / 512 换算）。无放大，4096 原生渲染；WebP q85 method 6。另有 map_world_jianghu__base01_preview.webp（1024×768，同源缩小，未单独登记）。对齐指标：陆地 IoU 按构造 = 1（画面海陆即 GIS 掩膜，山体层按陆地掩膜裁切，岸线淡墨压在 GIS 岸线上），岸线偏差 0；开放节点（14 章合计 2412 个）2399 个落在陆上，其余 13 个均为秦皇岛 [351,166] 整数坐标落在岸线外 1 px@1024，按 ≤1 网格单位岸线容差计 2412/2412；河流关键点离画出河道（px@1024）：兰州 0.24、武昌 0.38、南京 1.11、重庆 0.08、开封北黄河 0.22。山件 618（审样前 1234）：山脉 275、山峰 197、小石山 94、丘陵 26、雪山 26；树丛 552、平原小景 29、近岸海面小景 37；大河 143 段、支流 219 段。已知瑕疵：日本、朝鲜等窄岛上的山件受陆地宽度限制偏小；平原只有淡色地表与零星树丛（没有田畴线）；岸线笔触条宽度全线一致；小于约 2 px 的岛只有岸线没有山；河道为 Natural Earth 现代河道（黄河下游今道，与 design/19 一致），支流按 scalerank ≤7 取舍（渭河、汾河等未画）。质检：.agents/coord/ART-worldmap-painted/qa/（metrics.json、各区 100% 局部、节点与道路叠图、新旧对照）。
